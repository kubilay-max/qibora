<script>
const VERI = {"en":{"langName":"English","title":"Qibora – Privacy Policy","updated":"Last updated: 24 October 2026","intro":"Qibora (“the app”) helps you find the qibla direction and nearby mosques. This policy explains what information the app uses, where it goes and the choices you have. In short: the qibla is calculated on your phone, we do not run servers that store your location, and we do not sell your personal data.","sections":[{"h":"1. Your location","p":["The app asks for your location only while you use it. Your location is used on your phone to calculate the qibla direction and the distance to the Kaaba. It is not sent to our servers and we do not store it.","When you open the Map screen to see nearby mosques, the app sends an approximate location, rounded to about 1 km, to the free OpenStreetMap Overpass service (overpass-api.de, or overpass.kumi.systems as a backup) to look up mosques around you. No name, account or device identifier is attached to this request. Mosque data © OpenStreetMap contributors, available under the ODbL licence.","The map itself is displayed by your phone’s map service (Apple Maps on iPhone, Google Maps on Android), which is subject to Apple’s or Google’s own privacy policy."]},{"h":"2. Camera","p":["The camera is used only on the AR screen, to show the qibla direction over the live camera view. Images are processed on your phone in real time; nothing is recorded, saved or uploaded."]},{"h":"3. Information stored on your phone","p":["Your settings (chosen design, theme, text size, last used screen and similar preferences) are stored only on your phone. Deleting the app deletes them."]},{"h":"4. Anonymous usage statistics","p":["To understand which features are used and to fix problems, the app sends anonymous usage events (for example: which screen was opened, whether the qibla was found, the app version and device type) to PostHog, hosted on servers in the European Union. These events do not include your name, your location or camera images. As with any internet connection, your IP address may be processed by the service, for example to estimate the country.","You can turn this off at any time in Settings → “Usage statistics”."]},{"h":"5. Advertising","p":["The free version of Qibora shows ads provided by Google AdMob. Google may use your device’s advertising identifier and similar information to show and measure ads, and, with your permission, to personalise them.","On iPhone, personalised ads are used only if you allow tracking when the app asks. In the European Economic Area, the United Kingdom and Switzerland, a consent window lets you choose how your data is used for ads. You can also reset or limit your advertising identifier in your phone’s settings.","Ads are filtered to be suitable for a general audience. More information: https://policies.google.com/technologies/ads","Qibora Pro removes all ads."]},{"h":"6. Purchases","p":["Qibora Pro is sold through the App Store or Google Play. Payments are handled entirely by Apple or Google; we never see your card or payment details.","To confirm which purchases you own and to restore them, the app uses RevenueCat, which receives an anonymous app user ID and your store purchase receipts. It does not receive your name or payment details."]},{"h":"7. Children","p":["Qibora is a general-audience app and is not directed at children under 13. We do not knowingly collect personal information from children."]},{"h":"8. Your choices and rights","p":["You can deny or withdraw location and camera permission in your phone’s settings (the app will not be able to find the qibla without location), turn off usage statistics in the app, change your ad consent or tracking choice, and delete all locally stored data by deleting the app.","Depending on where you live (for example under the GDPR, the UK GDPR, Turkey’s KVKK or California’s CCPA), you may have the right to access, correct or delete personal data and to object to its processing. Because we do not hold data that identifies you, most requests can be met with the options above; you can also contact us at the address below."]},{"h":"9. Changes to this policy","p":["We may update this policy when the app changes. The date at the top shows the latest version."]},{"h":"10. Contact and support","p":["For questions about this policy, help with the app, or problems with a purchase, write to us at miswakapp@gmail.com."]}],"langLabel":"Language","supportTitle":"Support","supportText":"Need help with Qibora or a purchase? Email us at miswakapp@gmail.com — we usually reply within a few days."},"tr":{"langName":"Türkçe","title":"Qibora – Gizlilik Politikası","updated":"Son güncelleme: 24 Ekim 2026","intro":"Qibora (“uygulama”), kıble yönünü ve yakınınızdaki camileri bulmanıza yardımcı olur. Bu politika, uygulamanın hangi bilgileri kullandığını, bu bilgilerin nereye gittiğini ve sahip olduğunuz seçenekleri açıklar. Kısacası: kıble telefonunuzda hesaplanır, konumunuzu saklayan sunucular işletmeyiz ve kişisel verilerinizi satmayız.","sections":[{"h":"1. Konumunuz","p":["Uygulama, konum izninizi yalnızca uygulamayı kullandığınız sırada ister. Konumunuz, kıble yönünü ve Kâbe’ye olan mesafeyi hesaplamak için telefonunuzda kullanılır. Sunucularımıza gönderilmez ve tarafımızca saklanmaz.","Yakınınızdaki camileri görmek için Harita ekranını açtığınızda uygulama, çevrenizdeki camileri bulmak amacıyla yaklaşık 1 km’ye yuvarlanmış yaklaşık konumunuzu ücretsiz OpenStreetMap Overpass hizmetine (overpass-api.de veya yedek olarak overpass.kumi.systems) gönderir. Bu isteğe herhangi bir ad, hesap veya cihaz tanımlayıcısı eklenmez. Cami verileri © OpenStreetMap katkıda bulunanları; ODbL lisansı kapsamında kullanılabilir.","Haritanın kendisi telefonunuzun harita hizmeti (iPhone’da Apple Haritalar, Android’de Google Haritalar) tarafından görüntülenir ve bu hizmet Apple’ın veya Google’ın kendi gizlilik politikasına tabidir."]},{"h":"2. Kamera","p":["Kamera yalnızca AR ekranında, kıble yönünü canlı kamera görüntüsünün üzerinde göstermek için kullanılır. Görüntüler telefonunuzda gerçek zamanlı olarak işlenir; hiçbir şey kaydedilmez, saklanmaz veya yüklenmez."]},{"h":"3. Telefonunuzda saklanan bilgiler","p":["Ayarlarınız (seçilen tasarım, tema, yazı boyutu, en son kullanılan ekran ve benzeri tercihler) yalnızca telefonunuzda saklanır. Uygulamayı sildiğinizde bu ayarlar da silinir."]},{"h":"4. Anonim kullanım istatistikleri","p":["Hangi özelliklerin kullanıldığını anlamak ve sorunları gidermek için uygulama, anonim kullanım olaylarını (örneğin hangi ekranın açıldığı, kıblenin bulunup bulunmadığı, uygulama sürümü ve cihaz türü) Avrupa Birliği’ndeki sunucularda barındırılan PostHog’a gönderir. Bu olaylar adınızı, konumunuzu veya kamera görüntülerini içermez. Her internet bağlantısında olduğu gibi, IP adresiniz bu hizmet tarafından, örneğin ülkenizi tahmin etmek amacıyla işlenebilir.","Bu özelliği istediğiniz zaman Ayarlar → “Kullanım istatistikleri” bölümünden kapatabilirsiniz."]},{"h":"5. Reklamlar","p":["Qibora’nın ücretsiz sürümü, Google AdMob tarafından sağlanan reklamlar gösterir. Google, reklamları göstermek ve ölçmek, ayrıca izninizle kişiselleştirmek için cihazınızın reklam tanımlayıcısını ve benzeri bilgileri kullanabilir.","iPhone’da kişiselleştirilmiş reklamlar yalnızca uygulama sorduğunda izlemeye izin vermeniz hâlinde kullanılır. Avrupa Ekonomik Alanı, Birleşik Krallık ve İsviçre’de bir onay penceresi, verilerinizin reklamlar için nasıl kullanılacağını seçmenize olanak tanır. Ayrıca reklam tanımlayıcınızı telefonunuzun ayarlarından sıfırlayabilir veya sınırlandırabilirsiniz.","Reklamlar, genel kitleye uygun olacak şekilde filtrelenir. Daha fazla bilgi: https://policies.google.com/technologies/ads","Qibora Pro tüm reklamları kaldırır."]},{"h":"6. Satın alımlar","p":["Qibora Pro, App Store veya Google Play üzerinden satılır. Ödemeler tamamen Apple veya Google tarafından gerçekleştirilir; kart veya ödeme bilgilerinizi hiçbir zaman görmeyiz.","Hangi satın alımlara sahip olduğunuzu doğrulamak ve bunları geri yüklemek için uygulama RevenueCat’i kullanır; RevenueCat, anonim bir uygulama kullanıcı kimliğini ve mağaza satın alım makbuzlarınızı alır. Adınızı veya ödeme bilgilerinizi almaz."]},{"h":"7. Çocuklar","p":["Qibora genel kitleye yönelik bir uygulamadır ve 13 yaşın altındaki çocuklara yönelik değildir. Çocuklardan bilerek kişisel bilgi toplamayız."]},{"h":"8. Seçenekleriniz ve haklarınız","p":["Konum ve kamera iznini telefonunuzun ayarlarından reddedebilir veya geri çekebilir (konum olmadan uygulama kıbleyi bulamaz), kullanım istatistiklerini uygulama içinden kapatabilir, reklam onayınızı veya izleme tercihinizi değiştirebilir ve uygulamayı silerek yerel olarak saklanan tüm verileri silebilirsiniz.","Yaşadığınız yere bağlı olarak (örneğin GDPR (Genel Veri Koruma Tüzüğü), UK GDPR, Türkiye’deki KVKK veya Kaliforniya’daki CCPA kapsamında) kişisel verilere erişme, bunları düzeltme veya silme ve işlenmelerine itiraz etme hakkına sahip olabilirsiniz. Sizi tanımlayan verileri tutmadığımız için taleplerin çoğu yukarıdaki seçeneklerle karşılanabilir; ayrıca aşağıdaki adresten bizimle iletişime geçebilirsiniz."]},{"h":"9. Bu politikadaki değişiklikler","p":["Uygulamada değişiklik olduğunda bu politikayı güncelleyebiliriz. En üstteki tarih, en güncel sürümü gösterir."]},{"h":"10. İletişim ve destek","p":["Bu politikayla ilgili sorularınız, uygulamayla ilgili yardım veya bir satın alımla ilgili sorunlar için bize miswakapp@gmail.com adresinden yazabilirsiniz."]}],"langLabel":"Dil","supportTitle":"Destek","supportText":"Qibora veya bir satın alım konusunda yardıma mı ihtiyacınız var? Bize miswakapp@gmail.com adresinden e-posta gönderin; genellikle birkaç gün içinde yanıt veririz."},"ar":{"langName":"العربية","title":"Qibora – سياسة الخصوصية","updated":"آخر تحديث: ٢٤ أكتوبر ٢٠٢٦","intro":"يساعدك Qibora («التطبيق») على تحديد اتجاه القبلة والعثور على المساجد القريبة منك. توضّح هذه السياسة المعلومات التي يستخدمها التطبيق، والجهات التي تُرسَل إليها، والخيارات المتاحة لك. وباختصار: يُحسَب اتجاه القبلة على هاتفك، ولا نشغّل خوادم تخزّن موقعك، ولا نبيع بياناتك الشخصية.","sections":[{"h":"١. موقعك","p":["لا يطلب التطبيق الوصول إلى موقعك إلا أثناء استخدامك له. ويُستخدَم موقعك على هاتفك لحساب اتجاه القبلة والمسافة إلى الكعبة، ولا يُرسَل إلى خوادمنا ولا نخزّنه.","عند فتح شاشة الخريطة لعرض المساجد القريبة، يرسل التطبيق موقعًا تقريبيًا، مقرَّبًا إلى نحو ١ كم، إلى خدمة OpenStreetMap Overpass المجانية (overpass-api.de، أو overpass.kumi.systems كخدمة احتياطية) للبحث عن المساجد من حولك. ولا يُرفَق بهذا الطلب أي اسم أو حساب أو معرّف للجهاز. بيانات المساجد © المساهمون في OpenStreetMap، ومتاحة بموجب ترخيص ODbL.","أما الخريطة نفسها فتعرضها خدمة الخرائط في هاتفك (Apple Maps على iPhone، وGoogle Maps على Android)، وهي تخضع لسياسة الخصوصية الخاصة بـ Apple أو Google."]},{"h":"٢. الكاميرا","p":["تُستخدَم الكاميرا في شاشة الواقع المعزّز (AR) فقط، لعرض اتجاه القبلة فوق الصورة المباشرة للكاميرا. وتُعالَج الصور على هاتفك في الوقت الفعلي؛ ولا يُسجَّل أي شيء أو يُحفَظ أو يُرفَع."]},{"h":"٣. المعلومات المخزّنة على هاتفك","p":["تُخزَّن إعداداتك (التصميم المختار، والسمة، وحجم النص، وآخر شاشة استخدمتها، وما شابه ذلك من تفضيلات) على هاتفك فقط، وتُحذَف عند حذف التطبيق."]},{"h":"٤. إحصاءات الاستخدام المجهولة الهوية","p":["لفهم الميزات التي تُستخدَم وإصلاح المشكلات، يرسل التطبيق أحداث استخدام مجهولة الهوية (مثل: الشاشة التي فُتحت، وما إذا تم العثور على القبلة، وإصدار التطبيق، ونوع الجهاز) إلى PostHog، المستضافة على خوادم في الاتحاد الأوروبي. ولا تتضمن هذه الأحداث اسمك أو موقعك أو صور الكاميرا. وكما هو الحال مع أي اتصال بالإنترنت، قد تعالج الخدمة عنوان IP الخاص بك، على سبيل المثال لتقدير البلد.","يمكنك إيقاف ذلك في أي وقت من الإعدادات ← «إحصاءات الاستخدام»."]},{"h":"٥. الإعلانات","p":["تعرض النسخة المجانية من Qibora إعلانات تقدّمها Google AdMob. وقد تستخدم Google معرّف الإعلانات الخاص بجهازك ومعلومات مشابهة لعرض الإعلانات وقياسها، وكذلك لتخصيصها بإذنك.","على iPhone، لا تُستخدَم الإعلانات المخصّصة إلا إذا سمحت بالتتبّع عندما يطلب التطبيق ذلك. وفي المنطقة الاقتصادية الأوروبية والمملكة المتحدة وسويسرا، تتيح لك نافذة موافقة اختيار كيفية استخدام بياناتك لأغراض الإعلانات. ويمكنك أيضًا إعادة تعيين معرّف الإعلانات أو تقييده من إعدادات هاتفك.","تخضع الإعلانات للتصفية لتكون مناسبة لعامة الجمهور. لمزيد من المعلومات: https://policies.google.com/technologies/ads","يزيل Qibora Pro جميع الإعلانات."]},{"h":"٦. المشتريات","p":["يُباع Qibora Pro عبر App Store أو Google Play. وتتولى Apple أو Google معالجة المدفوعات بالكامل؛ ولا نطّلع أبدًا على بيانات بطاقتك أو تفاصيل الدفع.","لتأكيد المشتريات التي تملكها واستعادتها، يستخدم التطبيق RevenueCat، التي تتلقى معرّف مستخدم مجهول الهوية خاصًا بالتطبيق وإيصالات مشترياتك من المتجر. ولا تتلقى اسمك أو تفاصيل الدفع الخاصة بك."]},{"h":"٧. الأطفال","p":["Qibora تطبيق موجّه لعامة الجمهور، وليس موجّهًا للأطفال دون سن ١٣ عامًا. ولا نجمع عن علم أي معلومات شخصية من الأطفال."]},{"h":"٨. خياراتك وحقوقك","p":["يمكنك رفض إذن الوصول إلى الموقع والكاميرا أو سحبه من إعدادات هاتفك (لن يتمكن التطبيق من تحديد القبلة دون الموقع)، وإيقاف إحصاءات الاستخدام داخل التطبيق، وتغيير موافقتك على الإعلانات أو خيارك بشأن التتبّع، وحذف جميع البيانات المخزّنة محليًا بحذف التطبيق.","بحسب مكان إقامتك (على سبيل المثال بموجب GDPR، أو UK GDPR، أو قانون KVKK في تركيا، أو قانون CCPA في كاليفورنيا)، قد يحق لك الوصول إلى البيانات الشخصية أو تصحيحها أو حذفها، والاعتراض على معالجتها. ونظرًا لأننا لا نحتفظ ببيانات تحدّد هويتك، يمكن تلبية معظم الطلبات من خلال الخيارات المذكورة أعلاه؛ كما يمكنك التواصل معنا عبر العنوان أدناه."]},{"h":"٩. التغييرات على هذه السياسة","p":["قد نحدّث هذه السياسة عند تغيّر التطبيق. ويشير التاريخ المذكور في الأعلى إلى أحدث إصدار."]},{"h":"١٠. التواصل والدعم","p":["للاستفسار عن هذه السياسة، أو للحصول على مساعدة في استخدام التطبيق، أو بشأن مشكلات تتعلق بعملية شراء، راسلنا على miswakapp@gmail.com."]}],"langLabel":"اللغة","supportTitle":"الدعم","supportText":"هل تحتاج إلى مساعدة بشأن Qibora أو عملية شراء؟ راسلنا عبر البريد الإلكتروني على miswakapp@gmail.com — نردّ عادةً في غضون أيام قليلة."},"id":{"langName":"Bahasa Indonesia","title":"Qibora – Kebijakan Privasi","updated":"Terakhir diperbarui: 24 Oktober 2026","intro":"Qibora (“aplikasi”) membantu Anda menemukan arah kiblat dan masjid terdekat. Kebijakan ini menjelaskan informasi apa saja yang digunakan aplikasi, ke mana informasi tersebut dikirim, serta pilihan yang Anda miliki. Singkatnya: arah kiblat dihitung di ponsel Anda, kami tidak mengoperasikan server yang menyimpan lokasi Anda, dan kami tidak menjual data pribadi Anda.","sections":[{"h":"1. Lokasi Anda","p":["Aplikasi meminta akses ke lokasi Anda hanya selama Anda menggunakannya. Lokasi Anda digunakan di ponsel Anda untuk menghitung arah kiblat dan jarak ke Ka'bah. Lokasi tersebut tidak dikirim ke server kami dan tidak kami simpan.","Saat Anda membuka layar Peta untuk melihat masjid terdekat, aplikasi mengirimkan perkiraan lokasi, yang dibulatkan hingga sekitar 1 km, ke layanan gratis OpenStreetMap Overpass (overpass-api.de, atau overpass.kumi.systems sebagai cadangan) untuk mencari masjid di sekitar Anda. Permintaan ini tidak disertai nama, akun, maupun pengenal perangkat apa pun. Data masjid © kontributor OpenStreetMap, tersedia berdasarkan lisensi ODbL.","Peta itu sendiri ditampilkan oleh layanan peta di ponsel Anda (Apple Maps di iPhone, Google Maps di Android), yang tunduk pada kebijakan privasi Apple atau Google masing-masing."]},{"h":"2. Kamera","p":["Kamera hanya digunakan pada layar AR, untuk menampilkan arah kiblat di atas tampilan kamera langsung. Gambar diproses di ponsel Anda secara real time; tidak ada yang direkam, disimpan, atau diunggah."]},{"h":"3. Informasi yang disimpan di ponsel Anda","p":["Pengaturan Anda (desain yang dipilih, tema, ukuran teks, layar yang terakhir digunakan, dan preferensi serupa) hanya disimpan di ponsel Anda. Menghapus aplikasi juga akan menghapus pengaturan tersebut."]},{"h":"4. Statistik penggunaan anonim","p":["Untuk memahami fitur mana yang digunakan dan untuk memperbaiki masalah, aplikasi mengirimkan peristiwa penggunaan anonim (misalnya: layar mana yang dibuka, apakah arah kiblat berhasil ditemukan, versi aplikasi, dan jenis perangkat) ke PostHog, yang di-hosting di server di Uni Eropa. Peristiwa ini tidak mencakup nama, lokasi, maupun gambar kamera Anda. Sebagaimana pada setiap koneksi internet, alamat IP Anda dapat diproses oleh layanan tersebut, misalnya untuk memperkirakan negara Anda.","Anda dapat menonaktifkannya kapan saja di Pengaturan → “Statistik penggunaan”."]},{"h":"5. Iklan","p":["Versi gratis Qibora menampilkan iklan yang disediakan oleh Google AdMob. Google dapat menggunakan pengenal iklan perangkat Anda dan informasi serupa untuk menampilkan dan mengukur iklan, serta, dengan izin Anda, untuk mempersonalisasikannya.","Di iPhone, iklan yang dipersonalisasi hanya digunakan jika Anda mengizinkan pelacakan saat aplikasi memintanya. Di Wilayah Ekonomi Eropa, Inggris Raya, dan Swiss, jendela persetujuan memungkinkan Anda memilih bagaimana data Anda digunakan untuk iklan. Anda juga dapat mengatur ulang atau membatasi pengenal iklan Anda di pengaturan ponsel.","Iklan disaring agar sesuai untuk khalayak umum. Informasi selengkapnya: https://policies.google.com/technologies/ads","Qibora Pro menghilangkan semua iklan."]},{"h":"6. Pembelian","p":["Qibora Pro dijual melalui App Store atau Google Play. Pembayaran sepenuhnya ditangani oleh Apple atau Google; kami tidak pernah melihat detail kartu atau pembayaran Anda.","Untuk mengonfirmasi pembelian yang Anda miliki dan memulihkannya, aplikasi menggunakan RevenueCat, yang menerima ID pengguna aplikasi anonim dan bukti pembelian dari toko aplikasi Anda. RevenueCat tidak menerima nama maupun detail pembayaran Anda."]},{"h":"7. Anak-anak","p":["Qibora adalah aplikasi untuk khalayak umum dan tidak ditujukan untuk anak-anak di bawah usia 13 tahun. Kami tidak dengan sengaja mengumpulkan informasi pribadi dari anak-anak."]},{"h":"8. Pilihan dan hak Anda","p":["Anda dapat menolak atau mencabut izin lokasi dan kamera di pengaturan ponsel Anda (tanpa lokasi, aplikasi tidak dapat menemukan arah kiblat), menonaktifkan statistik penggunaan di aplikasi, mengubah persetujuan iklan atau pilihan pelacakan Anda, serta menghapus semua data yang tersimpan secara lokal dengan menghapus aplikasi.","Bergantung pada tempat tinggal Anda (misalnya berdasarkan GDPR, UK GDPR, KVKK Turki, atau CCPA California), Anda mungkin berhak untuk mengakses, memperbaiki, atau menghapus data pribadi serta mengajukan keberatan atas pemrosesannya. Karena kami tidak menyimpan data yang dapat mengidentifikasi Anda, sebagian besar permintaan dapat dipenuhi melalui opsi di atas; Anda juga dapat menghubungi kami melalui alamat di bawah ini."]},{"h":"9. Perubahan kebijakan ini","p":["Kami dapat memperbarui kebijakan ini apabila aplikasi mengalami perubahan. Tanggal di bagian atas menunjukkan versi terbaru."]},{"h":"10. Kontak dan dukungan","p":["Untuk pertanyaan tentang kebijakan ini, bantuan terkait aplikasi, atau masalah pembelian, silakan kirim email kepada kami di miswakapp@gmail.com."]}],"langLabel":"Bahasa","supportTitle":"Dukungan","supportText":"Butuh bantuan terkait Qibora atau pembelian? Kirim email kepada kami di miswakapp@gmail.com — kami biasanya membalas dalam beberapa hari."},"ms":{"langName":"Bahasa Melayu","title":"Qibora – Dasar Privasi","updated":"Kemas kini terakhir: 24 Oktober 2026","intro":"Qibora (“aplikasi”) membantu anda mencari arah kiblat dan masjid berdekatan. Dasar ini menerangkan maklumat yang digunakan oleh aplikasi, ke mana maklumat itu dihantar dan pilihan yang anda ada. Ringkasnya: arah kiblat dikira pada telefon anda, kami tidak mengendalikan pelayan yang menyimpan lokasi anda, dan kami tidak menjual data peribadi anda.","sections":[{"h":"1. Lokasi anda","p":["Aplikasi meminta akses kepada lokasi anda hanya semasa anda menggunakannya. Lokasi anda digunakan pada telefon anda untuk mengira arah kiblat dan jarak ke Kaabah. Lokasi tersebut tidak dihantar ke pelayan kami dan kami tidak menyimpannya.","Apabila anda membuka skrin Peta untuk melihat masjid berdekatan, aplikasi menghantar lokasi anggaran, yang dibundarkan kepada lebih kurang 1 km, kepada perkhidmatan percuma OpenStreetMap Overpass (overpass-api.de, atau overpass.kumi.systems sebagai sandaran) untuk mencari masjid di sekitar anda. Tiada nama, akaun atau pengecam peranti disertakan bersama permintaan ini. Data masjid © penyumbang OpenStreetMap, tersedia di bawah lesen ODbL.","Peta itu sendiri dipaparkan oleh perkhidmatan peta telefon anda (Apple Maps pada iPhone, Google Maps pada Android), yang tertakluk kepada dasar privasi Apple atau Google sendiri."]},{"h":"2. Kamera","p":["Kamera hanya digunakan pada skrin AR, untuk memaparkan arah kiblat di atas paparan kamera secara langsung. Imej diproses pada telefon anda dalam masa nyata; tiada apa-apa yang dirakam, disimpan atau dimuat naik."]},{"h":"3. Maklumat yang disimpan pada telefon anda","p":["Tetapan anda (reka bentuk yang dipilih, tema, saiz teks, skrin yang terakhir digunakan dan pilihan lain yang seumpamanya) hanya disimpan pada telefon anda. Memadam aplikasi akan turut memadamkan tetapan tersebut."]},{"h":"4. Statistik penggunaan tanpa nama","p":["Untuk memahami ciri yang digunakan dan membaiki masalah, aplikasi menghantar peristiwa penggunaan tanpa nama (contohnya: skrin yang dibuka, sama ada arah kiblat ditemui, versi aplikasi dan jenis peranti) kepada PostHog, yang dihoskan pada pelayan di Kesatuan Eropah. Peristiwa ini tidak merangkumi nama, lokasi atau imej kamera anda. Seperti mana-mana sambungan internet, alamat IP anda mungkin diproses oleh perkhidmatan tersebut, contohnya untuk menganggarkan negara anda.","Anda boleh mematikannya pada bila-bila masa di Tetapan → “Statistik penggunaan”."]},{"h":"5. Iklan","p":["Versi percuma Qibora memaparkan iklan yang disediakan oleh Google AdMob. Google mungkin menggunakan pengecam pengiklanan peranti anda dan maklumat seumpamanya untuk memaparkan dan mengukur iklan, dan, dengan kebenaran anda, untuk memperibadikannya.","Pada iPhone, iklan yang diperibadikan hanya digunakan jika anda membenarkan penjejakan apabila diminta oleh aplikasi. Di Kawasan Ekonomi Eropah, United Kingdom dan Switzerland, tetingkap persetujuan membolehkan anda memilih cara data anda digunakan untuk iklan. Anda juga boleh menetapkan semula atau mengehadkan pengecam pengiklanan anda dalam tetapan telefon anda.","Iklan ditapis supaya sesuai untuk khalayak umum. Maklumat lanjut: https://policies.google.com/technologies/ads","Qibora Pro membuang semua iklan."]},{"h":"6. Pembelian","p":["Qibora Pro dijual melalui App Store atau Google Play. Pembayaran dikendalikan sepenuhnya oleh Apple atau Google; kami tidak sekali-kali melihat butiran kad atau pembayaran anda.","Untuk mengesahkan pembelian yang anda miliki dan memulihkannya, aplikasi menggunakan RevenueCat, yang menerima ID pengguna aplikasi tanpa nama dan resit pembelian kedai aplikasi anda. RevenueCat tidak menerima nama atau butiran pembayaran anda."]},{"h":"7. Kanak-kanak","p":["Qibora ialah aplikasi untuk khalayak umum dan tidak ditujukan kepada kanak-kanak di bawah umur 13 tahun. Kami tidak secara sedar mengumpul maklumat peribadi daripada kanak-kanak."]},{"h":"8. Pilihan dan hak anda","p":["Anda boleh menolak atau menarik balik kebenaran lokasi dan kamera dalam tetapan telefon anda (aplikasi tidak dapat mencari arah kiblat tanpa lokasi), mematikan statistik penggunaan dalam aplikasi, menukar persetujuan iklan atau pilihan penjejakan anda, dan memadam semua data yang disimpan secara setempat dengan memadam aplikasi.","Bergantung pada tempat anda tinggal (contohnya di bawah GDPR, UK GDPR, KVKK Turki atau CCPA California), anda mungkin berhak untuk mengakses, membetulkan atau memadam data peribadi dan membantah pemprosesannya. Oleh sebab kami tidak menyimpan data yang mengenal pasti anda, kebanyakan permintaan boleh dipenuhi melalui pilihan di atas; anda juga boleh menghubungi kami di alamat di bawah."]},{"h":"9. Perubahan pada dasar ini","p":["Kami mungkin mengemas kini dasar ini apabila aplikasi berubah. Tarikh di bahagian atas menunjukkan versi terkini."]},{"h":"10. Hubungan dan sokongan","p":["Untuk pertanyaan tentang dasar ini, bantuan berkaitan aplikasi atau masalah pembelian, sila hubungi kami melalui e-mel di miswakapp@gmail.com."]}],"langLabel":"Bahasa","supportTitle":"Sokongan","supportText":"Perlukan bantuan dengan Qibora atau pembelian? E-mel kami di miswakapp@gmail.com — kami biasanya membalas dalam masa beberapa hari."},"bn":{"langName":"বাংলা","title":"Qibora – গোপনীয়তা নীতি","updated":"সর্বশেষ হালনাগাদ: ২৪ অক্টোবর ২০২৬","intro":"Qibora (“অ্যাপ”) আপনাকে কিবলার দিক এবং কাছাকাছি মসজিদ খুঁজে পেতে সাহায্য করে। এই নীতিতে ব্যাখ্যা করা হয়েছে অ্যাপটি কোন তথ্য ব্যবহার করে, সেই তথ্য কোথায় যায় এবং আপনার কী কী বিকল্প রয়েছে। সংক্ষেপে: কিবলার দিক আপনার ফোনেই হিসাব করা হয়, আমরা আপনার অবস্থান সংরক্ষণ করে এমন কোনো সার্ভার পরিচালনা করি না এবং আমরা আপনার ব্যক্তিগত তথ্য বিক্রি করি না।","sections":[{"h":"১. আপনার অবস্থান","p":["অ্যাপটি কেবল আপনি এটি ব্যবহার করার সময়ই আপনার অবস্থান জানার অনুমতি চায়। কিবলার দিক এবং কাবা পর্যন্ত দূরত্ব হিসাব করার জন্য আপনার অবস্থান আপনার ফোনেই ব্যবহার করা হয়। এটি আমাদের সার্ভারে পাঠানো হয় না এবং আমরা এটি সংরক্ষণ করি না।","কাছাকাছি মসজিদ দেখার জন্য আপনি যখন মানচিত্র স্ক্রিনটি খোলেন, তখন আপনার আশেপাশের মসজিদ খুঁজতে অ্যাপটি প্রায় ১ কিমি পর্যন্ত রাউন্ড করা একটি আনুমানিক অবস্থান বিনামূল্যের OpenStreetMap Overpass পরিষেবায় (overpass-api.de, অথবা বিকল্প হিসেবে overpass.kumi.systems) পাঠায়। এই অনুরোধের সঙ্গে কোনো নাম, অ্যাকাউন্ট বা ডিভাইস শনাক্তকারী যুক্ত থাকে না। মসজিদের তথ্য © OpenStreetMap অবদানকারীগণ, ODbL লাইসেন্সের অধীনে উপলব্ধ।","মানচিত্রটি নিজে আপনার ফোনের মানচিত্র পরিষেবার মাধ্যমে প্রদর্শিত হয় (iPhone-এ Apple Maps, Android-এ Google Maps), যা Apple বা Google-এর নিজস্ব গোপনীয়তা নীতির অধীন।"]},{"h":"২. ক্যামেরা","p":["ক্যামেরা কেবল AR স্ক্রিনে, সরাসরি ক্যামেরা দৃশ্যের ওপর কিবলার দিক দেখানোর জন্য ব্যবহার করা হয়। ছবিগুলো আপনার ফোনে তাৎক্ষণিকভাবে প্রক্রিয়া করা হয়; কোনো কিছুই রেকর্ড, সংরক্ষণ বা আপলোড করা হয় না।"]},{"h":"৩. আপনার ফোনে সংরক্ষিত তথ্য","p":["আপনার সেটিংস (বেছে নেওয়া ডিজাইন, থিম, লেখার আকার, সর্বশেষ ব্যবহৃত স্ক্রিন এবং এ ধরনের অন্যান্য পছন্দ) কেবল আপনার ফোনেই সংরক্ষিত থাকে। অ্যাপটি মুছে ফেললে এগুলোও মুছে যায়।"]},{"h":"৪. বেনামি ব্যবহারের পরিসংখ্যান","p":["কোন ফিচারগুলো ব্যবহার করা হয় তা বোঝার জন্য এবং সমস্যা সমাধানের জন্য অ্যাপটি বেনামি ব্যবহার-ইভেন্ট (যেমন: কোন স্ক্রিন খোলা হয়েছে, কিবলা পাওয়া গেছে কি না, অ্যাপের সংস্করণ এবং ডিভাইসের ধরন) PostHog-এ পাঠায়, যা ইউরোপীয় ইউনিয়নের সার্ভারে হোস্ট করা। এই ইভেন্টগুলোতে আপনার নাম, অবস্থান বা ক্যামেরার ছবি অন্তর্ভুক্ত থাকে না। যেকোনো ইন্টারনেট সংযোগের মতোই, পরিষেবাটি আপনার IP ঠিকানা প্রক্রিয়া করতে পারে, যেমন আপনার দেশ অনুমান করার জন্য।","আপনি যেকোনো সময় সেটিংস → “ব্যবহারের পরিসংখ্যান” থেকে এটি বন্ধ করতে পারেন।"]},{"h":"৫. বিজ্ঞাপন","p":["Qibora-র বিনামূল্যের সংস্করণে Google AdMob-এর সরবরাহ করা বিজ্ঞাপন দেখানো হয়। বিজ্ঞাপন দেখানো ও পরিমাপ করার জন্য এবং আপনার অনুমতি সাপেক্ষে সেগুলো ব্যক্তিগতকৃত করার জন্য Google আপনার ডিভাইসের বিজ্ঞাপন শনাক্তকারী ও অনুরূপ তথ্য ব্যবহার করতে পারে।","iPhone-এ, অ্যাপটি অনুমতি চাওয়ার সময় আপনি ট্র্যাকিংয়ের অনুমতি দিলে তবেই ব্যক্তিগতকৃত বিজ্ঞাপন ব্যবহার করা হয়। ইউরোপীয় অর্থনৈতিক অঞ্চল, যুক্তরাজ্য এবং সুইজারল্যান্ডে একটি সম্মতি উইন্ডোর মাধ্যমে আপনি বেছে নিতে পারেন বিজ্ঞাপনের জন্য আপনার তথ্য কীভাবে ব্যবহার করা হবে। এ ছাড়া আপনি আপনার ফোনের সেটিংসে গিয়ে বিজ্ঞাপন শনাক্তকারী রিসেট বা সীমিত করতে পারেন।","বিজ্ঞাপনগুলো সর্বসাধারণের উপযোগী রাখতে ফিল্টার করা হয়। আরও তথ্য: https://policies.google.com/technologies/ads","Qibora Pro সব বিজ্ঞাপন সরিয়ে দেয়।"]},{"h":"৬. কেনাকাটা","p":["Qibora Pro, App Store বা Google Play-এর মাধ্যমে বিক্রি করা হয়। অর্থপ্রদান সম্পূর্ণভাবে Apple বা Google পরিচালনা করে; আমরা কখনোই আপনার কার্ড বা অর্থপ্রদানের বিবরণ দেখতে পাই না।","আপনার মালিকানাধীন কেনাকাটাগুলো নিশ্চিত করতে এবং সেগুলো পুনরুদ্ধার করতে অ্যাপটি RevenueCat ব্যবহার করে, যা একটি বেনামি অ্যাপ ব্যবহারকারী আইডি এবং আপনার স্টোরের ক্রয়-রসিদ গ্রহণ করে। এটি আপনার নাম বা অর্থপ্রদানের বিবরণ গ্রহণ করে না।"]},{"h":"৭. শিশু","p":["Qibora সর্বসাধারণের জন্য তৈরি একটি অ্যাপ এবং এটি ১৩ বছরের কম বয়সী শিশুদের লক্ষ্য করে তৈরি নয়। আমরা জেনেশুনে শিশুদের কাছ থেকে ব্যক্তিগত তথ্য সংগ্রহ করি না।"]},{"h":"৮. আপনার বিকল্প ও অধিকার","p":["আপনি আপনার ফোনের সেটিংসে অবস্থান ও ক্যামেরার অনুমতি প্রত্যাখ্যান বা প্রত্যাহার করতে পারেন (অবস্থান ছাড়া অ্যাপটি কিবলা খুঁজে পাবে না), অ্যাপে ব্যবহারের পরিসংখ্যান বন্ধ করতে পারেন, বিজ্ঞাপন-সম্মতি বা ট্র্যাকিংয়ের পছন্দ পরিবর্তন করতে পারেন এবং অ্যাপটি মুছে ফেলার মাধ্যমে ফোনে সংরক্ষিত সমস্ত তথ্য মুছে ফেলতে পারেন।","আপনি কোথায় বসবাস করেন তার ওপর নির্ভর করে (যেমন GDPR, UK GDPR, তুরস্কের KVKK বা ক্যালিফোর্নিয়ার CCPA-এর অধীনে), ব্যক্তিগত তথ্যে প্রবেশাধিকার, তা সংশোধন বা মুছে ফেলার এবং তার প্রক্রিয়াকরণে আপত্তি জানানোর অধিকার আপনার থাকতে পারে। যেহেতু আমরা আপনাকে শনাক্ত করে এমন কোনো তথ্য রাখি না, তাই বেশিরভাগ অনুরোধ ওপরের বিকল্পগুলোর মাধ্যমেই পূরণ করা যায়; আপনি নিচের ঠিকানায় আমাদের সঙ্গে যোগাযোগও করতে পারেন।"]},{"h":"৯. এই নীতির পরিবর্তন","p":["অ্যাপে পরিবর্তন এলে আমরা এই নীতি হালনাগাদ করতে পারি। ওপরের তারিখটি সর্বশেষ সংস্করণ নির্দেশ করে।"]},{"h":"১০. যোগাযোগ ও সহায়তা","p":["এই নীতি সম্পর্কে প্রশ্ন, অ্যাপ ব্যবহারে সহায়তা বা কেনাকাটা-সংক্রান্ত সমস্যার জন্য miswakapp@gmail.com ঠিকানায় আমাদের লিখুন।"]}],"langLabel":"ভাষা","supportTitle":"সহায়তা","supportText":"Qibora বা কোনো কেনাকাটা নিয়ে সাহায্য প্রয়োজন? miswakapp@gmail.com ঠিকানায় আমাদের ইমেইল করুন — আমরা সাধারণত কয়েক দিনের মধ্যে উত্তর দিই।"},"ur":{"langName":"اردو","title":"Qibora – رازداری کی پالیسی","updated":"آخری تازہ کاری: 24 اکتوبر 2026","intro":"Qibora (“ایپ”) آپ کو قبلہ کی سمت اور قریبی مساجد تلاش کرنے میں مدد دیتی ہے۔ یہ پالیسی وضاحت کرتی ہے کہ ایپ کون سی معلومات استعمال کرتی ہے، یہ معلومات کہاں جاتی ہیں اور آپ کے پاس کیا اختیارات ہیں۔ مختصراً: قبلہ کا حساب آپ کے فون پر ہی کیا جاتا ہے، ہم ایسے سرورز نہیں چلاتے جو آپ کا مقام محفوظ کریں، اور ہم آپ کا ذاتی ڈیٹا فروخت نہیں کرتے۔","sections":[{"h":"1. آپ کا مقام","p":["ایپ آپ کے مقام تک رسائی کی اجازت صرف اسی وقت مانگتی ہے جب آپ اسے استعمال کر رہے ہوں۔ آپ کا مقام آپ کے فون پر قبلہ کی سمت اور کعبہ تک فاصلہ معلوم کرنے کے لیے استعمال ہوتا ہے۔ یہ ہمارے سرورز کو نہیں بھیجا جاتا اور ہم اسے محفوظ نہیں کرتے۔","جب آپ قریبی مساجد دیکھنے کے لیے نقشے کی اسکرین کھولتے ہیں تو ایپ آپ کے اردگرد کی مساجد تلاش کرنے کے لیے ایک تخمینی مقام، جو تقریباً 1 کلومیٹر تک گول کیا گیا ہو، مفت OpenStreetMap Overpass سروس (overpass-api.de، یا متبادل کے طور پر overpass.kumi.systems) کو بھیجتی ہے۔ اس درخواست کے ساتھ کوئی نام، اکاؤنٹ یا ڈیوائس کی شناخت منسلک نہیں ہوتی۔ مساجد کا ڈیٹا © OpenStreetMap کے معاونین، ODbL لائسنس کے تحت دستیاب ہے۔","نقشہ بذاتِ خود آپ کے فون کی نقشہ سروس (iPhone پر Apple Maps، Android پر Google Maps) کے ذریعے دکھایا جاتا ہے، جس پر Apple یا Google کی اپنی رازداری کی پالیسی لاگو ہوتی ہے۔"]},{"h":"2. کیمرا","p":["کیمرا صرف AR اسکرین پر، براہِ راست کیمرا منظر کے اوپر قبلہ کی سمت دکھانے کے لیے استعمال ہوتا ہے۔ تصاویر آپ کے فون پر فوری طور پر (ریئل ٹائم میں) پروسیس ہوتی ہیں؛ کچھ بھی ریکارڈ، محفوظ یا اپ لوڈ نہیں کیا جاتا۔"]},{"h":"3. آپ کے فون پر محفوظ معلومات","p":["آپ کی ترتیبات (منتخب ڈیزائن، تھیم، متن کا سائز، آخری بار استعمال کی گئی اسکرین اور اسی طرح کی دیگر ترجیحات) صرف آپ کے فون پر محفوظ کی جاتی ہیں۔ ایپ حذف کرنے سے یہ بھی حذف ہو جاتی ہیں۔"]},{"h":"4. گمنام استعمال کے اعداد و شمار","p":["یہ سمجھنے کے لیے کہ کون سی خصوصیات استعمال ہوتی ہیں اور مسائل حل کرنے کے لیے، ایپ استعمال سے متعلق گمنام واقعات (مثلاً: کون سی اسکرین کھولی گئی، آیا قبلہ مل گیا یا نہیں، ایپ کا ورژن اور ڈیوائس کی قسم) PostHog کو بھیجتی ہے، جو یورپی یونین میں واقع سرورز پر ہوسٹ ہے۔ ان واقعات میں آپ کا نام، آپ کا مقام یا کیمرا کی تصاویر شامل نہیں ہوتیں۔ کسی بھی انٹرنیٹ کنکشن کی طرح، یہ سروس آپ کے IP ایڈریس کو پروسیس کر سکتی ہے، مثلاً ملک کا اندازہ لگانے کے لیے۔","آپ کسی بھی وقت ترتیبات ← “استعمال کے اعداد و شمار” میں جا کر اسے بند کر سکتے ہیں۔"]},{"h":"5. اشتہارات","p":["Qibora کے مفت ورژن میں Google AdMob کی جانب سے فراہم کردہ اشتہارات دکھائے جاتے ہیں۔ Google اشتہارات دکھانے اور ان کی پیمائش کے لیے، اور آپ کی اجازت سے انہیں آپ کے لیے ذاتی نوعیت کا بنانے کے لیے، آپ کی ڈیوائس کا اشتہاری شناخت کنندہ اور اسی طرح کی معلومات استعمال کر سکتا ہے۔","iPhone پر ذاتی نوعیت کے اشتہارات صرف اسی صورت میں استعمال ہوتے ہیں جب ایپ کے پوچھنے پر آپ ٹریکنگ کی اجازت دیں۔ یورپی اقتصادی علاقے، برطانیہ اور سوئٹزرلینڈ میں ایک رضامندی ونڈو کے ذریعے آپ منتخب کر سکتے ہیں کہ اشتہارات کے لیے آپ کا ڈیٹا کس طرح استعمال کیا جائے۔ آپ اپنے فون کی ترتیبات میں اپنا اشتہاری شناخت کنندہ ری سیٹ یا محدود بھی کر سکتے ہیں۔","اشتہارات کو اس طرح فلٹر کیا جاتا ہے کہ وہ عام سامعین کے لیے موزوں ہوں۔ مزید معلومات: https://policies.google.com/technologies/ads","Qibora Pro تمام اشتہارات ختم کر دیتا ہے۔"]},{"h":"6. خریداریاں","p":["Qibora Pro، App Store یا Google Play کے ذریعے فروخت کیا جاتا ہے۔ ادائیگیاں مکمل طور پر Apple یا Google کے ذریعے انجام پاتی ہیں؛ ہم کبھی بھی آپ کے کارڈ یا ادائیگی کی تفصیلات نہیں دیکھتے۔","آپ کی ملکیت والی خریداریوں کی تصدیق اور انہیں بحال کرنے کے لیے ایپ RevenueCat استعمال کرتی ہے، جسے ایپ صارف کی ایک گمنام شناخت (ID) اور اسٹور سے آپ کی خریداری کی رسیدیں موصول ہوتی ہیں۔ اسے آپ کا نام یا ادائیگی کی تفصیلات موصول نہیں ہوتیں۔"]},{"h":"7. بچے","p":["Qibora عام سامعین کے لیے بنائی گئی ایپ ہے اور یہ 13 سال سے کم عمر بچوں کو مخاطب نہیں کرتی۔ ہم دانستہ طور پر بچوں سے ذاتی معلومات جمع نہیں کرتے۔"]},{"h":"8. آپ کے اختیارات اور حقوق","p":["آپ اپنے فون کی ترتیبات میں مقام اور کیمرا کی اجازت دینے سے انکار کر سکتے ہیں یا دی گئی اجازت واپس لے سکتے ہیں (مقام کے بغیر ایپ قبلہ تلاش نہیں کر سکے گی)، ایپ میں استعمال کے اعداد و شمار بند کر سکتے ہیں، اشتہارات کے لیے اپنی رضامندی یا ٹریکنگ سے متعلق اپنا انتخاب تبدیل کر سکتے ہیں، اور ایپ حذف کر کے مقامی طور پر محفوظ تمام ڈیٹا حذف کر سکتے ہیں۔","آپ کی رہائش کے مقام کے لحاظ سے (مثلاً GDPR، UK GDPR، ترکی کے KVKK یا کیلیفورنیا کے CCPA کے تحت)، آپ کو ذاتی ڈیٹا تک رسائی، اس کی درستی یا اسے حذف کرنے اور اس کی پروسیسنگ پر اعتراض کرنے کا حق حاصل ہو سکتا ہے۔ چونکہ ہم ایسا کوئی ڈیٹا نہیں رکھتے جس سے آپ کی شناخت ہو سکے، اس لیے زیادہ تر درخواستیں اوپر دیے گئے اختیارات کے ذریعے پوری کی جا سکتی ہیں؛ آپ نیچے دیے گئے پتے پر ہم سے رابطہ بھی کر سکتے ہیں۔"]},{"h":"9. اس پالیسی میں تبدیلیاں","p":["ایپ میں تبدیلی کی صورت میں ہم اس پالیسی کو اپ ڈیٹ کر سکتے ہیں۔ اوپر درج تاریخ تازہ ترین ورژن کی نشاندہی کرتی ہے۔"]},{"h":"10. رابطہ اور معاونت","p":["اس پالیسی کے بارے میں سوالات، ایپ کے استعمال میں مدد، یا کسی خریداری سے متعلق مسائل کے لیے ہمیں miswakapp@gmail.com پر لکھیں۔"]}],"langLabel":"زبان","supportTitle":"معاونت","supportText":"کیا آپ کو Qibora یا کسی خریداری کے سلسلے میں مدد درکار ہے؟ ہمیں miswakapp@gmail.com پر ای میل کریں — ہم عموماً چند دنوں میں جواب دیتے ہیں۔"},"hi":{"langName":"हिन्दी","title":"Qibora – गोपनीयता नीति","updated":"अंतिम अद्यतन: 24 अक्टूबर 2026","intro":"Qibora (“ऐप”) आपको क़िबला की दिशा और आस-पास की मस्जिदें खोजने में मदद करता है। यह नीति बताती है कि ऐप किन जानकारियों का उपयोग करता है, वे कहाँ जाती हैं और आपके पास कौन-से विकल्प हैं। संक्षेप में: क़िबला की गणना आपके फ़ोन पर ही होती है, हम ऐसे कोई सर्वर नहीं चलाते जो आपका स्थान संग्रहीत करें, और हम आपका व्यक्तिगत डेटा नहीं बेचते।","sections":[{"h":"1. आपका स्थान","p":["ऐप आपका स्थान केवल तभी माँगता है जब आप उसका उपयोग कर रहे होते हैं। आपके स्थान का उपयोग आपके फ़ोन पर ही क़िबला की दिशा और काबा तक की दूरी की गणना के लिए किया जाता है। इसे हमारे सर्वरों पर नहीं भेजा जाता और हम इसे संग्रहीत नहीं करते।","जब आप आस-पास की मस्जिदें देखने के लिए मानचित्र स्क्रीन खोलते हैं, तो ऐप आपके आस-पास की मस्जिदें खोजने के लिए लगभग 1 किमी तक पूर्णांकित (rounded) एक अनुमानित स्थान निःशुल्क OpenStreetMap Overpass सेवा (overpass-api.de, या बैकअप के रूप में overpass.kumi.systems) को भेजता है। इस अनुरोध के साथ कोई नाम, खाता या डिवाइस पहचानकर्ता नहीं जोड़ा जाता। मस्जिदों का डेटा © OpenStreetMap योगदानकर्ता, ODbL लाइसेंस के अंतर्गत उपलब्ध।","मानचित्र स्वयं आपके फ़ोन की मानचित्र सेवा (iPhone पर Apple Maps, Android पर Google Maps) द्वारा दिखाया जाता है, जिस पर Apple या Google की अपनी गोपनीयता नीति लागू होती है।"]},{"h":"2. कैमरा","p":["कैमरे का उपयोग केवल AR स्क्रीन पर, लाइव कैमरा दृश्य के ऊपर क़िबला की दिशा दिखाने के लिए किया जाता है। छवियों को आपके फ़ोन पर वास्तविक समय में संसाधित किया जाता है; कुछ भी रिकॉर्ड, सहेजा या अपलोड नहीं किया जाता।"]},{"h":"3. आपके फ़ोन पर संग्रहीत जानकारी","p":["आपकी सेटिंग्स (चुना गया डिज़ाइन, थीम, टेक्स्ट का आकार, पिछली बार उपयोग की गई स्क्रीन और इसी तरह की अन्य प्राथमिकताएँ) केवल आपके फ़ोन पर संग्रहीत होती हैं। ऐप हटाने पर ये भी हट जाती हैं।"]},{"h":"4. अनाम उपयोग आँकड़े","p":["यह समझने के लिए कि कौन-सी सुविधाएँ उपयोग की जाती हैं और समस्याओं को ठीक करने के लिए, ऐप अनाम उपयोग इवेंट (उदाहरण के लिए: कौन-सी स्क्रीन खोली गई, क़िबला मिला या नहीं, ऐप का संस्करण और डिवाइस का प्रकार) PostHog को भेजता है, जो यूरोपीय संघ में स्थित सर्वरों पर होस्ट किया गया है। इन इवेंट में आपका नाम, आपका स्थान या कैमरा छवियाँ शामिल नहीं होतीं। किसी भी इंटरनेट कनेक्शन की तरह, यह सेवा आपके IP पते को संसाधित कर सकती है, उदाहरण के लिए देश का अनुमान लगाने के लिए।","आप इसे किसी भी समय सेटिंग्स → “उपयोग आँकड़े” में जाकर बंद कर सकते हैं।"]},{"h":"5. विज्ञापन","p":["Qibora का निःशुल्क संस्करण Google AdMob द्वारा प्रदान किए गए विज्ञापन दिखाता है। Google विज्ञापन दिखाने और मापने के लिए, और आपकी अनुमति से उन्हें वैयक्तिकृत करने के लिए, आपके डिवाइस के विज्ञापन पहचानकर्ता और इसी तरह की जानकारी का उपयोग कर सकता है।","iPhone पर, वैयक्तिकृत विज्ञापनों का उपयोग केवल तभी किया जाता है जब ऐप के पूछने पर आप ट्रैकिंग की अनुमति देते हैं। यूरोपीय आर्थिक क्षेत्र, यूनाइटेड किंगडम और स्विट्ज़रलैंड में, एक सहमति विंडो के माध्यम से आप यह चुन सकते हैं कि विज्ञापनों के लिए आपके डेटा का उपयोग कैसे किया जाए। आप अपने फ़ोन की सेटिंग्स में अपने विज्ञापन पहचानकर्ता को रीसेट या सीमित भी कर सकते हैं।","विज्ञापनों को इस प्रकार फ़िल्टर किया जाता है कि वे सामान्य दर्शकों के लिए उपयुक्त हों। अधिक जानकारी: https://policies.google.com/technologies/ads","Qibora Pro सभी विज्ञापन हटा देता है।"]},{"h":"6. ख़रीदारी","p":["Qibora Pro, App Store या Google Play के माध्यम से बेचा जाता है। भुगतान पूरी तरह Apple या Google द्वारा संभाले जाते हैं; हम आपके कार्ड या भुगतान का विवरण कभी नहीं देखते।","आपके स्वामित्व वाली ख़रीदारियों की पुष्टि करने और उन्हें पुनर्स्थापित करने के लिए, ऐप RevenueCat का उपयोग करता है, जिसे एक अनाम ऐप उपयोगकर्ता ID और आपकी स्टोर ख़रीद रसीदें प्राप्त होती हैं। इसे आपका नाम या भुगतान विवरण प्राप्त नहीं होता।"]},{"h":"7. बच्चे","p":["Qibora सामान्य दर्शकों के लिए बना ऐप है और यह 13 वर्ष से कम आयु के बच्चों के लिए लक्षित नहीं है। हम जानबूझकर बच्चों से व्यक्तिगत जानकारी एकत्र नहीं करते।"]},{"h":"8. आपके विकल्प और अधिकार","p":["आप अपने फ़ोन की सेटिंग्स में स्थान और कैमरे की अनुमति अस्वीकार कर सकते हैं या वापस ले सकते हैं (स्थान के बिना ऐप क़िबला नहीं खोज पाएगा), ऐप में उपयोग आँकड़े बंद कर सकते हैं, विज्ञापन के लिए अपनी सहमति या ट्रैकिंग संबंधी अपना विकल्प बदल सकते हैं, और ऐप हटाकर फ़ोन पर संग्रहीत सारा डेटा हटा सकते हैं।","आप कहाँ रहते हैं, इसके आधार पर (उदाहरण के लिए GDPR, UK GDPR, तुर्की के KVKK या कैलिफ़ोर्निया के CCPA के अंतर्गत), आपको व्यक्तिगत डेटा तक पहुँचने, उसे सुधारने या हटाने का तथा उसके संसाधन पर आपत्ति करने का अधिकार हो सकता है। चूँकि हम ऐसा कोई डेटा नहीं रखते जिससे आपकी पहचान हो सके, इसलिए अधिकांश अनुरोध ऊपर दिए गए विकल्पों से पूरे किए जा सकते हैं; आप नीचे दिए गए पते पर हमसे संपर्क भी कर सकते हैं।"]},{"h":"9. इस नीति में परिवर्तन","p":["ऐप में बदलाव होने पर हम इस नीति को अद्यतन कर सकते हैं। ऊपर दी गई तिथि नवीनतम संस्करण दर्शाती है।"]},{"h":"10. संपर्क और सहायता","p":["इस नीति के बारे में प्रश्नों, ऐप से संबंधित सहायता, या किसी ख़रीदारी में समस्या के लिए, हमें miswakapp@gmail.com पर लिखें।"]}],"langLabel":"भाषा","supportTitle":"सहायता","supportText":"Qibora या किसी ख़रीदारी के बारे में सहायता चाहिए? हमें miswakapp@gmail.com पर ईमेल करें — हम आमतौर पर कुछ ही दिनों में उत्तर देते हैं।"},"fa":{"langName":"فارسی","title":"Qibora – سیاست حفظ حریم خصوصی","updated":"آخرین به‌روزرسانی: ۲۴ اکتبر ۲۰۲۶","intro":"Qibora («برنامه») به شما کمک می‌کند جهت قبله و مساجد نزدیک را پیدا کنید. این سیاست توضیح می‌دهد که برنامه از چه اطلاعاتی استفاده می‌کند، این اطلاعات به کجا می‌رود و چه انتخاب‌هایی در اختیار دارید. به‌طور خلاصه: قبله روی گوشی شما محاسبه می‌شود، ما سروری که موقعیت مکانی شما را ذخیره کند در اختیار نداریم و داده‌های شخصی شما را نمی‌فروشیم.","sections":[{"h":"۱. موقعیت مکانی شما","p":["برنامه فقط در زمانی که از آن استفاده می‌کنید، اجازهٔ دسترسی به موقعیت مکانی شما را درخواست می‌کند. موقعیت مکانی شما روی گوشی‌تان برای محاسبهٔ جهت قبله و فاصله تا کعبه به کار می‌رود. این اطلاعات به سرورهای ما ارسال نمی‌شود و ما آن را ذخیره نمی‌کنیم.","وقتی صفحهٔ نقشه را برای دیدن مساجد نزدیک باز می‌کنید، برنامه یک موقعیت تقریبی را که تا حدود ۱ کیلومتر گرد شده است، به سرویس رایگان OpenStreetMap Overpass (overpass-api.de، یا overpass.kumi.systems به‌عنوان پشتیبان) می‌فرستد تا مساجد اطراف شما را جست‌وجو کند. هیچ نام، حساب کاربری یا شناسهٔ دستگاهی به این درخواست پیوست نمی‌شود. داده‌های مساجد © مشارکت‌کنندگان OpenStreetMap، تحت مجوز ODbL در دسترس است.","خود نقشه توسط سرویس نقشهٔ گوشی شما (Apple Maps در iPhone و Google Maps در Android) نمایش داده می‌شود که تابع سیاست حفظ حریم خصوصی خود Apple یا Google است."]},{"h":"۲. دوربین","p":["دوربین فقط در صفحهٔ واقعیت افزوده (AR) و برای نمایش جهت قبله روی تصویر زندهٔ دوربین استفاده می‌شود. تصاویر به‌صورت هم‌زمان روی گوشی شما پردازش می‌شوند و هیچ چیزی ضبط، ذخیره یا بارگذاری نمی‌شود."]},{"h":"۳. اطلاعات ذخیره‌شده روی گوشی شما","p":["تنظیمات شما (طرح انتخابی، پوسته، اندازهٔ متن، آخرین صفحهٔ استفاده‌شده و ترجیحات مشابه) فقط روی گوشی شما ذخیره می‌شود. با حذف برنامه، این اطلاعات نیز حذف می‌شود."]},{"h":"۴. آمار استفادهٔ ناشناس","p":["برای اینکه بدانیم از کدام قابلیت‌ها استفاده می‌شود و مشکلات را برطرف کنیم، برنامه رویدادهای استفادهٔ ناشناس (برای مثال: کدام صفحه باز شده، آیا قبله پیدا شده است یا نه، نسخهٔ برنامه و نوع دستگاه) را به PostHog می‌فرستد که روی سرورهایی در اتحادیهٔ اروپا میزبانی می‌شود. این رویدادها شامل نام، موقعیت مکانی یا تصاویر دوربین شما نیستند. مانند هر اتصال اینترنتی، ممکن است نشانی IP شما توسط این سرویس پردازش شود، برای مثال برای تخمین کشور.","می‌توانید هر زمان که بخواهید این قابلیت را از مسیر تنظیمات ← «آمار استفاده» خاموش کنید."]},{"h":"۵. تبلیغات","p":["نسخهٔ رایگان Qibora تبلیغاتی را نمایش می‌دهد که Google AdMob ارائه می‌کند. Google ممکن است از شناسهٔ تبلیغاتی دستگاه شما و اطلاعات مشابه برای نمایش و سنجش تبلیغات و، با اجازهٔ شما، برای شخصی‌سازی آن‌ها استفاده کند.","در iPhone، تبلیغات شخصی‌سازی‌شده فقط در صورتی استفاده می‌شود که هنگام درخواست برنامه، اجازهٔ ردیابی بدهید. در منطقهٔ اقتصادی اروپا، بریتانیا و سوئیس، پنجرهٔ رضایت به شما امکان می‌دهد تعیین کنید داده‌هایتان چگونه برای تبلیغات استفاده شود. همچنین می‌توانید شناسهٔ تبلیغاتی خود را در تنظیمات گوشی بازنشانی یا محدود کنید.","تبلیغات به‌گونه‌ای فیلتر می‌شوند که برای عموم مخاطبان مناسب باشند. اطلاعات بیشتر: https://policies.google.com/technologies/ads","Qibora Pro همهٔ تبلیغات را حذف می‌کند."]},{"h":"۶. خریدها","p":["Qibora Pro از طریق App Store یا Google Play فروخته می‌شود. پرداخت‌ها به‌طور کامل توسط Apple یا Google انجام می‌شود و ما هرگز اطلاعات کارت یا جزئیات پرداخت شما را نمی‌بینیم.","برای تأیید خریدهایی که در اختیار دارید و بازیابی آن‌ها، برنامه از RevenueCat استفاده می‌کند که یک شناسهٔ ناشناس کاربر برنامه و رسیدهای خرید شما از فروشگاه را دریافت می‌کند. RevenueCat نام یا جزئیات پرداخت شما را دریافت نمی‌کند."]},{"h":"۷. کودکان","p":["Qibora برنامه‌ای برای عموم مخاطبان است و مخاطب آن کودکان زیر ۱۳ سال نیستند. ما آگاهانه اطلاعات شخصی کودکان را جمع‌آوری نمی‌کنیم."]},{"h":"۸. انتخاب‌ها و حقوق شما","p":["می‌توانید در تنظیمات گوشی خود اجازهٔ دسترسی به موقعیت مکانی و دوربین را رد کنید یا پس بگیرید (بدون موقعیت مکانی، برنامه نمی‌تواند قبله را پیدا کند)، آمار استفاده را در برنامه خاموش کنید، رضایت تبلیغاتی یا انتخاب خود دربارهٔ ردیابی را تغییر دهید، و با حذف برنامه همهٔ داده‌هایی را که به‌صورت محلی ذخیره شده‌اند پاک کنید.","بسته به محل زندگی‌تان (برای مثال طبق GDPR، UK GDPR، قانون KVKK ترکیه یا قانون CCPA کالیفرنیا)، ممکن است حق دسترسی به داده‌های شخصی، اصلاح یا حذف آن‌ها و اعتراض به پردازششان را داشته باشید. از آنجا که ما داده‌ای که هویت شما را مشخص کند نگهداری نمی‌کنیم، بیشتر درخواست‌ها از طریق گزینه‌های بالا قابل انجام است؛ همچنین می‌توانید از طریق نشانی زیر با ما تماس بگیرید."]},{"h":"۹. تغییرات این سیاست","p":["ممکن است با تغییر برنامه، این سیاست را به‌روزرسانی کنیم. تاریخ درج‌شده در بالای صفحه نشان‌دهندهٔ آخرین نسخه است."]},{"h":"۱۰. تماس و پشتیبانی","p":["برای پرسش دربارهٔ این سیاست، دریافت کمک در استفاده از برنامه یا مشکلات مربوط به خرید، به نشانی miswakapp@gmail.com برای ما بنویسید."]}],"langLabel":"زبان","supportTitle":"پشتیبانی","supportText":"برای Qibora یا خرید خود به کمک نیاز دارید؟ به نشانی miswakapp@gmail.com به ما ایمیل بزنید — معمولاً ظرف چند روز پاسخ می‌دهیم."},"ps":{"langName":"پښتو","title":"Qibora – د محرمیت پالیسي","updated":"وروستی تازه کول: 24 اکتوبر 2026","intro":"Qibora («اپلیکېشن») تاسو سره د قبلې د لوري او نږدې جوماتونو په موندلو کې مرسته کوي. دا پالیسي روښانه کوي چې اپلیکېشن کوم معلومات کاروي، دا معلومات چېرته ځي او تاسو کوم اختیارونه لرئ. په لنډ ډول: قبله ستاسو په تلیفون کې محاسبه کېږي، موږ داسې سرورونه نه چلوو چې ستاسو موقعیت خوندي کړي، او ستاسو شخصي معلومات نه پلورو.","sections":[{"h":"1. ستاسو موقعیت","p":["اپلیکېشن یوازې هغه وخت ستاسو د موقعیت اجازه غواړي چې تاسو یې کاروئ. ستاسو موقعیت ستاسو په تلیفون کې د قبلې د لوري او تر کعبې پورې د واټن د محاسبې لپاره کارول کېږي. دا زموږ سرورونو ته نه لېږل کېږي او موږ یې نه ساتو.","کله چې تاسو د نږدې جوماتونو د لیدو لپاره د نقشې پاڼه پرانیزئ، اپلیکېشن یو اټکلي موقعیت، چې شاوخوا 1 کیلومتر ته ګرد شوی وي، د OpenStreetMap Overpass وړیا خدمت (overpass-api.de، یا د بدیل په توګه overpass.kumi.systems) ته لېږي، ترڅو ستاسو شاوخوا جوماتونه ومومي. له دې غوښتنې سره هېڅ نوم، حساب یا د وسیلې پېژندونکی نه نښلول کېږي. د جوماتونو معلومات © د OpenStreetMap مرسته‌کوونکي، د ODbL جواز لاندې شته.","نقشه پخپله ستاسو د تلیفون د نقشې خدمت (په iPhone کې Apple Maps، په Android کې Google Maps) ښيي، چې د Apple یا Google د خپلې محرمیت پالیسۍ تابع دی."]},{"h":"2. کمره","p":["کمره یوازې د AR په پاڼه کې کارول کېږي، ترڅو د قبلې لوری د کمرې پر ژوندي انځور ښکاره کړي. انځورونه ستاسو په تلیفون کې سمدستي پروسس کېږي؛ هېڅ شی نه ثبتېږي، نه خوندي کېږي او نه پورته کېږي."]},{"h":"3. ستاسو په تلیفون کې خوندي شوي معلومات","p":["ستاسو تنظیمات (ټاکل شوی ډیزاین، بڼه، د متن اندازه، وروستۍ کارول شوې پاڼه او ورته غوره‌توبونه) یوازې ستاسو په تلیفون کې خوندي کېږي. د اپلیکېشن په ړنګولو سره دا هم ړنګېږي."]},{"h":"4. د کارونې بې‌نومه احصایې","p":["د دې لپاره چې پوه شو کومې ځانګړنې کارول کېږي او ستونزې حل کړو، اپلیکېشن د کارونې بې‌نومه پېښې (د بېلګې په توګه: کومه پاڼه پرانیستل شوه، آیا قبله وموندل شوه که نه، د اپلیکېشن نسخه او د وسیلې ډول) PostHog ته لېږي، چې په اروپايي اتحادیه کې پر سرورونو کوربه شوی دی. په دې پېښو کې ستاسو نوم، موقعیت یا د کمرې انځورونه نه شامل دي. د هرې انټرنېټي اړیکې په څېر، ښايي دا خدمت ستاسو IP پته پروسس کړي، د بېلګې په توګه د هېواد د اټکل لپاره.","تاسو کولای شئ هر وخت دا په تنظیمات ← «د کارونې احصایې» کې بنده کړئ."]},{"h":"5. اعلانونه","p":["د Qibora وړیا نسخه هغه اعلانونه ښيي چې Google AdMob یې برابروي. Google کولای شي ستاسو د وسیلې اعلاني پېژندونکی او ورته معلومات د اعلانونو د ښودلو او اندازه کولو لپاره، او ستاسو په اجازه د هغوی د شخصي کولو لپاره وکاروي.","په iPhone کې شخصي شوي اعلانونه یوازې هغه وخت کارول کېږي چې تاسو د اپلیکېشن د پوښتنې پر مهال د تعقیب (ټرېکنګ) اجازه ورکړئ. د اروپا په اقتصادي سیمه، بریتانیا او سویس کې، د رضایت یوه کړکۍ تاسو ته دا اختیار درکوي چې وټاکئ ستاسو معلومات د اعلانونو لپاره څنګه وکارول شي. تاسو کولای شئ د خپل تلیفون په تنظیماتو کې خپل اعلاني پېژندونکی بیا تنظیم یا محدود هم کړئ.","اعلانونه داسې فلټر کېږي چې د عام مخاطبانو لپاره مناسب وي. نور معلومات: https://policies.google.com/technologies/ads","Qibora Pro ټول اعلانونه لرې کوي."]},{"h":"6. پېرودنې","p":["Qibora Pro د App Store یا Google Play له لارې پلورل کېږي. تادیات په بشپړ ډول د Apple یا Google له خوا ترسره کېږي؛ موږ هېڅکله ستاسو د کارت یا تادیې جزئیات نه وینو.","د دې لپاره چې تایید شي کومې پېرودنې ستاسو دي او بېرته راوګرځول شي، اپلیکېشن RevenueCat کاروي، چې د اپلیکېشن د کاروونکي یو بې‌نومه پېژند (ID) او له پلورنځي څخه ستاسو د پېرودنې رسیدونه ترلاسه کوي. دا ستاسو نوم یا د تادیې جزئیات نه ترلاسه کوي."]},{"h":"7. ماشومان","p":["Qibora د عام مخاطبانو لپاره اپلیکېشن دی او د 13 کلونو څخه د کم عمر ماشومانو ته نه دی جوړ شوی. موږ په پوهه له ماشومانو څخه شخصي معلومات نه راټولوو."]},{"h":"8. ستاسو اختیارونه او حقونه","p":["تاسو کولای شئ د خپل تلیفون په تنظیماتو کې د موقعیت او کمرې اجازه رد یا بېرته واخلئ (له موقعیت پرته اپلیکېشن نشي کولای قبله ومومي)، په اپلیکېشن کې د کارونې احصایې بندې کړئ، د اعلانونو لپاره خپل رضایت یا د تعقیب په اړه خپل انتخاب بدل کړئ، او د اپلیکېشن په ړنګولو سره ټول په محلي ډول خوندي شوي معلومات ړنګ کړئ.","د دې پر بنسټ چې تاسو چېرته اوسېږئ (د بېلګې په توګه د GDPR، UK GDPR، د ترکیې د KVKK یا د کالیفورنیا د CCPA له مخې)، ښايي تاسو دا حق ولرئ چې شخصي معلوماتو ته لاسرسی ومومئ، سم یې کړئ یا یې ړنګ کړئ، او د هغوی پر پروسس اعتراض وکړئ. څرنګه چې موږ داسې معلومات نه ساتو چې ستاسو هویت وپېژني، ډېری غوښتنې د پورته اختیارونو له لارې پوره کېدای شي؛ تاسو کولای شئ د لاندې پتې له لارې هم له موږ سره اړیکه ونیسئ."]},{"h":"9. په دې پالیسۍ کې بدلونونه","p":["کله چې اپلیکېشن بدلون ومومي، ښايي موږ دا پالیسي تازه کړو. د پاڼې په سر کې نېټه وروستۍ نسخه ښيي."]},{"h":"10. اړیکه او ملاتړ","p":["د دې پالیسۍ په اړه د پوښتنو، د اپلیکېشن په کارولو کې د مرستې، یا د پېرودنې د ستونزو لپاره موږ ته په miswakapp@gmail.com ولیکئ."]}],"langLabel":"ژبه","supportTitle":"ملاتړ","supportText":"آیا د Qibora یا کومې پېرودنې په اړه مرستې ته اړتیا لرئ؟ موږ ته په miswakapp@gmail.com برېښنالیک ولېږئ — موږ معمولاً په څو ورځو کې ځواب درکوو."},"uz":{"langName":"Oʻzbekcha","title":"Qibora – Maxfiylik siyosati","updated":"Soʻnggi yangilanish: 2026-yil 24-oktabr","intro":"Qibora («ilova») qibla yoʻnalishini va yaqin atrofdagi masjidlarni topishingizga yordam beradi. Ushbu siyosat ilova qanday maʼlumotlardan foydalanishini, ular qayerga yuborilishini va sizda qanday tanlov imkoniyatlari borligini tushuntiradi. Qisqacha aytganda: qibla telefoningizda hisoblanadi, biz joylashuvingizni saqlaydigan serverlarni yuritmaymiz va shaxsiy maʼlumotlaringizni sotmaymiz.","sections":[{"h":"1. Joylashuvingiz","p":["Ilova joylashuvingizga ruxsatni faqat undan foydalanayotganingizda soʻraydi. Joylashuvingiz telefoningizda qibla yoʻnalishini va Kaʼbagacha boʻlgan masofani hisoblash uchun ishlatiladi. U serverlarimizga yuborilmaydi va biz uni saqlamaymiz.","Yaqin atrofdagi masjidlarni koʻrish uchun Xarita ekranini ochganingizda, ilova atrofingizdagi masjidlarni topish maqsadida taxminan 1 km gacha yaxlitlangan taxminiy joylashuvingizni bepul OpenStreetMap Overpass xizmatiga (overpass-api.de yoki zaxira sifatida overpass.kumi.systems) yuboradi. Bu soʻrovga hech qanday ism, hisob yoki qurilma identifikatori biriktirilmaydi. Masjidlar haqidagi maʼlumotlar © OpenStreetMap ishtirokchilari; ODbL litsenziyasi asosida taqdim etiladi.","Xaritaning oʻzi telefoningizning xarita xizmati (iPhone qurilmalarida Apple Maps, Android qurilmalarida Google Maps) tomonidan koʻrsatiladi va bu xizmat Apple yoki Google kompaniyasining oʻz maxfiylik siyosatiga boʻysunadi."]},{"h":"2. Kamera","p":["Kamera faqat AR ekranida, qibla yoʻnalishini jonli kamera tasviri ustida koʻrsatish uchun ishlatiladi. Tasvirlar telefoningizda real vaqt rejimida qayta ishlanadi; hech narsa yozib olinmaydi, saqlanmaydi yoki yuklanmaydi."]},{"h":"3. Telefoningizda saqlanadigan maʼlumotlar","p":["Sozlamalaringiz (tanlangan dizayn, mavzu, matn oʻlchami, oxirgi foydalanilgan ekran va shunga oʻxshash boshqa tanlovlar) faqat telefoningizda saqlanadi. Ilova oʻchirilganda ular ham oʻchib ketadi."]},{"h":"4. Anonim foydalanish statistikasi","p":["Qaysi funksiyalardan foydalanilishini tushunish va muammolarni bartaraf etish uchun ilova anonim foydalanish hodisalarini (masalan: qaysi ekran ochilgani, qibla topilgan-topilmagani, ilova versiyasi va qurilma turi) Yevropa Ittifoqidagi serverlarda joylashgan PostHog xizmatiga yuboradi. Bu hodisalar ismingiz, joylashuvingiz yoki kamera tasvirlarini oʻz ichiga olmaydi. Har qanday internet ulanishida boʻlgani kabi, IP manzilingiz ushbu xizmat tomonidan, masalan, mamlakatingizni taxminan aniqlash uchun qayta ishlanishi mumkin.","Buni istalgan vaqtda Sozlamalar → «Foydalanish statistikasi» boʻlimida oʻchirib qoʻyishingiz mumkin."]},{"h":"5. Reklama","p":["Qibora ilovasining bepul versiyasida Google AdMob tomonidan taqdim etiladigan reklamalar koʻrsatiladi. Google reklamalarni koʻrsatish va oʻlchash, shuningdek, sizning ruxsatingiz bilan ularni shaxsiylashtirish uchun qurilmangizning reklama identifikatori va shunga oʻxshash maʼlumotlardan foydalanishi mumkin.","iPhone qurilmalarida shaxsiylashtirilgan reklamalar faqat ilova soʻraganda kuzatuvga ruxsat bersangizgina ishlatiladi. Yevropa iqtisodiy hududi, Buyuk Britaniya va Shveytsariyada rozilik oynasi maʼlumotlaringiz reklama uchun qanday ishlatilishini tanlash imkonini beradi. Shuningdek, reklama identifikatoringizni telefoningiz sozlamalarida qayta oʻrnatishingiz yoki cheklashingiz mumkin.","Reklamalar keng auditoriyaga mos boʻlishi uchun filtrlanadi. Batafsil maʼlumot: https://policies.google.com/technologies/ads","Qibora Pro barcha reklamalarni olib tashlaydi."]},{"h":"6. Xaridlar","p":["Qibora Pro App Store yoki Google Play orqali sotiladi. Toʻlovlar toʻliq Apple yoki Google tomonidan amalga oshiriladi; biz hech qachon kartangiz yoki toʻlov maʼlumotlaringizni koʻrmaymiz.","Qaysi xaridlar sizga tegishli ekanini tasdiqlash va ularni tiklash uchun ilova RevenueCat xizmatidan foydalanadi; RevenueCat anonim ilova foydalanuvchisi identifikatori va doʻkondagi xarid kvitansiyalaringizni oladi. U ismingiz yoki toʻlov maʼlumotlaringizni olmaydi."]},{"h":"7. Bolalar","p":["Qibora keng auditoriyaga moʻljallangan ilova boʻlib, 13 yoshgacha boʻlgan bolalarga qaratilmagan. Biz bolalardan bila turib shaxsiy maʼlumot toʻplamaymiz."]},{"h":"8. Tanlovlaringiz va huquqlaringiz","p":["Siz telefoningiz sozlamalarida joylashuv va kameraga ruxsatni rad etishingiz yoki bekor qilishingiz (joylashuvsiz ilova qiblani topa olmaydi), ilovada foydalanish statistikasini oʻchirib qoʻyishingiz, reklama roziligingiz yoki kuzatuv boʻyicha tanlovingizni oʻzgartirishingiz hamda ilovani oʻchirish orqali qurilmada saqlangan barcha maʼlumotlarni oʻchirishingiz mumkin.","Yashash joyingizga qarab (masalan, GDPR, UK GDPR, Turkiyaning KVKK yoki Kaliforniyaning CCPA qonunchiligiga koʻra) shaxsiy maʼlumotlaringiz bilan tanishish, ularni tuzatish yoki oʻchirish hamda ularni qayta ishlashga eʼtiroz bildirish huquqiga ega boʻlishingiz mumkin. Biz sizni aniqlash imkonini beradigan maʼlumotlarni saqlamaganimiz sababli, aksariyat soʻrovlarni yuqoridagi imkoniyatlar orqali bajarish mumkin; shuningdek, quyidagi manzil orqali biz bilan bogʻlanishingiz mumkin."]},{"h":"9. Ushbu siyasatdagi oʻzgarishlar","p":["Ilova oʻzgarganda ushbu siyasatni yangilashimiz mumkin. Yuqoridagi sana eng soʻnggi tahrirni koʻrsatadi."]},{"h":"10. Aloqa va yordam","p":["Ushbu siyasat yuzasidan savollar, ilova boʻyicha yordam yoki xarid bilan bogʻliq muammolar uchun bizga miswakapp@gmail.com manziliga yozing."]}],"langLabel":"Til","supportTitle":"Yordam","supportText":"Qibora yoki xarid boʻyicha yordam kerakmi? Bizga miswakapp@gmail.com manziliga xat yozing — odatda bir necha kun ichida javob beramiz."},"kk":{"langName":"Қазақ тілі","title":"Qibora – Құпиялылық саясаты","updated":"Соңғы жаңартылған күні: 2026 жылғы 24 қазан","intro":"Qibora («қолданба») құбыла бағытын және жақын маңдағы мешіттерді табуға көмектеседі. Бұл саясат қолданбаның қандай ақпаратты пайдаланатынын, ол қайда жіберілетінін және сізде қандай таңдау мүмкіндіктері бар екенін түсіндіреді. Қысқаша айтқанда: құбыла телефоныңызда есептеледі, біз орналасқан жеріңізді сақтайтын серверлер жүргізбейміз және жеке деректеріңізді сатпаймыз.","sections":[{"h":"1. Орналасқан жеріңіз","p":["Қолданба орналасқан жеріңізге рұқсатты тек оны пайдаланып жатқан кезде ғана сұрайды. Орналасқан жеріңіз құбыла бағытын және Қағбаға дейінгі қашықтықты есептеу үшін телефоныңызда пайдаланылады. Ол біздің серверлерге жіберілмейді және біз оны сақтамаймыз.","Жақын маңдағы мешіттерді көру үшін Карта экранын ашқанда, қолданба айналаңыздағы мешіттерді іздеу үшін шамамен 1 км-ге дейін дөңгелектенген жуық орналасқан жеріңізді тегін OpenStreetMap Overpass қызметіне (overpass-api.de немесе қосалқы ретінде overpass.kumi.systems) жібереді. Бұл сұрауға ешқандай аты-жөн, тіркелгі немесе құрылғы идентификаторы қосылмайды. Мешіттер туралы деректер © OpenStreetMap қатысушылары; ODbL лицензиясы бойынша қолжетімді.","Картаның өзін телефоныңыздың карта қызметі (iPhone-да Apple Maps, Android-те Google Maps) көрсетеді және ол Apple немесе Google компаниясының өз құпиялылық саясатына бағынады."]},{"h":"2. Камера","p":["Камера тек AR экранында, құбыла бағытын камераның тікелей бейнесінің үстінен көрсету үшін пайдаланылады. Бейнелер телефоныңызда нақты уақыт режимінде өңделеді; ештеңе жазылмайды, сақталмайды немесе жүктеп жіберілмейді."]},{"h":"3. Телефоныңызда сақталатын ақпарат","p":["Параметрлеріңіз (таңдалған дизайн, тақырып, мәтін өлшемі, соңғы пайдаланылған экран және осыған ұқсас басқа таңдаулар) тек телефоныңызда сақталады. Қолданбаны жойған кезде олар да жойылады."]},{"h":"4. Анонимді пайдалану статистикасы","p":["Қандай функциялар пайдаланылатынын түсіну және ақауларды түзету үшін қолданба анонимді пайдалану оқиғаларын (мысалы: қай экран ашылғаны, құбыланың табылған-табылмағаны, қолданба нұсқасы және құрылғы түрі) Еуропалық Одақтағы серверлерде орналасқан PostHog қызметіне жібереді. Бұл оқиғаларға атыңыз, орналасқан жеріңіз немесе камера бейнелері кірмейді. Кез келген интернет байланысындағыдай, IP мекенжайыңыз осы қызмет тарапынан, мысалы, еліңізді шамамен анықтау үшін өңделуі мүмкін.","Мұны кез келген уақытта Параметрлер → «Пайдалану статистикасы» бөлімінде өшіре аласыз."]},{"h":"5. Жарнама","p":["Qibora қолданбасының тегін нұсқасында Google AdMob ұсынатын жарнамалар көрсетіледі. Google жарнамаларды көрсету және өлшеу, сондай-ақ сіздің рұқсатыңызбен оларды жекелендіру үшін құрылғыңыздың жарнамалық идентификаторын және осыған ұқсас ақпаратты пайдалануы мүмкін.","iPhone-да жекелендірілген жарнамалар қолданба сұраған кезде бақылауға рұқсат берсеңіз ғана пайдаланылады. Еуропалық экономикалық аймақта, Ұлыбританияда және Швейцарияда келісім терезесі деректеріңіздің жарнама үшін қалай пайдаланылатынын таңдауға мүмкіндік береді. Сондай-ақ жарнамалық идентификаторыңызды телефоныңыздың параметрлерінде ысыруға немесе шектеуге болады.","Жарнамалар жалпы аудиторияға жарамды болатындай сүзгіден өткізіледі. Толығырақ: https://policies.google.com/technologies/ads","Qibora Pro барлық жарнаманы алып тастайды."]},{"h":"6. Сатып алулар","p":["Qibora Pro App Store немесе Google Play арқылы сатылады. Төлемдерді толығымен Apple немесе Google өңдейді; біз сіздің картаңыз бен төлем деректеріңізді ешқашан көрмейміз.","Сізге тиесілі сатып алуларды растау және оларды қалпына келтіру үшін қолданба RevenueCat қызметін пайдаланады; ол қолданбаның анонимді пайдаланушы идентификаторын және дүкендегі сатып алу түбіртектеріңізді алады. Ол сіздің атыңызды немесе төлем деректеріңізді алмайды."]},{"h":"7. Балалар","p":["Qibora – жалпы аудиторияға арналған қолданба және 13 жасқа толмаған балаларға бағытталмаған. Біз балалардан жеке ақпаратты біле тұра жинамаймыз."]},{"h":"8. Таңдауларыңыз бен құқықтарыңыз","p":["Телефоныңыздың параметрлерінде орналасқан жер мен камераға рұқсат беруден бас тартуға немесе оны кері қайтарып алуға (орналасқан жерсіз қолданба құбыланы таба алмайды), қолданбада пайдалану статистикасын өшіруге, жарнамаға келісіміңізді немесе бақылау жөніндегі таңдауыңызды өзгертуге және қолданбаны жою арқылы құрылғыда сақталған барлық деректерді жоюға болады.","Тұратын жеріңізге байланысты (мысалы, GDPR, UK GDPR, Түркияның KVKK немесе Калифорнияның CCPA заңнамасы бойынша) жеке деректерге қол жеткізуге, оларды түзетуге немесе жоюға, сондай-ақ оларды өңдеуге қарсылық білдіруге құқығыңыз болуы мүмкін. Біз сіздің жеке басыңызды анықтайтын деректерді сақтамайтындықтан, сұраулардың көпшілігін жоғарыдағы мүмкіндіктер арқылы орындауға болады; сондай-ақ төмендегі мекенжай бойынша бізге хабарласа аласыз."]},{"h":"9. Осы саясаттағы өзгерістер","p":["Қолданба өзгерген кезде біз осы саясатты жаңартуымыз мүмкін. Жоғарыдағы күн соңғы нұсқаны көрсетеді."]},{"h":"10. Байланыс және қолдау","p":["Осы саясатқа қатысты сұрақтар, қолданба бойынша көмек немесе сатып алуға байланысты мәселелер бойынша бізге miswakapp@gmail.com мекенжайына жазыңыз."]}],"langLabel":"Тіл","supportTitle":"Қолдау","supportText":"Qibora немесе сатып алу бойынша көмек керек пе? Бізге miswakapp@gmail.com мекенжайына хат жазыңыз – әдетте бірнеше күн ішінде жауап береміз."},"az":{"langName":"Azərbaycan dili","title":"Qibora – Məxfilik siyasəti","updated":"Son yenilənmə: 24 oktyabr 2026","intro":"Qibora («tətbiq») qiblə istiqamətini və yaxınlıqdakı məscidləri tapmağınıza kömək edir. Bu siyasət tətbiqin hansı məlumatlardan istifadə etdiyini, bu məlumatların hara göndərildiyini və hansı seçimlərə malik olduğunuzu izah edir. Qısaca: qiblə telefonunuzda hesablanır, məkanınızı saxlayan serverlər işlətmirik və şəxsi məlumatlarınızı satmırıq.","sections":[{"h":"1. Məkanınız","p":["Tətbiq məkanınıza giriş icazəsini yalnız ondan istifadə etdiyiniz müddətdə istəyir. Məkanınız telefonunuzda qiblə istiqamətini və Kəbəyə qədər olan məsafəni hesablamaq üçün istifadə olunur. O, serverlərimizə göndərilmir və bizim tərəfimizdən saxlanılmır.","Yaxınlıqdakı məscidləri görmək üçün Xəritə ekranını açdığınız zaman tətbiq ətrafınızdakı məscidləri axtarmaq məqsədilə təxminən 1 km-ə qədər yuvarlaqlaşdırılmış təxmini məkanınızı pulsuz OpenStreetMap Overpass xidmətinə (overpass-api.de və ya ehtiyat olaraq overpass.kumi.systems) göndərir. Bu sorğuya heç bir ad, hesab və ya cihaz identifikatoru əlavə edilmir. Məscid məlumatları © OpenStreetMap iştirakçıları; ODbL lisenziyası əsasında əlçatandır.","Xəritənin özü telefonunuzun xəritə xidməti (iPhone-da Apple Maps, Android-də Google Maps) tərəfindən göstərilir və bu xidmət Apple və ya Google şirkətinin öz məxfilik siyasətinə tabedir."]},{"h":"2. Kamera","p":["Kameradan yalnız AR ekranında, qiblə istiqamətini canlı kamera görüntüsünün üzərində göstərmək üçün istifadə olunur. Görüntülər telefonunuzda real vaxt rejimində emal edilir; heç nə qeydə alınmır, saxlanılmır və ya yüklənmir."]},{"h":"3. Telefonunuzda saxlanılan məlumatlar","p":["Parametrləriniz (seçilmiş dizayn, mövzu, mətn ölçüsü, son istifadə olunan ekran və digər oxşar seçimlər) yalnız telefonunuzda saxlanılır. Tətbiqi sildikdə onlar da silinir."]},{"h":"4. Anonim istifadə statistikası","p":["Hansı funksiyalardan istifadə olunduğunu anlamaq və problemləri aradan qaldırmaq üçün tətbiq anonim istifadə hadisələrini (məsələn: hansı ekranın açıldığı, qiblənin tapılıb-tapılmadığı, tətbiqin versiyası və cihazın növü) Avropa İttifaqındakı serverlərdə yerləşdirilən PostHog xidmətinə göndərir. Bu hadisələrə adınız, məkanınız və ya kamera görüntüləri daxil deyil. İstənilən internet bağlantısında olduğu kimi, IP ünvanınız xidmət tərəfindən, məsələn, ölkənizi təxmini müəyyən etmək üçün emal edilə bilər.","Bunu istənilən vaxt Parametrlər → «İstifadə statistikası» bölməsində söndürə bilərsiniz."]},{"h":"5. Reklam","p":["Qibora-nın pulsuz versiyası Google AdMob tərəfindən təqdim olunan reklamlar göstərir. Google reklamları göstərmək və ölçmək, həmçinin icazənizlə onları fərdiləşdirmək üçün cihazınızın reklam identifikatorundan və oxşar məlumatlardan istifadə edə bilər.","iPhone-da fərdiləşdirilmiş reklamlardan yalnız tətbiq soruşduqda izləməyə icazə versəniz istifadə olunur. Avropa İqtisadi Zonasında, Birləşmiş Krallıqda və İsveçrədə razılıq pəncərəsi məlumatlarınızın reklam üçün necə istifadə ediləcəyini seçməyə imkan verir. Həmçinin reklam identifikatorunuzu telefonunuzun parametrlərində sıfırlaya və ya məhdudlaşdıra bilərsiniz.","Reklamlar geniş auditoriya üçün uyğun olacaq şəkildə filtrlənir. Ətraflı məlumat: https://policies.google.com/technologies/ads","Qibora Pro bütün reklamları aradan qaldırır."]},{"h":"6. Satınalmalar","p":["Qibora Pro App Store və ya Google Play vasitəsilə satılır. Ödənişlər tamamilə Apple və ya Google tərəfindən həyata keçirilir; kart və ya ödəniş məlumatlarınızı heç vaxt görmürük.","Hansı satınalmalara sahib olduğunuzu təsdiqləmək və onları bərpa etmək üçün tətbiq RevenueCat xidmətindən istifadə edir; RevenueCat anonim tətbiq istifadəçi identifikatorunu və mağaza satınalma qəbzlərinizi əldə edir. O, adınızı və ya ödəniş məlumatlarınızı almır."]},{"h":"7. Uşaqlar","p":["Qibora geniş auditoriya üçün nəzərdə tutulmuş tətbiqdir və 13 yaşınadək uşaqlara yönəlməyib. Biz uşaqlardan bilərəkdən şəxsi məlumat toplamırıq."]},{"h":"8. Seçimləriniz və hüquqlarınız","p":["Telefonunuzun parametrlərində məkan və kamera icazəsini rədd edə və ya geri götürə (məkan olmadan tətbiq qibləni tapa bilməyəcək), tətbiqdə istifadə statistikasını söndürə, reklam razılığınızı və ya izləmə seçiminizi dəyişə, həmçinin tətbiqi silməklə yerli olaraq saxlanılan bütün məlumatları silə bilərsiniz.","Yaşadığınız yerdən asılı olaraq (məsələn, GDPR, UK GDPR, Türkiyənin KVKK və ya Kaliforniyanın CCPA qanunvericiliyinə əsasən) şəxsi məlumatlara çıxış əldə etmək, onları düzəltmək və ya silmək, habelə onların emalına etiraz etmək hüququnuz ola bilər. Sizi tanıdan məlumatları saxlamadığımız üçün sorğuların əksəriyyəti yuxarıdakı seçimlər vasitəsilə təmin edilə bilər; həmçinin aşağıdakı ünvan vasitəsilə bizimlə əlaqə saxlaya bilərsiniz."]},{"h":"9. Bu siyasətdə dəyişikliklər","p":["Tətbiq dəyişdikdə bu siyasəti yeniləyə bilərik. Yuxarıdakı tarix ən son versiyanı göstərir."]},{"h":"10. Əlaqə və dəstək","p":["Bu siyasətlə bağlı suallar, tətbiqlə bağlı kömək və ya satınalma ilə bağlı problemlər üçün bizə miswakapp@gmail.com ünvanına yazın."]}],"langLabel":"Dil","supportTitle":"Dəstək","supportText":"Qibora və ya satınalma ilə bağlı köməyə ehtiyacınız var? Bizə miswakapp@gmail.com ünvanına e-poçt göndərin — adətən bir neçə gün ərzində cavab veririk."},"ky":{"langName":"Кыргызча","title":"Qibora – Купуялык саясаты","updated":"Акыркы жолу жаңыртылган: 2026-жылдын 24-октябры","intro":"Qibora («колдонмо») кыбыла багытын жана жакын жердеги мечиттерди табууга жардам берет. Бул саясат колдонмо кандай маалыматты колдонорун, ал кайда жөнөтүлөрүн жана сизде кандай тандоо мүмкүнчүлүктөрү бар экенин түшүндүрөт. Кыскасы: кыбыла телефонуңузда эсептелет, биз жайгашкан жериңизди сактаган серверлерди иштетпейбиз жана жеке маалыматтарыңызды сатпайбыз.","sections":[{"h":"1. Жайгашкан жериңиз","p":["Колдонмо жайгашкан жериңизге уруксатты аны колдонуп жаткан учурда гана сурайт. Жайгашкан жериңиз кыбыла багытын жана Каабага чейинки аралыкты эсептөө үчүн телефонуңузда колдонулат. Ал биздин серверлерге жөнөтүлбөйт жана биз аны сактабайбыз.","Жакын жердеги мечиттерди көрүү үчүн Карта экранын ачканыңызда, колдонмо айланаңыздагы мечиттерди издөө максатында болжол менен 1 км чейин тегеректелген болжолдуу жайгашкан жериңизди акысыз OpenStreetMap Overpass кызматына (overpass-api.de же камдык катары overpass.kumi.systems) жөнөтөт. Бул сурамга эч кандай аты-жөн, аккаунт же түзмөк идентификатору тиркелбейт. Мечиттер тууралуу маалыматтар © OpenStreetMap катышуучулары; ODbL лицензиясы боюнча жеткиликтүү.","Картанын өзүн телефонуңуздун карта кызматы (iPhone түзмөктөрүндө Apple Maps, Android түзмөктөрүндө Google Maps) көрсөтөт жана ал Apple же Google компаниясынын өз купуялык саясатына баш ийет."]},{"h":"2. Камера","p":["Камера AR экранында гана, кыбыла багытын камеранын түз көрүнүшүнүн үстүндө көрсөтүү үчүн колдонулат. Сүрөттөр телефонуңузда реалдуу убакытта иштетилет; эч нерсе жазылбайт, сакталбайт жана жүктөлүп жөнөтүлбөйт."]},{"h":"3. Телефонуңузда сакталган маалымат","p":["Жөндөөлөрүңүз (тандалган дизайн, тема, текст өлчөмү, акыркы колдонулган экран жана ушул сыяктуу башка тандоолор) телефонуңузда гана сакталат. Колдонмону өчүргөндө алар да өчүрүлөт."]},{"h":"4. Аноним колдонуу статистикасы","p":["Кайсы функциялар колдонуларын түшүнүү жана көйгөйлөрдү оңдоо үчүн колдонмо аноним колдонуу окуяларын (мисалы: кайсы экран ачылганы, кыбыла табылган-табылбаганы, колдонмонун версиясы жана түзмөктүн түрү) Европа Биримдигиндеги серверлерде жайгашкан PostHog кызматына жөнөтөт. Бул окуяларга атыңыз, жайгашкан жериңиз же камерадагы сүрөттөр кирбейт. Ар кандай интернет байланышындагыдай эле, IP дарегиңиз бул кызмат тарабынан, мисалы, өлкөңүздү болжолдуу аныктоо үчүн иштетилиши мүмкүн.","Муну каалаган убакта Жөндөөлөр → «Колдонуу статистикасы» бөлүмүнөн өчүрө аласыз."]},{"h":"5. Жарнама","p":["Qibora колдонмосунун акысыз версиясында Google AdMob сунуштаган жарнамалар көрсөтүлөт. Google жарнамаларды көрсөтүү жана өлчөө, ошондой эле сиздин уруксатыңыз менен аларды жекелештирүү үчүн түзмөгүңүздүн жарнамалык идентификаторун жана ушуга окшош маалыматты колдонушу мүмкүн.","iPhone түзмөктөрүндө жекелештирилген жарнамалар колдонмо сураганда көз салууга уруксат берсеңиз гана колдонулат. Европа экономикалык аймагында, Улуу Британияда жана Швейцарияда макулдук терезеси маалыматтарыңыз жарнама үчүн кантип колдонуларын тандоого мүмкүндүк берет. Ошондой эле жарнамалык идентификаторуңузду телефонуңуздун жөндөөлөрүнөн баштапкы абалга келтирип же чектей аласыз.","Жарнамалар кеңири аудиторияга ылайыктуу болушу үчүн чыпкаланат. Кошумча маалымат: https://policies.google.com/technologies/ads","Qibora Pro бардык жарнамаларды алып салат."]},{"h":"6. Сатып алуулар","p":["Qibora Pro App Store же Google Play аркылуу сатылат. Төлөмдөрдү толугу менен Apple же Google иштетет; биз сиздин картаңызды же төлөм маалыматтарыңызды эч качан көрбөйбүз.","Кайсы сатып алуулар сизге таандык экенин ырастоо жана аларды калыбына келтирүү үчүн колдонмо RevenueCat кызматын колдонот; ал колдонмонун аноним колдонуучу идентификаторун жана дүкөндөгү сатып алуу квитанцияларыңызды алат. Ал атыңызды же төлөм маалыматтарыңызды албайт."]},{"h":"7. Балдар","p":["Qibora – кеңири аудиторияга арналган колдонмо жана 13 жашка толо элек балдарга багытталган эмес. Биз балдардан жеке маалыматты билип туруп чогултпайбыз."]},{"h":"8. Тандоолоруңуз жана укуктарыңыз","p":["Телефонуңуздун жөндөөлөрүнөн жайгашкан жерге жана камерага уруксат бербей же аны кайра ала аласыз (жайгашкан жерсиз колдонмо кыбыланы таба албайт), ошондой эле колдонмодо колдонуу статистикасын өчүрүп, жарнамага макулдугуңузду же көз салуу боюнча тандооңузду өзгөртүп, колдонмону өчүрүү менен түзмөктө сакталган бардык маалыматтарды жок кыла аласыз.","Жашаган жериңизге жараша (мисалы, GDPR, UK GDPR, Түркиянын KVKK же Калифорниянын CCPA мыйзамдарына ылайык) жеке маалыматтарга жетүү, аларды оңдоо же өчүрүү, ошондой эле аларды иштетүүгө каршы чыгуу укугуңуз болушу мүмкүн. Биз сиздин инсандыгыңызды аныктаган маалыматтарды сактабагандыктан, суроо-талаптардын көбүн жогорудагы мүмкүнчүлүктөр аркылуу аткарууга болот; ошондой эле төмөнкү дарек боюнча биз менен байланыша аласыз."]},{"h":"9. Бул саясаттагы өзгөрүүлөр","p":["Колдонмо өзгөргөндө бул саясатты жаңыртышыбыз мүмкүн. Жогорудагы күн акыркы версияны көрсөтөт."]},{"h":"10. Байланыш жана колдоо","p":["Бул саясат боюнча суроолор, колдонмо боюнча жардам же сатып алууга байланыштуу көйгөйлөр үчүн бизге miswakapp@gmail.com дарегине жазыңыз."]}],"langLabel":"Тил","supportTitle":"Колдоо","supportText":"Qibora же сатып алуу боюнча жардам керекпи? Бизге miswakapp@gmail.com дарегине кат жазыңыз – адатта бир нече күндүн ичинде жооп беребиз."},"tk":{"langName":"Türkmençe","title":"Qibora – Gizlinlik syýasaty","updated":"Soňky täzelenen senesi: 2026-njy ýylyň 24-nji oktýabry","intro":"Qibora (“programma”) kybla ugruny we golaýdaky metjitleri tapmaga kömek edýär. Bu syýasat programmanyň haýsy maglumatlary ulanýandygyny, olaryň nirä iberilýändigini we siziň haýsy saýlaw mümkinçilikleriňiziň bardygyny düşündirýär. Gysgaça aýdylanda: kybla telefonyňyzda hasaplanýar, biz ýerleşýän ýeriňizi saklaýan serwerleri işletmeýäris we şahsy maglumatlaryňyzy satmaýarys.","sections":[{"h":"1. Ýerleşýän ýeriňiz","p":["Programma ýerleşýän ýeriňize rugsady diňe ony ulanýan wagtyňyz soraýar. Ýerleşýän ýeriňiz kybla ugruny we Käbä çenli aralygy hasaplamak üçin telefonyňyzda ulanylýar. Ol biziň serwerlerimize iberilmeýär we biz ony saklamaýarys.","Golaýdaky metjitleri görmek üçin Karta ekranyny açanyňyzda, programma töweregiňizdäki metjitleri gözlemek maksady bilen takmynan 1 km çenli tegeleklenen takmyny ýerleşişiňizi mugt OpenStreetMap Overpass hyzmatyna (overpass-api.de ýa-da ätiýaçlyk hökmünde overpass.kumi.systems) iberýär. Bu haýyşa hiç hili at, hasap ýa-da enjam kesgitleýjisi goşulmaýar. Metjitler baradaky maglumatlar © OpenStreetMap gatnaşyjylary; ODbL ygtyýarnamasy esasynda elýeterlidir.","Kartanyň özi telefonyňyzyň karta hyzmaty (iPhone-da Apple Maps, Android-de Google Maps) arkaly görkezilýär we bu hyzmat Apple ýa-da Google kompaniýasynyň öz gizlinlik syýasatyna tabyndyr."]},{"h":"2. Kamera","p":["Kamera diňe AR ekranynda, kybla ugruny kameranyň göni şekiliniň üstünde görkezmek üçin ulanylýar. Şekiller telefonyňyzda hakyky wagt düzgüninde işlenýär; hiç zat ýazga alynmaýar, saklanmaýar ýa-da ýüklenip iberilmeýär."]},{"h":"3. Telefonyňyzda saklanýan maglumatlar","p":["Sazlamalaryňyz (saýlanan dizaýn, tema, tekst ölçegi, iň soňky ulanylan ekran we şuňa meňzeş beýleki saýlawlar) diňe telefonyňyzda saklanýar. Programmany pozanyňyzda olar hem pozulýar."]},{"h":"4. Anonim ulanyş statistikasy","p":["Haýsy funksiýalaryň ulanylýandygyna düşünmek we näsazlyklary düzetmek üçin programma anonim ulanyş wakalaryny (meselem: haýsy ekranyň açylandygy, kyblanyň tapylandygy ýa-da tapylmandygy, programmanyň wersiýasy we enjamyň görnüşi) Ýewropa Bileleşigindäki serwerlerde ýerleşdirilen PostHog hyzmatyna iberýär. Bu wakalara adyňyz, ýerleşýän ýeriňiz ýa-da kamera şekilleri girmeýär. Islendik internet birikmesinde bolşy ýaly, IP salgyňyz bu hyzmat tarapyndan, meselem, ýurduňyzy takmynan kesgitlemek üçin işlenip bilner.","Muny islendik wagt Sazlamalar → “Ulanyş statistikasy” bölüminde öçürip bilersiňiz."]},{"h":"5. Mahabat","p":["Qibora programmasynyň mugt wersiýasynda Google AdMob tarapyndan üpjün edilýän mahabatlar görkezilýär. Google mahabatlary görkezmek we ölçemek, şeýle hem siziň rugsadyňyz bilen olary şahsylaşdyrmak üçin enjamyňyzyň mahabat kesgitleýjisini we şuňa meňzeş maglumatlary ulanyp biler.","iPhone-da şahsylaşdyrylan mahabatlar diňe programma soranda yzarlamaga rugsat beren ýagdaýyňyzda ulanylýar. Ýewropa ykdysady zolagynda, Birleşen Patyşalykda we Şweýsariýada razylyk penjiresi maglumatlaryňyzyň mahabat üçin nähili ulanyljakdygyny saýlamaga mümkinçilik berýär. Şeýle hem mahabat kesgitleýjiňizi telefonyňyzyň sazlamalarynda täzeläp ýa-da çäklendirip bilersiňiz.","Mahabatlar giň köpçülige laýyk bolar ýaly süzgüçden geçirilýär. Has giňişleýin maglumat: https://policies.google.com/technologies/ads","Qibora Pro ähli mahabatlary aýyrýar."]},{"h":"6. Satyn almalar","p":["Qibora Pro App Store ýa-da Google Play arkaly satylýar. Tölegler doly Apple ýa-da Google tarapyndan amala aşyrylýar; biz siziň kartyňyzy ýa-da töleg maglumatlaryňyzy hiç haçan görmeýäris.","Haýsy satyn almalaryň size degişlidigini tassyklamak we olary dikeltmek üçin programma RevenueCat hyzmatyny ulanýar; ol programmanyň anonim ulanyjy kesgitleýjisini we dükandaky satyn alyş kwitansiýalaryňyzy alýar. Ol adyňyzy ýa-da töleg maglumatlaryňyzy almaýar."]},{"h":"7. Çagalar","p":["Qibora giň ulanyjylar köpçüligi üçin niýetlenen programma bolup, 13 ýaşa ýetmedik çagalara gönükdirilmändir. Biz çagalardan bilkastlaýyn şahsy maglumat ýygnamaýarys."]},{"h":"8. Saýlawlaryňyz we hukuklaryňyz","p":["Telefonyňyzyň sazlamalarynda ýerleşiş we kamera rugsadyny bermekden ýüz öwrüp ýa-da ony yzyna alyp (ýerleşişsiz programma kyblany tapyp bilmez), programmada ulanyş statistikasyny öçürip, mahabat razylygyňyzy ýa-da yzarlama boýunça saýlawyňyzy üýtgedip we programmany pozmak arkaly enjamda saklanýan ähli maglumatlary pozup bilersiňiz.","Ýaşaýan ýeriňize baglylykda (meselem, GDPR, UK GDPR, Türkiýäniň KVKK ýa-da Kaliforniýanyň CCPA kanunçylygyna laýyklykda) şahsy maglumatlaryňyz bilen tanyşmaga, olary düzetmäge ýa-da pozmaga, şeýle hem olaryň işlenmegine garşy çykmaga hukugyňyz bolup biler. Biz siziň şahsyýetiňizi kesgitleýän maglumatlary saklamaýandygymyz sebäpli, haýyşlaryň köpüsini ýokardaky mümkinçilikler arkaly kanagatlandyryp bolar; şeýle hem aşakdaky salgy boýunça biziň bilen habarlaşyp bilersiňiz."]},{"h":"9. Bu syýasatdaky üýtgeşmeler","p":["Programma üýtgände bu syýasaty täzeläp bileris. Ýokardaky sene iň soňky wersiýany görkezýär."]},{"h":"10. Habarlaşmak we goldaw","p":["Bu syýasat barada soraglar, programma boýunça kömek ýa-da satyn alyş bilen bagly meseleler üçin bize miswakapp@gmail.com salgysyna ýazyň."]}],"langLabel":"Dil","supportTitle":"Goldaw","supportText":"Qibora ýa-da satyn alyş boýunça kömek gerekmi? Bize miswakapp@gmail.com salgysyna hat ýazyň — adatça birnäçe günüň dowamynda jogap berýäris."},"tg":{"langName":"Тоҷикӣ","title":"Qibora – Сиёсати махфият","updated":"Навсозии охирин: 24 октябри 2026","intro":"Qibora («барнома») ба шумо дар ёфтани самти қибла ва масҷидҳои наздик кӯмак мекунад. Ин сиёсат шарҳ медиҳад, ки барнома кадом маълумотро истифода мебарад, ин маълумот ба куҷо фиристода мешавад ва шумо кадом имкониятҳои интихобро доред. Ба таври мухтасар: қибла дар телефони шумо ҳисоб карда мешавад, мо серверҳое, ки макони шуморо нигоҳ медоранд, надорем ва маълумоти шахсии шуморо намефурӯшем.","sections":[{"h":"1. Макони шумо","p":["Барнома иҷозати дастрасӣ ба макони шуморо танҳо ҳангоми истифодаи он дархост мекунад. Макони шумо дар телефонатон барои ҳисоб кардани самти қибла ва масофа то Каъба истифода мешавад. Он ба серверҳои мо фиристода намешавад ва мо онро нигоҳ намедорем.","Вақте ки шумо барои дидани масҷидҳои наздик экрани харитаро мекушоед, барнома макони тахминии шуморо, ки то тақрибан 1 км мудаввар карда шудааст, ба хидмати ройгони OpenStreetMap Overpass (overpass-api.de ё ҳамчун захиравӣ overpass.kumi.systems) мефиристад, то масҷидҳои атрофи шуморо ҷустуҷӯ кунад. Ба ин дархост ягон ном, ҳисоб ё муайянкунандаи дастгоҳ замима карда намешавад. Маълумот дар бораи масҷидҳо © саҳмгузорони OpenStreetMap, тибқи иҷозатномаи ODbL дастрас аст.","Худи харита тавассути хидмати ха
