ритаи телефони шумо (Apple Maps дар iPhone, Google Maps дар Android) нишон дода мешавад, ки ба сиёсати махфияти худи Apple ё Google тобеъ аст."]},{"h":"2. Камера","p":["Камера танҳо дар экрани AR барои нишон додани самти қибла дар болои тасвири зиндаи камера истифода мешавад. Тасвирҳо дар телефони шумо дар вақти воқеӣ коркард мешаванд; ҳеҷ чиз сабт, захира ё ба шабака бор карда намешавад."]},{"h":"3. Маълумоте, ки дар телефони шумо нигоҳ дошта мешавад","p":["Танзимоти шумо (тарҳи интихобшуда, мавзӯи ороиш, андозаи матн, экрани охирин истифодашуда ва дигар афзалиятҳои монанд) танҳо дар телефони шумо нигоҳ дошта мешаванд. Бо нест кардани барнома онҳо низ нест мешаванд."]},{"h":"4. Омори анонимии истифода","p":["Барои фаҳмидани он ки кадом имкониятҳо истифода мешаванд ва барои ислоҳи мушкилот, барнома рӯйдодҳои анонимии истифодаро (масалан: кадом экран кушода шуд, оё қибла ёфт шуд, версияи барнома ва навъи дастгоҳ) ба PostHog мефиристад, ки дар серверҳои Иттиҳоди Аврупо ҷойгир аст. Ин рӯйдодҳо ном, макон ё тасвирҳои камераи шуморо дар бар намегиранд. Мисли ҳар пайвасти интернетӣ, суроғаи IP-и шумо метавонад аз ҷониби ин хидмат коркард шавад, масалан барои муайян кардани тахминии кишвар.","Шумо метавонед инро дар ҳар вақт дар Танзимот → «Омори истифода» хомӯш кунед."]},{"h":"5. Реклама","p":["Версияи ройгони Qibora рекламаҳоеро нишон медиҳад, ки аз ҷониби Google AdMob пешниҳод мешаванд. Google метавонад муайянкунандаи рекламавии дастгоҳи шумо ва маълумоти монандро барои нишон додан ва андозагирии рекламаҳо ва бо иҷозати шумо барои фардӣ кардани онҳо истифода барад.","Дар iPhone рекламаи фардӣ танҳо дар сурате истифода мешавад, ки шумо ҳангоми дархости барнома ба пайгирӣ иҷозат диҳед. Дар Минтақаи иқтисодии Аврупо, Британияи Кабир ва Швейтсария равзанаи розигӣ ба шумо имкон медиҳад интихоб кунед, ки маълумоти шумо барои реклама чӣ гуна истифода шавад. Шумо инчунин метавонед муайянкунандаи рекламавии худро дар танзимоти телефон аз нав танзим ё маҳдуд кунед.","Рекламаҳо тавре филтр карда мешаванд, ки барои аудиторияи умумӣ мувофиқ бошанд. Маълумоти бештар: https://policies.google.com/technologies/ads","Qibora Pro ҳамаи рекламаҳоро бартараф мекунад."]},{"h":"6. Харидҳо","p":["Qibora Pro тавассути App Store ё Google Play фурӯхта мешавад. Пардохтҳо пурра аз ҷониби Apple ё Google анҷом дода мешаванд; мо ҳеҷ гоҳ маълумоти корт ё пардохти шуморо намебинем.","Барои тасдиқи харидҳое, ки ба шумо тааллуқ доранд, ва барқарор кардани онҳо, барнома аз RevenueCat истифода мебарад, ки муайянкунандаи анонимии корбари барнома ва квитансияҳои хариди шуморо аз мағоза мегирад. Он ном ё маълумоти пардохти шуморо намегирад."]},{"h":"7. Кӯдакон","p":["Qibora барномаест барои аудиторияи умумӣ ва ба кӯдакони аз 13-сола хурдтар равона нашудааст. Мо дидаю дониста аз кӯдакон маълумоти шахсӣ ҷамъ намекунем."]},{"h":"8. Интихоб ва ҳуқуқҳои шумо","p":["Шумо метавонед дар танзимоти телефони худ иҷозати дастрасӣ ба макон ва камераро рад кунед ё бозпас гиред (бе макон барнома қибларо ёфта наметавонад), омори истифодаро дар барнома хомӯш кунед, розигии худро ба реклама ё интихоби худро дар бораи пайгирӣ тағйир диҳед ва бо нест кардани барнома ҳамаи маълумоти дар дастгоҳ нигоҳдошташударо нест кунед.","Вобаста ба ҷои зисти шумо (масалан, тибқи GDPR, UK GDPR, KVKK-и Туркия ё CCPA-и Калифорния), шумо метавонед ҳуқуқи дастрасӣ, ислоҳ ё нест кардани маълумоти шахсӣ ва эътироз ба коркарди онро дошта бошед. Азбаски мо маълумоте, ки шахсияти шуморо муайян кунад, нигоҳ намедорем, аксари дархостҳоро тавассути имкониятҳои дар боло зикршуда иҷро кардан мумкин аст; инчунин шумо метавонед тавассути суроғаи зерин бо мо тамос гиред."]},{"h":"9. Тағйирот дар ин сиёсат","p":["Мо метавонем ҳангоми тағйир ёфтани барнома ин сиёсатро навсозӣ кунем. Санаи болои саҳифа версияи охиринро нишон медиҳад."]},{"h":"10. Тамос ва дастгирӣ","p":["Барои саволҳо дар бораи ин сиёсат, кӯмак дар истифодаи барнома ё мушкилот бо харид ба мо ба суроғаи miswakapp@gmail.com нависед."]}],"langLabel":"Забон","supportTitle":"Дастгирӣ","supportText":"Бо Qibora ё харид ба кӯмак ниёз доред? Ба мо ба суроғаи miswakapp@gmail.com нависед — мо одатан дар давоми чанд рӯз ҷавоб медиҳем."},"ha":{"langName":"Hausa","title":"Qibora – Manufar Tsare Sirri","updated":"An sabunta a ƙarshe: 24 ga Oktoba, 2026","intro":"Qibora (“manhajar”) tana taimaka muku gano inda Alƙibla take da kuma masallatan da ke kusa da ku. Wannan manufa tana bayyana irin bayanan da manhajar ke amfani da su, inda suke zuwa da kuma zaɓuɓɓukan da kuke da su. A taƙaice: ana lissafin Alƙibla a kan wayarku, ba mu da wasu sabobi (servers) da ke adana wurin da kuke, kuma ba ma sayar da bayananku na sirri.","sections":[{"h":"1. Wurin da kuke","p":["Manhajar tana neman wurin da kuke ne kawai a lokacin da kuke amfani da ita. Ana amfani da wurin da kuke a kan wayarku don lissafin hanyar Alƙibla da kuma nisan da ke tsakaninku da Ka'aba. Ba a aika shi zuwa sabobinmu, kuma ba ma adana shi.","Idan kuka buɗe shafin Taswira don ganin masallatan da ke kusa, manhajar tana aika wurin da kuke na kusan-kusa, wanda aka zagaye (rounded) zuwa kimanin kilomita 1, zuwa sabis ɗin OpenStreetMap Overpass na kyauta (overpass-api.de, ko overpass.kumi.systems a matsayin madadi) don neman masallatan da ke kewaye da ku. Ba a haɗa suna, asusu ko lambar tantance na'ura da wannan buƙatar ba. Bayanan masallatai © masu ba da gudummawa ga OpenStreetMap, ana samun su ƙarƙashin lasisin ODbL.","Sabis ɗin taswira na wayarku ne ke nuna taswirar kanta (Apple Maps a kan iPhone, Google Maps a kan Android), kuma wannan sabis ɗin yana ƙarƙashin manufar tsare sirri ta Apple ko ta Google."]},{"h":"2. Kyamara","p":["Ana amfani da kyamara ne kawai a shafin AR, don nuna hanyar Alƙibla a kan hoton kyamara kai tsaye. Ana sarrafa hotuna a kan wayarku nan take; ba a naɗa, ajiye ko loda (upload) komai ba."]},{"h":"3. Bayanan da ake adanawa a kan wayarku","p":["Ana adana saitunanku (zanen da kuka zaɓa, jigo, girman rubutu, shafin da kuka yi amfani da shi na ƙarshe da makamantan zaɓuɓɓuka) a kan wayarku kawai. Idan kuka goge manhajar, za a goge su ma."]},{"h":"4. Ƙididdigar amfani ba tare da suna ba","p":["Don fahimtar waɗanne fasaloli ake amfani da su da kuma gyara matsaloli, manhajar tana aika bayanan abubuwan da ke faruwa yayin amfani, ba tare da suna ba (misali: wane shafi aka buɗe, ko an gano Alƙibla, sigar manhajar da nau'in na'urar), zuwa PostHog, wanda ke kan sabobi a Tarayyar Turai. Waɗannan bayanai ba su ƙunshi sunanku, wurin da kuke ko hotunan kyamara ba. Kamar yadda yake a kowace haɗin intanet, sabis ɗin na iya sarrafa adireshin IP ɗinku, misali don kimanta ƙasar da kuke.","Kuna iya kashe wannan a kowane lokaci a Saituna → “Ƙididdigar amfani”."]},{"h":"5. Tallace-tallace","p":["Sigar Qibora ta kyauta tana nuna tallace-tallacen da Google AdMob ke samarwa. Google na iya amfani da lambar tantance talla ta na'urarku da makamantan bayanai don nunawa da auna tallace-tallace, kuma, da izininku, don keɓance su gare ku.","A kan iPhone, ana amfani da tallace-tallacen da aka keɓance ne kawai idan kun ba da izinin bin diddigi (tracking) lokacin da manhajar ta tambaya. A Yankin Tattalin Arzikin Turai, Birtaniya da Switzerland, taga na neman izini yana ba ku damar zaɓar yadda za a yi amfani da bayananku don tallace-tallace. Haka kuma kuna iya sake saitawa (reset) ko taƙaita lambar tantance talla a cikin saitunan wayarku.","Ana tace tallace-tallace domin su dace da jama'a gaba ɗaya. Ƙarin bayani: https://policies.google.com/technologies/ads","Qibora Pro tana cire duk tallace-tallace."]},{"h":"6. Sayayya","p":["Ana sayar da Qibora Pro ta App Store ko Google Play. Apple ko Google ne ke kula da biyan kuɗi gaba ɗaya; ba ma taɓa ganin bayanan katinku ko na biyan kuɗinku.","Don tabbatar da sayayyar da kuka mallaka da kuma dawo da su, manhajar tana amfani da RevenueCat, wanda ke karɓar lambar tantance mai amfani da manhaja ba tare da suna ba da kuma rasidin sayayyarku na shago. Ba ya karɓar sunanku ko bayanan biyan kuɗinku."]},{"h":"7. Yara","p":["Qibora manhaja ce ta jama'a gaba ɗaya, kuma ba a yi ta domin yara 'yan ƙasa da shekara 13 ba. Ba ma tattara bayanan sirri daga yara da gangan."]},{"h":"8. Zaɓuɓɓukanku da haƙƙoƙinku","p":["Kuna iya ƙin ba da izinin wuri da na kyamara ko janye shi a cikin saitunan wayarku (manhajar ba za ta iya gano Alƙibla ba idan babu wuri), kashe ƙididdigar amfani a cikin manhajar, canza izininku na talla ko zaɓinku na bin diddigi, kuma ku goge duk bayanan da aka adana a wayarku ta hanyar goge manhajar.","Ya danganta da inda kuke zaune (misali a ƙarƙashin GDPR, UK GDPR, KVKK na Turkiyya ko CCPA na California), kuna iya samun haƙƙin ganin bayananku na sirri, gyara su ko goge su, da kuma ƙin amincewa da sarrafa su. Saboda ba mu riƙe bayanan da za su iya bayyana ko wane ne ku, ana iya biyan yawancin buƙatu ta hanyar zaɓuɓɓukan da ke sama; haka kuma kuna iya tuntuɓar mu ta adireshin da ke ƙasa."]},{"h":"9. Canje-canje ga wannan manufa","p":["Muna iya sabunta wannan manufa idan manhajar ta canza. Kwanan watan da ke sama yana nuna sabuwar siga."]},{"h":"10. Tuntuɓa da tallafi","p":["Don tambayoyi game da wannan manufa, taimako game da manhajar, ko matsaloli game da sayayya, ku rubuto mana a miswakapp@gmail.com."]}],"langLabel":"Harshe","supportTitle":"Tallafi","supportText":"Kuna buƙatar taimako game da Qibora ko wata sayayya? Ku aiko mana da imel a miswakapp@gmail.com — yawanci muna amsawa cikin 'yan kwanaki."},"sw":{"langName":"Kiswahili","title":"Qibora – Sera ya Faragha","updated":"Ilisasishwa mwisho: 24 Oktoba 2026","intro":"Qibora (“programu”) inakusaidia kupata mwelekeo wa kibla na misikiti iliyo karibu nawe. Sera hii inaeleza ni taarifa gani programu inatumia, zinakwenda wapi na chaguo ulizo nazo. Kwa ufupi: kibla hukokotolewa kwenye simu yako, hatuendeshi seva zinazohifadhi eneo lako, na hatuuzi data zako binafsi.","sections":[{"h":"1. Eneo lako","p":["Programu huomba ruhusa ya kujua eneo lako tu wakati unaitumia. Eneo lako hutumika kwenye simu yako kukokotoa mwelekeo wa kibla na umbali hadi Kaaba. Halitumwi kwenye seva zetu na hatulihifadhi.","Unapofungua skrini ya Ramani ili kuona misikiti iliyo karibu, programu hutuma eneo la takriban, lililokadiriwa hadi takriban kilomita 1, kwa huduma ya bure ya OpenStreetMap Overpass (overpass-api.de, au overpass.kumi.systems kama huduma mbadala) ili kutafuta misikiti iliyo karibu nawe. Hakuna jina, akaunti wala kitambulisho cha kifaa kinachoambatishwa na ombi hili. Data ya misikiti © wachangiaji wa OpenStreetMap, inapatikana chini ya leseni ya ODbL.","Ramani yenyewe huonyeshwa na huduma ya ramani ya simu yako (Apple Maps kwenye iPhone, Google Maps kwenye Android), ambayo inaongozwa na sera ya faragha ya Apple au ya Google yenyewe."]},{"h":"2. Kamera","p":["Kamera hutumika tu kwenye skrini ya AR, ili kuonyesha mwelekeo wa kibla juu ya picha ya moja kwa moja ya kamera. Picha huchakatwa kwenye simu yako papo hapo; hakuna kinachorekodiwa, kuhifadhiwa wala kupakiwa mtandaoni."]},{"h":"3. Taarifa zinazohifadhiwa kwenye simu yako","p":["Mipangilio yako (muundo uliouchagua, mandhari, ukubwa wa maandishi, skrini uliyotumia mwisho na mapendeleo mengine kama hayo) huhifadhiwa kwenye simu yako pekee. Ukifuta programu, mipangilio hiyo nayo hufutwa."]},{"h":"4. Takwimu za matumizi zisizo na utambulisho","p":["Ili kuelewa ni vipengele gani vinatumika na kurekebisha matatizo, programu hutuma matukio ya matumizi yasiyo na utambulisho (kwa mfano: skrini gani ilifunguliwa, kama kibla ilipatikana, toleo la programu na aina ya kifaa) kwa PostHog, inayohudumiwa kwenye seva zilizoko Umoja wa Ulaya. Matukio haya hayajumuishi jina lako, eneo lako wala picha za kamera. Kama ilivyo kwa muunganisho wowote wa intaneti, anwani yako ya IP inaweza kuchakatwa na huduma hiyo, kwa mfano ili kukadiria nchi uliyopo.","Unaweza kuzima kipengele hiki wakati wowote katika Mipangilio → “Takwimu za matumizi”."]},{"h":"5. Matangazo","p":["Toleo la bure la Qibora huonyesha matangazo yanayotolewa na Google AdMob. Google inaweza kutumia kitambulisho cha matangazo cha kifaa chako na taarifa nyingine zinazofanana ili kuonyesha na kupima matangazo, na, kwa ruhusa yako, ili kuyalenga kwako binafsi.","Kwenye iPhone, matangazo yanayolengwa kwako binafsi hutumika tu ikiwa utaruhusu ufuatiliaji programu inapokuuliza. Katika Eneo la Kiuchumi la Ulaya, Uingereza na Uswisi, dirisha la idhini hukuwezesha kuchagua jinsi data yako inavyotumika kwa matangazo. Unaweza pia kuweka upya au kuwekea mipaka kitambulisho chako cha matangazo katika mipangilio ya simu yako.","Matangazo huchujwa ili yafae hadhira ya jumla. Maelezo zaidi: https://policies.google.com/technologies/ads","Qibora Pro huondoa matangazo yote."]},{"h":"6. Ununuzi","p":["Qibora Pro huuzwa kupitia App Store au Google Play. Malipo hushughulikiwa kikamilifu na Apple au Google; hatuoni kamwe maelezo ya kadi yako wala ya malipo.","Ili kuthibitisha ni manunuzi gani unayomiliki na kuyarejesha, programu hutumia RevenueCat, ambayo hupokea kitambulisho cha mtumiaji wa programu kisicho na utambulisho na stakabadhi za manunuzi yako kutoka dukani. Haipokei jina lako wala maelezo ya malipo."]},{"h":"7. Watoto","p":["Qibora ni programu ya hadhira ya jumla na haikusudiwi watoto walio chini ya umri wa miaka 13. Hatukusanyi kwa kujua taarifa binafsi kutoka kwa watoto."]},{"h":"8. Chaguo na haki zako","p":["Unaweza kukataa au kuondoa ruhusa ya eneo na ya kamera katika mipangilio ya simu yako (programu haitaweza kupata kibla bila eneo), kuzima takwimu za matumizi ndani ya programu, kubadilisha idhini yako ya matangazo au chaguo lako la ufuatiliaji, na kufuta data zote zilizohifadhiwa kwenye simu kwa kufuta programu.","Kulingana na mahali unapoishi (kwa mfano chini ya GDPR, UK GDPR, KVKK ya Uturuki au CCPA ya California), unaweza kuwa na haki ya kufikia, kusahihisha au kufuta data binafsi na kupinga uchakataji wake. Kwa kuwa hatuhifadhi data inayokutambulisha, maombi mengi yanaweza kutimizwa kwa kutumia chaguo zilizotajwa hapo juu; unaweza pia kuwasiliana nasi kupitia anwani iliyo hapa chini."]},{"h":"9. Mabadiliko ya sera hii","p":["Tunaweza kusasisha sera hii programu inapobadilika. Tarehe iliyo juu inaonyesha toleo la hivi karibuni."]},{"h":"10. Mawasiliano na msaada","p":["Kwa maswali kuhusu sera hii, msaada kuhusu programu, au matatizo ya ununuzi, tuandikie kupitia miswakapp@gmail.com."]}],"langLabel":"Lugha","supportTitle":"Msaada","supportText":"Unahitaji msaada kuhusu Qibora au ununuzi? Tutumie barua pepe kupitia miswakapp@gmail.com — kwa kawaida tunajibu ndani ya siku chache."},"so":{"langName":"Soomaali","title":"Qibora – Siyaasadda Asturnaanta","updated":"Markii ugu dambeysay la cusbooneysiiyay: 24 Oktoobar 2026","intro":"Qibora (“barnaamijka”) waxay kaa caawisaa inaad hesho jihada qiblada iyo masaajidda kuu dhow. Siyaasaddan waxay sharraxaysaa macluumaadka uu barnaamijku isticmaalo, halka ay u gudbaan iyo doorashooyinka aad haysato. Si kooban: qiblada waxaa lagu xisaabiyaa taleefankaaga, ma maamulno server-yo kaydiya goobtaada, mana iibinno xogtaada shakhsiga ah.","sections":[{"h":"1. Goobtaada","p":["Barnaamijku wuxuu codsadaa goobtaada oo keliya inta aad isticmaalayso. Goobtaada waxaa lagu isticmaalaa taleefankaaga si loo xisaabiyo jihada qiblada iyo masaafada u jirta Kacbada. Looma diro server-yadayada, mana kaydinno.","Markaad furto shaashadda Khariidadda si aad u aragto masaajidda kuu dhow, barnaamijku wuxuu goob qiyaas ah, oo lagu soo koobay qiyaastii 1 km, u diraa adeegga bilaashka ah ee OpenStreetMap Overpass (overpass-api.de, ama overpass.kumi.systems oo ah beddel kayd ah) si loo raadiyo masaajidda agagaarkaaga ah. Codsigan laguma lifaaqo magac, akoon ama aqoonsi qalab. Xogta masaajidda © ka-qaybgalayaasha OpenStreetMap, waxaana lagu heli karaa shatiga ODbL.","Khariidadda lafteeda waxaa soo bandhiga adeegga khariidadaha ee taleefankaaga (Apple Maps ee iPhone, Google Maps ee Android), kaas oo ku hoos jira siyaasadda asturnaanta ee Apple ama Google."]},{"h":"2. Kamarada","p":["Kamarada waxaa loo isticmaalaa oo keliya shaashadda AR, si jihada qiblada loogu muujiyo dusha muuqaalka tooska ah ee kamarada. Sawirrada waxaa lagu habeeyaa taleefankaaga isla markiiba; waxba lama duubo, lama kaydiyo, lamana soo geliyo internetka."]},{"h":"3. Macluumaadka lagu kaydiyo taleefankaaga","p":["Dejimahaaga (naqshadda aad dooratay, mawduuca, cabbirka qoraalka, shaashaddii ugu dambeysay ee aad isticmaashay iyo doorbidyo la mid ah) waxaa lagu kaydiyaa oo keliya taleefankaaga. Haddii aad tirtirto barnaamijka, iyagana waa la tirtiraa."]},{"h":"4. Tirakoobka isticmaalka ee qarsoodiga ah","p":["Si loo fahmo astaamaha la isticmaalo loona hagaajiyo dhibaatooyinka, barnaamijku wuxuu dhacdooyinka isticmaalka ee aan qofka la aqoonsan karin (tusaale ahaan: shaashadda la furay, in qiblada la helay iyo in kale, nuqulka barnaamijka iyo nooca qalabka) u diraa PostHog, oo ku martigelisan server-yo ku yaal Midowga Yurub. Dhacdooyinkan kuma jiraan magacaaga, goobtaada ama sawirrada kamarada. Sida xiriir kasta oo internet ah, adeeggu waxaa laga yaabaa inuu habeeyo cinwaankaaga IP-ga, tusaale ahaan si loo qiyaaso dalka aad joogto.","Waxaad tan dami kartaa wakhti kasta adigoo galaya Dejinta → “Tirakoobka isticmaalka”."]},{"h":"5. Xayeysiisyada","p":["Nuqulka bilaashka ah ee Qibora wuxuu muujiyaa xayeysiisyo uu bixiyo Google AdMob. Google waxaa laga yaabaa inuu isticmaalo aqoonsiga xayeysiiska ee qalabkaaga iyo macluumaad la mid ah si uu u muujiyo una cabbiro xayeysiisyada, iyo, haddii aad oggolaato, si uu adiga gaar ahaan kuugu habeeyo.","iPhone-ka, xayeysiisyada laguu gaar yeelay waxaa la isticmaalaa oo keliya haddii aad oggolaato la-socodka marka barnaamijku ku weydiiyo. Aagga Dhaqaalaha Yurub, Boqortooyada Ingiriiska iyo Iswiiserland, daaqad oggolaansho ah ayaa kuu suurtagelinaysa inaad doorato sida xogtaada loogu isticmaalo xayeysiisyada. Sidoo kale waxaad dib u dejin kartaa ama xaddidi kartaa aqoonsigaaga xayeysiiska adigoo galaya dejinta taleefankaaga.","Xayeysiisyada waxaa loo shaandheeyaa si ay ugu habboonaadaan dadweynaha guud. Macluumaad dheeraad ah: https://policies.google.com/technologies/ads","Qibora Pro waxay meesha ka saartaa dhammaan xayeysiisyada."]},{"h":"6. Iibsashada","p":["Qibora Pro waxaa lagu iibiyaa App Store ama Google Play. Lacag-bixinta waxaa gebi ahaanba maamula Apple ama Google; marnaba ma aragno faahfaahinta kaarkaaga ama lacag-bixintaada.","Si loo xaqiijiyo iibsashooyinka aad leedahay loona soo celiyo, barnaamijku wuxuu isticmaalaa RevenueCat, kaas oo hela aqoonsi isticmaale oo qarsoodi ah iyo rasiidhada iibsashooyinkaaga ee dukaanka. Ma helo magacaaga ama faahfaahinta lacag-bixinta."]},{"h":"7. Carruurta","p":["Qibora waa barnaamij loogu talagalay dadweynaha guud, looguma talagalin carruurta ka yar 13 sano. Si ogaal ah ugama ururinno carruurta macluumaad shakhsi ah."]},{"h":"8. Doorashooyinkaaga iyo xuquuqdaada","p":["Waxaad diidi kartaa ama dib ula noqon kartaa oggolaanshaha goobta iyo kamarada adigoo galaya dejinta taleefankaaga (barnaamijku ma awoodo inuu helo qiblada goob la'aan), waxaad dami kartaa tirakoobka isticmaalka ee barnaamijka gudihiisa, waxaad beddeli kartaa oggolaanshahaaga xayeysiiska ama doorashadaada la-socodka, waxaadna tirtiri kartaa dhammaan xogta lagu kaydiyay taleefanka adigoo tirtiraya barnaamijka.","Iyadoo ku xiran halka aad ku nooshahay (tusaale ahaan sida ay dhigayaan GDPR, UK GDPR, KVKK ee Turkiga ama CCPA ee California), waxaa laga yaabaa inaad xaq u leedahay inaad hesho, saxdo ama tirtirto xogta shakhsiga ah iyo inaad diiddo habeynteeda. Maadaama aynaan haynin xog ku aqoonsanaysa, codsiyada intooda badan waxaa lagu fulin karaa doorashooyinka kor ku xusan; sidoo kale waxaad nagala soo xiriiri kartaa cinwaanka hoos ku qoran."]},{"h":"9. Isbeddellada siyaasaddan","p":["Waxaa laga yaabaa inaan cusbooneysiino siyaasaddan marka barnaamijku isbeddelo. Taariikhda kor ku qoran waxay muujinaysaa nuqulkii ugu dambeeyay."]},{"h":"10. Xiriirka iyo taageerada","p":["Su'aalaha ku saabsan siyaasaddan, caawimaad ku saabsan barnaamijka, ama dhibaatooyinka iibsashada, noogu soo qor miswakapp@gmail.com."]}],"langLabel":"Luqadda","supportTitle":"Taageero","supportText":"Ma u baahan tahay caawimaad ku saabsan Qibora ama iibsasho? Iimayl noogu soo dir miswakapp@gmail.com — inta badan waxaan ku jawaabnaa dhowr maalmood gudahood."},"am":{"langName":"አማርኛ","title":"Qibora – የግላዊነት ፖሊሲ","updated":"ለመጨረሻ ጊዜ የተሻሻለው፦ ኦክቶበር 24 ቀን 2026 እ.ኤ.አ.","intro":"Qibora («መተግበሪያው») የቂብላን አቅጣጫ እና በአቅራቢያዎ ያሉ መስጊዶችን ለማግኘት ይረዳዎታል። ይህ ፖሊሲ መተግበሪያው ምን ዓይነት መረጃ እንደሚጠቀም፣ መረጃው ወዴት እንደሚሄድ እና ያሉዎትን ምርጫዎች ያብራራል። በአጭሩ፦ ቂብላው የሚሰላው በስልክዎ ላይ ነው፤ አካባቢዎን የሚያከማቹ አገልጋዮችን (servers) አናስተዳድርም፤ የግል መረጃዎንም አንሸጥም።","sections":[{"h":"1. አካባቢዎ","p":["መተግበሪያው አካባቢዎን የሚጠይቀው እርስዎ በሚጠቀሙበት ጊዜ ብቻ ነው። አካባቢዎ የቂብላን አቅጣጫ እና ወደ ካዕባ ያለውን ርቀት ለማስላት በስልክዎ ላይ ጥቅም ላይ ይውላል። ወደ አገልጋዮቻችን አይላክም፤ እኛም አናከማቸውም።","በአቅራቢያዎ ያሉ መስጊዶችን ለማየት የካርታ ገጹን ሲከፍቱ፣ መተግበሪያው በዙሪያዎ ያሉ መስጊዶችን ለመፈለግ ወደ 1 ኪ.ሜ. ገደማ የተጠጋጋ ግምታዊ አካባቢን ለነፃው OpenStreetMap Overpass አገልግሎት (overpass-api.de፣ ወይም በተጠባባቂነት overpass.kumi.systems) ይልካል። ከዚህ ጥያቄ ጋር ስም፣ መለያ (account) ወይም የመሣሪያ ለይቶ ማወቂያ አይያያዝም። የመስጊዶች መረጃ © የOpenStreetMap አስተዋጽኦ አበርካቾች፣ በODbL ፈቃድ ስር የሚገኝ።","ካርታው ራሱ የሚታየው በስልክዎ የካርታ አገልግሎት ነው (በiPhone ላይ Apple Maps፣ በAndroid ላይ Google Maps)፤ ይህ አገልግሎት በApple ወይም በGoogle የራሳቸው የግላዊነት ፖሊሲ የሚተዳደር ነው።"]},{"h":"2. ካሜራ","p":["ካሜራው ጥቅም ላይ የሚውለው በAR ገጹ ላይ ብቻ ሲሆን፣ ይኸውም የቂብላን አቅጣጫ በቀጥታ የካሜራ ምስል ላይ ለማሳየት ነው። ምስሎቹ በስልክዎ ላይ በቅጽበት ይስተናገዳሉ፤ ምንም ነገር አይቀረጽም፣ አይቀመጥም ወይም አይሰቀልም (upload)።"]},{"h":"3. በስልክዎ ላይ የሚቀመጥ መረጃ","p":["ቅንብሮችዎ (የመረጡት ንድፍ፣ ገጽታ (theme)፣ የጽሑፍ መጠን፣ ለመጨረሻ ጊዜ የተጠቀሙበት ገጽ እና ተመሳሳይ ምርጫዎች) የሚቀመጡት በስልክዎ ላይ ብቻ ነው። መተግበሪያውን ሲሰርዙ እነሱም ይሰረዛሉ።"]},{"h":"4. ማንነትን የማይገልጽ የአጠቃቀም ስታቲስቲክስ","p":["የትኞቹ ባህሪያት ጥቅም ላይ እንደሚውሉ ለመረዳት እና ችግሮችን ለማስተካከል፣ መተግበሪያው ማንነትን የማይገልጹ የአጠቃቀም ክስተቶችን (ለምሳሌ፦ የትኛው ገጽ እንደተከፈተ፣ ቂብላው መገኘቱን ወይም አለመገኘቱን፣ የመተግበሪያውን ስሪት እና የመሣሪያውን ዓይነት) በአውሮፓ ኅብረት ውስጥ ባሉ አገልጋዮች ላይ ለሚስተናገደው PostHog ይልካል። እነዚህ ክስተቶች ስምዎን፣ አካባቢዎን ወይም የካሜራ ምስሎችን አያካትቱም። እንደማንኛውም የኢንተርኔት ግንኙነት፣ አገልግሎቱ የIP አድራሻዎን ሊያስተናግድ ይችላል፤ ለምሳሌ ያሉበትን አገር ለመገመት።","ይህንን በማንኛውም ጊዜ ቅንብሮች → «የአጠቃቀም ስታቲስቲክስ» በሚለው ቦታ ማጥፋት ይችላሉ።"]},{"h":"5. ማስታወቂያ","p":["የQibora ነፃ ስሪት በGoogle AdMob የሚቀርቡ ማስታወቂያዎችን ያሳያል። Google ማስታወቂያዎችን ለማሳየት እና ለመለካት፣ እንዲሁም በእርስዎ ፈቃድ ለእርስዎ ለማበጀት፣ የመሣሪያዎን የማስታወቂያ ለይቶ ማወቂያ እና ተመሳሳይ መረጃዎችን ሊጠቀም ይችላል።","በiPhone ላይ፣ ለእርስዎ የተበጁ ማስታወቂያዎች ጥቅም ላይ የሚውሉት መተግበሪያው ሲጠይቅ ክትትልን (tracking) ከፈቀዱ ብቻ ነው። በአውሮፓ ኢኮኖሚያዊ ክልል፣ በዩናይትድ ኪንግደም እና በስዊዘርላንድ፣ የፈቃድ መስኮት መረጃዎ ለማስታወቂያ እንዴት ጥቅም ላይ እንደሚውል እንዲመርጡ ያስችልዎታል። እንዲሁም በስልክዎ ቅንብሮች ውስጥ የማስታወቂያ ለይቶ ማወቂያዎን ዳግም ማስጀመር (reset) ወይም መገደብ ይችላሉ።","ማስታወቂያዎች ለአጠቃላይ ታዳሚ ተስማሚ እንዲሆኑ ተጣርተው ይቀርባሉ። ተጨማሪ መረጃ፦ https://policies.google.com/technologies/ads","Qibora Pro ሁሉንም ማስታወቂያዎች ያስወግዳል።"]},{"h":"6. ግዢዎች","p":["Qibora Pro የሚሸጠው በApp Store ወይም በGoogle Play በኩል ነው። ክፍያዎች ሙሉ በሙሉ የሚስተናገዱት በApple ወይም በGoogle ነው፤ እኛ የካርድዎን ወይም የክፍያ ዝርዝሮችዎን በጭራሽ አናይም።","የእርስዎ የሆኑትን ግዢዎች ለማረጋገጥ እና መልሶ ለማግኘት፣ መተግበሪያው RevenueCatን ይጠቀማል፤ ይህ አገልግሎት ማንነትን የማይገልጽ የመተግበሪያ ተጠቃሚ መታወቂያ (ID) እና የመደብር ግዢ ደረሰኞችዎን ይቀበላል። ስምዎን ወይም የክፍያ ዝርዝሮችዎን አይቀበልም።"]},{"h":"7. ልጆች","p":["Qibora ለአጠቃላይ ታዳሚ የተዘጋጀ መተግበሪያ ሲሆን ዕድሜያቸው ከ13 ዓመት በታች ለሆኑ ልጆች የታለመ አይደለም። ከልጆች የግል መረጃን አውቀን አንሰበስብም።"]},{"h":"8. ምርጫዎችዎ እና መብቶችዎ","p":["በስልክዎ ቅንብሮች ውስጥ የአካባቢ እና የካሜራ ፈቃድን መከልከል ወይም መሻር (ያለ አካባቢ መተግበሪያው ቂብላን ማግኘት አይችልም)፣ በመተግበሪያው ውስጥ የአጠቃቀም ስታቲስቲክስን ማጥፋት፣ የማስታወቂያ ፈቃድዎን ወይም የክትትል ምርጫዎን መቀየር፣ እንዲሁም መተግበሪያውን በመሰረዝ በስልክዎ ላይ የተቀመጠውን መረጃ በሙሉ መሰረዝ ይችላሉ።","እንደሚኖሩበት ቦታ (ለምሳሌ በGDPR፣ በUK GDPR፣ በቱርክ KVKK ወይም በካሊፎርኒያ CCPA መሠረት)፣ የግል መረጃን የማግኘት፣ የማስተካከል ወይም የማሰረዝ እንዲሁም አያያዙን የመቃወም መብት ሊኖርዎት ይችላል። እርስዎን የሚለይ መረጃ ስለማንይዝ፣ አብዛኞቹ ጥያቄዎች ከላይ በተጠቀሱት አማራጮች ሊፈጸሙ ይችላሉ፤ እንዲሁም ከታች ባለው አድራሻ ሊያገኙን ይችላሉ።"]},{"h":"9. በዚህ ፖሊሲ ላይ የሚደረጉ ለውጦች","p":["መተግበሪያው ሲለወጥ ይህንን ፖሊሲ ልናሻሽለው እንችላለን። ከላይ ያለው ቀን የቅርብ ጊዜውን ስሪት ያሳያል።"]},{"h":"10. ግንኙነት እና ድጋፍ","p":["ስለዚህ ፖሊሲ ጥያቄዎች፣ ስለ መተግበሪያው እገዛ ወይም ከግዢ ጋር የተያያዙ ችግሮች ካሉዎት፣ ወደ miswakapp@gmail.com ይጻፉልን።"]}],"langLabel":"ቋንቋ","supportTitle":"ድጋፍ","supportText":"በQibora ወይም በግዢ ላይ እገዛ ይፈልጋሉ? ወደ miswakapp@gmail.com ኢሜይል ይላኩልን — አብዛኛውን ጊዜ በጥቂት ቀናት ውስጥ ምላሽ እንሰጣለን።"},"yo":{"langName":"Yorùbá","title":"Qibora – Ìlànà Ìpamọ́ Àṣírí","updated":"Ìgbà tí a ṣàtúnṣe rẹ̀ kẹ́yìn: Ọjọ́ 24 Oṣù Kẹ̀wàá, 2026","intro":"Qibora (“ìṣàfilọ́lẹ̀ náà”) ń ràn yín lọ́wọ́ láti rí ìtọ́sọ́nà Kíbúlà àti àwọn mọ́sálásí tó wà nítòsí. Ìlànà yìí ṣàlàyé irú ìsọfúnni tí ìṣàfilọ́lẹ̀ náà ń lò, ibi tí ìsọfúnni náà ń lọ, àti àwọn yíyàn tí ẹ ní. Ní ṣókí: orí fóònù yín ni a ti ń ṣírò Kíbúlà, a kò ní olupin (server) kankan tí ń tọ́jú ibi tí ẹ wà, a kò sì ń ta ìsọfúnni ti ara ẹni yín.","sections":[{"h":"1. Ibi tí ẹ wà","p":["Ìṣàfilọ́lẹ̀ náà máa ń béèrè ibi tí ẹ wà kìkì nígbà tí ẹ bá ń lò ó. Orí fóònù yín ni a ti ń lo ibi tí ẹ wà láti ṣírò ìtọ́sọ́nà Kíbúlà àti ijìnnà sí Káàbà. A kì í fi ránṣẹ́ sí àwọn olupin wa, a kì í sì í tọ́jú rẹ̀.","Nígbà tí ẹ bá ṣí ojú-ìwé Máàpù láti rí àwọn mọ́sálásí tó wà nítòsí, ìṣàfilọ́lẹ̀ náà máa ń fi ibi tí ẹ wà ní àròkà — tí a kò sọ ní pàtó ju nǹkan bí kìlómítà 1 lọ (rounded) — ránṣẹ́ sí iṣẹ́ OpenStreetMap Overpass tí ó jẹ́ ọ̀fẹ́ (overpass-api.de, tàbí overpass.kumi.systems gẹ́gẹ́ bí àfidípò) láti wá àwọn mọ́sálásí tó yí yín ká. A kò so orúkọ, àkáǹtì (account) tàbí àmì ìdánimọ̀ ẹ̀rọ kankan mọ́ ìbéèrè yìí. Ìsọfúnni mọ́sálásí © àwọn olùkópa OpenStreetMap, ó wà lábẹ́ ìwé-àṣẹ ODbL.","Iṣẹ́ máàpù fóònù yín ni ó ń ṣàfihàn máàpù náà fúnra rẹ̀ (Apple Maps lórí iPhone, Google Maps lórí Android), ìlànà ìpamọ́ àṣírí ti Apple tàbí ti Google fúnra wọn ni ó sì ń darí iṣẹ́ náà."]},{"h":"2. Kámẹ́rà","p":["Ojú-ìwé AR nìkan ni a ti ń lo kámẹ́rà, láti fi ìtọ́sọ́nà Kíbúlà hàn lórí àwòrán kámẹ́rà tí ń lọ lọ́wọ́. Orí fóònù yín ni a ti ń ṣe àgbéyẹ̀wò àwọn àwòrán ní àkókò gidi; a kò gba nǹkankan sílẹ̀, a kò tọ́jú nǹkankan pamọ́, a kò sì gbé nǹkankan sókè (upload)."]},{"h":"3. Ìsọfúnni tí a ń tọ́jú sórí fóònù yín","p":["Orí fóònù yín nìkan ni a ń tọ́jú àwọn ètò yín sí (àwòṣe tí ẹ yàn, àkòrí (theme), ìwọ̀n ọ̀rọ̀, ojú-ìwé tí ẹ lò kẹ́yìn àti irú àwọn àṣàyàn bẹ́ẹ̀). Bí ẹ bá pa ìṣàfilọ́lẹ̀ náà rẹ́, wọn yóò pa rẹ́ pẹ̀lú."]},{"h":"4. Ìṣirò ìlò láìdárúkọ","p":["Láti mọ àwọn ẹ̀yà iṣẹ́ (features) tí a ń lò àti láti yanjú àwọn ìṣòro, ìṣàfilọ́lẹ̀ náà máa ń fi àwọn ìṣẹ̀lẹ̀ ìlò láìdárúkọ (fún àpẹẹrẹ: ojú-ìwé wo ni a ṣí, bóyá a rí Kíbúlà, ẹ̀dà ìṣàfilọ́lẹ̀ náà àti irú ẹ̀rọ) ránṣẹ́ sí PostHog, tí ó wà lórí àwọn olupin ní Ìṣọ̀kan Yúróòpù. Àwọn ìṣẹ̀lẹ̀ wọ̀nyí kò ní orúkọ yín, ibi tí ẹ wà tàbí àwọn àwòrán kámẹ́rà nínú. Gẹ́gẹ́ bí ó ti rí pẹ̀lú ìsopọ̀ íńtánẹ́ẹ̀tì èyíkéyìí, iṣẹ́ náà lè ṣe àmúlò àdírẹ́sì IP yín, fún àpẹẹrẹ láti fojú díwọ̀n orílẹ̀-èdè tí ẹ wà.","Ẹ lè pa èyí ní ìgbàkígbà nínú Ètò → “Ìṣirò ìlò”."]},{"h":"5. Ìpolówó","p":["Ẹ̀dà ọ̀fẹ́ Qibora máa ń ṣàfihàn àwọn ìpolówó tí Google AdMob pèsè. Google lè lo àmì ìdánimọ̀ ìpolówó ẹ̀rọ yín àti irú ìsọfúnni bẹ́ẹ̀ láti ṣàfihàn àti láti díwọ̀n àwọn ìpolówó, àti, pẹ̀lú àṣẹ yín, láti ṣe wọ́n ní àdáni fún yín.","Lórí iPhone, a máa ń lo àwọn ìpolówó àdáni kìkì bí ẹ bá gbà láàyè fún ìtọpinpin (tracking) nígbà tí ìṣàfilọ́lẹ̀ náà bá béèrè. Ní Agbègbè Ọrọ̀ Ajé Yúróòpù, Ilẹ̀ Gẹ̀ẹ́sì (United Kingdom) àti Switzerland, fèrèsé ìfọwọ́sí kan máa ń jẹ́ kí ẹ yan bí a ṣe ń lo ìsọfúnni yín fún ìpolówó. Ẹ tún lè tún àmì ìdánimọ̀ ìpolówó yín ṣe (reset) tàbí fi òdiwọ̀n sí i nínú ètò fóònù yín.","A máa ń ṣẹ́ àwọn ìpolówó kí wọ́n lè yẹ fún gbogbo ènìyàn. Ìsọfúnni síwájú sí i: https://policies.google.com/technologies/ads","Qibora Pro máa ń yọ gbogbo ìpolówó kúrò."]},{"h":"6. Rírà","p":["A máa ń ta Qibora Pro nípasẹ̀ App Store tàbí Google Play. Apple tàbí Google ni ó ń bójú tó gbogbo ìsanwó pátápátá; a kì í rí àlàyé káàdì yín tàbí ti ìsanwó yín rárá.","Láti jẹ́rìí sí àwọn rírà tí ẹ ní àti láti dá wọn padà, ìṣàfilọ́lẹ̀ náà ń lo RevenueCat, èyí tí ó ń gba àmì ìdánimọ̀ olùmúlò ìṣàfilọ́lẹ̀ láìdárúkọ àti àwọn ìwé-ẹ̀rí rírà yín láti ilé ìtajà. Kò gba orúkọ yín tàbí àlàyé ìsanwó yín."]},{"h":"7. Àwọn ọmọdé","p":["Qibora jẹ́ ìṣàfilọ́lẹ̀ fún gbogbo ènìyàn, a kò sì ṣe é fún àwọn ọmọdé tí ọjọ́ orí wọn kò tó ọdún 13. A kì í mọ̀ọ́mọ̀ gba ìsọfúnni ti ara ẹni lọ́wọ́ àwọn ọmọdé."]},{"h":"8. Àwọn yíyàn àti ẹ̀tọ́ yín","p":["Ẹ lè kọ̀ tàbí fagilé àṣẹ ibi tí ẹ wà àti ti kámẹ́rà nínú ètò fóònù yín (ìṣàfilọ́lẹ̀ náà kò ní lè rí Kíbúlà láìsí ibi tí ẹ wà), ẹ lè pa ìṣirò ìlò nínú ìṣàfilọ́lẹ̀ náà, ẹ lè yí ìfọwọ́sí ìpolówó tàbí yíyàn ìtọpinpin yín padà, ẹ sì lè pa gbogbo ìsọfúnni tí a tọ́jú sórí fóònù yín rẹ́ nípa pípa ìṣàfilọ́lẹ̀ náà rẹ́.","Ní ìbámu pẹ̀lú ibi tí ẹ ń gbé (fún àpẹẹrẹ lábẹ́ GDPR, UK GDPR, KVKK ti Tọ́kì tàbí CCPA ti California), ẹ lè ní ẹ̀tọ́ láti rí ìsọfúnni ti ara ẹni, láti ṣàtúnṣe rẹ̀ tàbí láti pa á rẹ́, àti láti tako bí a ṣe ń ṣe àmúlò rẹ̀. Nítorí pé a kò ní ìsọfúnni tí ó lè fi ẹni tí ẹ jẹ́ hàn, a lè ṣe èyí tó pọ̀ jù nínú àwọn ìbéèrè nípasẹ̀ àwọn àṣàyàn tí ó wà lókè; ẹ tún lè kàn sí wa ní àdírẹ́sì tí ó wà nísàlẹ̀."]},{"h":"9. Àwọn àyípadà sí ìlànà yìí","p":["A lè ṣàtúnṣe ìlànà yìí nígbà tí ìṣàfilọ́lẹ̀ náà bá yí padà. Ọjọ́ tí ó wà lókè ni ó ń fi ẹ̀dà tuntun jùlọ hàn."]},{"h":"10. Ìkànsí àti ìrànlọ́wọ́","p":["Fún àwọn ìbéèrè nípa ìlànà yìí, ìrànlọ́wọ́ nípa ìṣàfilọ́lẹ̀ náà, tàbí àwọn ìṣòro pẹ̀lú rírà, ẹ kọ̀wé sí wa ní miswakapp@gmail.com."]}],"langLabel":"Èdè","supportTitle":"Ìrànlọ́wọ́","supportText":"Ṣé ẹ nílò ìrànlọ́wọ́ nípa Qibora tàbí rírà kan? Ẹ fi ímeèlì ránṣẹ́ sí wa ní miswakapp@gmail.com — a sábà máa ń fèsì láàrin ọjọ́ díẹ̀."},"sq":{"langName":"Shqip","title":"Qibora – Politika e privatësisë","updated":"Përditësuar së fundi: 24 tetor 2026","intro":"Qibora («aplikacioni») ju ndihmon të gjeni drejtimin e kibles dhe xhamitë në afërsi. Kjo politikë shpjegon se cilat informacione përdor aplikacioni, ku shkojnë ato dhe cilat zgjedhje keni. Shkurt: kibla llogaritet në telefonin tuaj, ne nuk operojmë serverë që ruajnë vendndodhjen tuaj dhe nuk i shesim të dhënat tuaja personale.","sections":[{"h":"1. Vendndodhja juaj","p":["Aplikacioni kërkon qasje në vendndodhjen tuaj vetëm gjatë kohës që e përdorni. Vendndodhja juaj përdoret në telefonin tuaj për të llogaritur drejtimin e kibles dhe distancën deri te Qabeja. Ajo nuk dërgohet në serverët tanë dhe ne nuk e ruajmë.","Kur hapni ekranin Harta për të parë xhamitë në afërsi, aplikacioni dërgon një vendndodhje të përafërt, të rrumbullakosur në rreth 1 km, te shërbimi falas OpenStreetMap Overpass (overpass-api.de, ose overpass.kumi.systems si rezervë) për të kërkuar xhamitë përreth jush. Kësaj kërkese nuk i bashkëngjitet asnjë emër, llogari apo identifikues i pajisjes. Të dhënat e xhamive © kontribuuesit e OpenStreetMap, të disponueshme sipas licencës ODbL.","Vetë harta shfaqet nga shërbimi i hartave i telefonit tuaj (Apple Maps në iPhone, Google Maps në Android), i cili i nënshtrohet politikës së privatësisë së vetë Apple ose Google."]},{"h":"2. Kamera","p":["Kamera përdoret vetëm në ekranin AR, për të shfaqur drejtimin e kibles mbi pamjen e drejtpërdrejtë të kamerës. Imazhet përpunohen në telefonin tuaj në kohë reale; asgjë nuk regjistrohet, nuk ruhet dhe nuk ngarkohet."]},{"h":"3. Informacioni i ruajtur në telefonin tuaj","p":["Cilësimet tuaja (dizajni i zgjedhur, tema, madhësia e tekstit, ekrani i përdorur së fundi dhe preferenca të ngjashme) ruhen vetëm në telefonin tuaj. Fshirja e aplikacionit i fshin edhe ato."]},{"h":"4. Statistika anonime të përdorimit","p":["Për të kuptuar se cilat veçori përdoren dhe për të rregulluar problemet, aplikacioni dërgon ngjarje anonime përdorimi (për shembull: cili ekran u hap, nëse u gjet kibla, versioni i aplikacionit dhe lloji i pajisjes) te PostHog, i strehuar në serverë në Bashkimin Evropian. Këto ngjarje nuk përfshijnë emrin tuaj, vendndodhjen tuaj apo imazhe nga kamera. Si në çdo lidhje me internetin, adresa juaj IP mund të përpunohet nga shërbimi, për shembull për të vlerësuar shtetin.","Këtë mund ta çaktivizoni në çdo kohë te Cilësimet → «Statistikat e përdorimit»."]},{"h":"5. Reklamat","p":["Versioni falas i Qibora shfaq reklama të ofruara nga Google AdMob. Google mund të përdorë identifikuesin e reklamave të pajisjes suaj dhe informacione të ngjashme për të shfaqur dhe matur reklamat, si dhe, me lejen tuaj, për t'i personalizuar ato.","Në iPhone, reklamat e personalizuara përdoren vetëm nëse e lejoni gjurmimin kur aplikacioni jua kërkon. Në Zonën Ekonomike Evropiane, në Mbretërinë e Bashkuar dhe në Zvicër, një dritare pëlqimi ju lejon të zgjidhni se si përdoren të dhënat tuaja për reklama. Gjithashtu mund ta rivendosni ose ta kufizoni identifikuesin tuaj të reklamave te cilësimet e telefonit.","Reklamat filtrohen që të jenë të përshtatshme për publikun e gjerë. Më shumë informacion: https://policies.google.com/technologies/ads","Qibora Pro i heq të gjitha reklamat."]},{"h":"6. Blerjet","p":["Qibora Pro shitet përmes App Store ose Google Play. Pagesat trajtohen tërësisht nga Apple ose Google; ne nuk i shohim kurrë të dhënat e kartës apo të pagesës suaj.","Për të konfirmuar se cilat blerje zotëroni dhe për t'i rikthyer ato, aplikacioni përdor RevenueCat, i cili merr një ID anonime përdoruesi të aplikacionit dhe faturat e blerjeve tuaja nga dyqani. Ai nuk merr emrin tuaj apo të dhënat e pagesës."]},{"h":"7. Fëmijët","p":["Qibora është një aplikacion për publikun e gjerë dhe nuk u drejtohet fëmijëve nën 13 vjeç. Ne nuk mbledhim me dijeni informacione personale nga fëmijët."]},{"h":"8. Zgjedhjet dhe të drejtat tuaja","p":["Mund ta refuzoni ose ta tërhiqni lejen për vendndodhjen dhe kamerën te cilësimet e telefonit (pa vendndodhjen aplikacioni nuk do të mund ta gjejë kiblën), të çaktivizoni statistikat e përdorimit në aplikacion, të ndryshoni pëlqimin për reklamat ose zgjedhjen për gjurmimin, si dhe të fshini të gjitha të dhënat e ruajtura lokalisht duke fshirë aplikacionin.","Në varësi të vendit ku jetoni (për shembull sipas GDPR, UK GDPR, KVKK të Turqisë ose CCPA të Kalifornisë), mund të keni të drejtën të aksesoni, të korrigjoni ose të fshini të dhënat personale dhe të kundërshtoni përpunimin e tyre. Duke qenë se ne nuk mbajmë të dhëna që ju identifikojnë, shumica e kërkesave mund të përmbushen me opsionet e mësipërme; gjithashtu mund të na kontaktoni në adresën më poshtë."]},{"h":"9. Ndryshimet në këtë politikë","p":["Mund ta përditësojmë këtë politikë kur aplikacioni ndryshon. Data në krye tregon versionin më të fundit."]},{"h":"10. Kontakti dhe mbështetja","p":["Për pyetje rreth kësaj politike, ndihmë me aplikacionin ose probleme me ndonjë blerje, na shkruani në miswakapp@gmail.com."]}],"langLabel":"Gjuha","supportTitle":"Mbështetja","supportText":"Keni nevojë për ndihmë me Qibora ose me një blerje? Na shkruani në miswakapp@gmail.com — zakonisht përgjigjemi brenda pak ditëve."},"bs":{"langName":"Bosanski","title":"Qibora – Politika privatnosti","updated":"Posljednje ažuriranje: 24. oktobra 2026.","intro":"Qibora („aplikacija“) vam pomaže da pronađete smjer kible i obližnje džamije. Ova politika objašnjava koje informacije aplikacija koristi, kuda one idu i koje izbore imate. Ukratko: kibla se izračunava na vašem telefonu, nemamo servere koji pohranjuju vašu lokaciju i ne prodajemo vaše lične podatke.","sections":[{"h":"1. Vaša lokacija","p":["Aplikacija traži pristup vašoj lokaciji samo dok je koristite. Vaša lokacija koristi se na vašem telefonu za izračunavanje smjera kible i udaljenosti do Kabe. Ne šalje se na naše servere i ne pohranjujemo je.","Kada otvorite ekran Mapa kako biste vidjeli obližnje džamije, aplikacija šalje približnu lokaciju, zaokruženu na oko 1 km, besplatnoj usluzi OpenStreetMap Overpass (overpass-api.de ili, kao rezervnoj opciji, overpass.kumi.systems) radi pretrage džamija u vašoj blizini. Uz ovaj zahtjev ne prilaže se nikakvo ime, korisnički račun niti identifikator uređaja. Podaci o džamijama © saradnici projekta OpenStreetMap, dostupni pod licencom ODbL.","Samu mapu prikazuje usluga mapa na vašem telefonu (Apple Maps na iPhoneu, Google Maps na Androidu), na koju se primjenjuje vlastita politika privatnosti kompanije Apple odnosno Google."]},{"h":"2. Kamera","p":["Kamera se koristi samo na AR ekranu, za prikaz smjera kible preko slike kamere uživo. Slike se obrađuju na vašem telefonu u stvarnom vremenu; ništa se ne snima, ne pohranjuje niti otprema."]},{"h":"3. Informacije pohranjene na vašem telefonu","p":["Vaše postavke (odabrani dizajn, tema, veličina teksta, posljednji korišteni ekran i slične preferencije) pohranjuju se samo na vašem telefonu. Brisanjem aplikacije brišu se i one."]},{"h":"4. Anonimna statistika korištenja","p":["Kako bismo razumjeli koje se funkcije koriste i otklonili probleme, aplikacija šalje anonimne događaje korištenja (na primjer: koji je ekran otvoren, da li je kibla pronađena, verzija aplikacije i vrsta uređaja) usluzi PostHog, čiji se serveri nalaze u Evropskoj uniji. Ovi događaji ne uključuju vaše ime, vašu lokaciju niti slike s kamere. Kao i kod svake internetske veze, usluga može obrađivati vašu IP adresu, na primjer radi procjene države u kojoj se nalazite.","Ovo možete isključiti u bilo kojem trenutku u meniju Postavke → „Statistika korištenja“."]},{"h":"5. Oglašavanje","p":["Besplatna verzija aplikacije Qibora prikazuje oglase koje pruža Google AdMob. Google može koristiti identifikator za oglašavanje vašeg uređaja i slične informacije za prikazivanje i mjerenje oglasa te, uz vašu dozvolu, za njihovu personalizaciju.","Na iPhoneu se personalizirani oglasi koriste samo ako dozvolite praćenje kada vas aplikacija to upita. U Evropskom ekonomskom prostoru, Ujedinjenom Kraljevstvu i Švicarskoj prozor za saglasnost omogućava vam da odaberete kako se vaši podaci koriste za oglase. Svoj identifikator za oglašavanje možete također resetovati ili ograničiti u postavkama telefona.","Oglasi se filtriraju kako bi bili prikladni za opću publiku. Više informacija: https://policies.google.com/technologies/ads","Qibora Pro uklanja sve oglase."]},{"h":"6. Kupovine","p":["Qibora Pro se prodaje putem trgovine App Store ili Google Play. Plaćanja u potpunosti obrađuje Apple ili Google; mi nikada ne vidimo podatke o vašoj kartici niti o plaćanju.","Kako bi potvrdila koje kupovine posjedujete i omogućila njihovo vraćanje, aplikacija koristi RevenueCat, koji prima anonimni korisnički ID aplikacije i potvrde o vašim kupovinama iz trgovine. RevenueCat ne prima vaše ime niti podatke o plaćanju."]},{"h":"7. Djeca","p":["Qibora je aplikacija namijenjena općoj publici i nije usmjerena na djecu mlađu od 13 godina. Svjesno ne prikupljamo lične podatke od djece."]},{"h":"8. Vaši izbori i prava","p":["Dozvolu za lokaciju i kameru možete odbiti ili povući u postavkama telefona (bez lokacije aplikacija neće moći pronaći kiblu), isključiti statistiku korištenja u aplikaciji, promijeniti saglasnost za oglase ili izbor u vezi s praćenjem te izbrisati sve lokalno pohranjene podatke brisanjem aplikacije.","Zavisno od toga gdje živite (na primjer prema propisima GDPR, UK GDPR, turskom zakonu KVKK ili kalifornijskom zakonu CCPA), možda imate pravo na pristup ličnim podacima, njihovu ispravku ili brisanje, kao i pravo na prigovor na njihovu obradu. Budući da ne posjedujemo podatke koji vas identificiraju, većina zahtjeva može se ispuniti putem gore navedenih opcija; možete nas kontaktirati i na adresi navedenoj u nastavku."]},{"h":"9. Izmjene ove politike","p":["Ovu politiku možemo ažurirati kada se aplikacija promijeni. Datum na vrhu stranice označava najnoviju verziju."]},{"h":"10. Kontakt i podrška","p":["Za pitanja o ovoj politici, pomoć s aplikacijom ili probleme s kupovinom pišite nam na miswakapp@gmail.com."]}],"langLabel":"Jezik","supportTitle":"Podrška","supportText":"Trebate pomoć s aplikacijom Qibora ili s kupovinom? Pišite nam na miswakapp@gmail.com — obično odgovaramo u roku od nekoliko dana."},"fr":{"langName":"Français","title":"Qibora – Politique de confidentialité","updated":"Dernière mise à jour : 24 octobre 2026","intro":"Qibora (« l’application ») vous aide à trouver la direction de la qibla et les mosquées à proximité. La présente politique explique quelles informations l’application utilise, où elles sont transmises et de quels choix vous disposez. En résumé : la qibla est calculée sur votre téléphone, nous n’exploitons aucun serveur qui enregistre votre position et nous ne vendons pas vos données personnelles.","sections":[{"h":"1. Votre position","p":["L’application demande l’accès à votre position uniquement pendant que vous l’utilisez. Votre position est utilisée sur votre téléphone pour calculer la direction de la qibla et la distance jusqu’à la Kaaba. Elle n’est pas envoyée à nos serveurs et nous ne la conservons pas.","Lorsque vous ouvrez l’écran Carte pour voir les mosquées à proximité, l’application envoie une position approximative, arrondie à environ 1 km, au service gratuit OpenStreetMap Overpass (overpass-api.de, ou overpass.kumi.systems en secours) afin de rechercher les mosquées autour de vous. Aucun nom, compte ou identifiant d’appareil n’est associé à cette requête. Données des mosquées © contributeurs d’OpenStreetMap, disponibles sous licence ODbL.","La carte elle-même est affichée par le service de cartographie de votre téléphone (Apple Maps sur iPhone, Google Maps sur Android), qui est soumis à la politique de confidentialité propre à Apple ou à Google."]},{"h":"2. Appareil photo","p":["L’appareil photo est utilisé uniquement sur l’écran AR, pour afficher la direction de la qibla sur l’image en direct de la caméra. Les images sont traitées sur votre téléphone en temps réel ; rien n’est enregistré, sauvegardé ni envoyé."]},{"h":"3. Informations stockées sur votre téléphone","p":["Vos paramètres (design choisi, thème, taille du texte, dernier écran utilisé et préférences similaires) sont stockés uniquement sur votre téléphone. Ils sont supprimés lorsque vous supprimez l’application."]},{"h":"4. Statistiques d’utilisation anonymes","p":["Afin de comprendre quelles fonctionnalités sont utilisées et de corriger les problèmes, l’application envoie des événements d’utilisation anonymes (par exemple : l’écran ouvert, si la qibla a été trouvée, la version de l’application et le type d’appareil) à PostHog, hébergé sur des serveurs situés dans l’Union européenne. Ces événements ne comprennent ni votre nom, ni votre position, ni les images de la caméra. Comme pour toute connexion à Internet, votre adresse IP peut être traitée par le service, par exemple pour estimer le pays.","Vous pouvez désactiver cette fonction à tout moment dans Paramètres → « Statistiques d’utilisation »."]},{"h":"5. Publicité","p":["La version gratuite de Qibora affiche des publicités fournies par Google AdMob. Google peut utiliser l’identifiant publicitaire de votre appareil et des informations similaires pour afficher et mesurer les publicités et, avec votre autorisation, pour les personnaliser.","Sur iPhone, les publicités personnalisées ne sont utilisées que si vous autorisez le suivi lorsque l’application vous le demande. Dans l’Espace économique européen, au Royaume-Uni et en Suisse, une fenêtre de consentement vous permet de choisir la manière dont vos données sont utilisées à des fins publicitaires. Vous pouvez également réinitialiser ou limiter votre identifiant publicitaire dans les paramètres de votre téléphone.","Les publicités sont filtrées afin de convenir à un public général. Plus d’informations : https://policies.google.com/technologies/ads","Qibora Pro supprime toutes les publicités."]},{"h":"6. Achats","p":["Qibora Pro est vendu via l’App Store ou Google Play. Les paiements sont entièrement gérés par Apple ou Google ; nous n’avons jamais accès aux données de votre carte ni à vos informations de paiement.","Pour confirmer les achats que vous possédez et les restaurer, l’application utilise RevenueCat, qui reçoit un identifiant utilisateur anonyme propre à l’application ainsi que les reçus de vos achats effectués sur la boutique. RevenueCat ne reçoit ni votre nom ni vos informations de paiement."]},{"h":"7. Enfants","p":["Qibora est une application destinée à un public général et ne s’adresse pas aux enfants de moins de 13 ans. Nous ne collectons pas sciemment d’informations personnelles auprès d’enfants."]},{"h":"8. Vos choix et vos droits","p":["Vous pouvez refuser ou retirer l’autorisation d’accès à la position et à l’appareil photo dans les paramètres de votre téléphone (sans la position, l’application ne pourra pas trouver la qibla), désactiver les statistiques d’utilisation dans l’application, modifier votre consentement publicitaire ou votre choix en matière de suivi, et supprimer toutes les données stockées localement en supprimant l’application.","Selon votre lieu de résidence (par exemple en vertu du RGPD, du UK GDPR, de la loi turque KVKK ou de la loi californienne CCPA), vous pouvez disposer du droit d’accéder à vos données personnelles, de les rectifier ou de les supprimer, ainsi que de vous opposer à leur traitement. Comme nous ne détenons aucune donnée permettant de vous identifier, la plupart des demandes peuvent être satisfaites grâce aux options ci-dessus ; vous pouvez également nous contacter à l’adresse indiquée ci-dessous."]},{"h":"9. Modifications de la présente politique","p":["Nous pouvons mettre à jour la présente politique lorsque l’application évolue. La date indiquée en haut de la page correspond à la version la plus récente."]},{"h":"10. Contact et assistance","p":["Pour toute question concernant la présente politique, pour obtenir de l’aide avec l’application ou en cas de problème lié à un achat, écrivez-nous à miswakapp@gmail.com."]}],"langLabel":"Langue","supportTitle":"Assistance","supportText":"Besoin d’aide avec Qibora ou un achat ? Écrivez-nous à miswakapp@gmail.com — nous répondons généralement sous quelques jours."},"de":{"langName":"Deutsch","title":"Qibora – Datenschutzerklärung","updated":"Zuletzt aktualisiert: 24. Oktober 2026","intro":"Qibora („die App“) hilft Ihnen, die Qibla-Richtung und Moscheen in Ihrer Nähe zu finden. Diese Datenschutzerklärung erläutert, welche Informationen die App verwendet, wohin sie übermittelt werden und welche Wahlmöglichkeiten Sie haben. Kurz gesagt: Die Qibla wird auf Ihrem Telefon berechnet, wir betreiben keine Server, die Ihren Standort speichern, und wir verkaufen Ihre personenbezogenen Daten nicht.","sections":[{"h":"1. Ihr Standort","p":["Die App fragt Ihren Standort nur ab, während Sie sie verwenden. Ihr Standort wird auf Ihrem Telefon verwendet, um die Qibla-Richtung und die Entfernung zur Kaaba zu berechnen. Er wird nicht an unsere Server gesendet, und wir speichern ihn nicht.","Wenn Sie den Kartenbildschirm öffnen, um Moscheen in der Nähe anzuzeigen, sendet die App einen ungefähren, auf etwa 1 km gerundeten Standort an den kostenlosen Dienst OpenStreetMap Overpass (overpass-api.de oder ersatzweise overpass.kumi.systems), um Moscheen in Ihrer Umgebung abzufragen. Dieser Anfrage werden weder ein Name noch ein Konto oder eine Gerätekennung beigefügt. Moscheedaten © OpenStreetMap-Mitwirkende, verfügbar unter der ODbL-Lizenz.","Die Karte selbst wird vom Kartendienst Ihres Telefons angezeigt (Apple Maps auf dem iPhone, Google Maps auf Android); hierfür gilt die eigene Datenschutzrichtlinie von Apple bzw. Google."]},{"h":"2. Kamera","p":["Die Kamera wird nur auf dem AR-Bildschirm verwendet, um die Qibla-Richtung über dem Live-Kamerabild anzuzeigen. Die Bilder werden in Echtzeit auf Ihrem Telefon verarbeitet; es wird nichts aufgezeichnet, gespeichert oder hochgeladen."]},{"h":"3. Auf Ihrem Telefon gespeicherte Informationen","p":["Ihre Einstellungen (gewähltes Design, Farbschema, Textgröße, zuletzt verwendeter Bildschirm und ähnliche Präferenzen) werden ausschließlich auf Ihrem Telefon gespeichert. Wenn Sie die App löschen, werden sie ebenfalls gelöscht."]},{"h":"4. Anonyme Nutzungsstatistiken","p":["Um zu verstehen, welche Funktionen genutzt werden, und um Probleme zu beheben, sendet die App anonyme Nutzungsereignisse (zum Beispiel: welcher Bildschirm geöffnet wurde, ob die Qibla gefunden wurde, die App-Version und den Gerätetyp) an PostHog, das auf Servern in der Europäischen Union gehostet wird. Diese Ereignisse enthalten weder Ihren Namen noch Ihren Standort oder Kamerabilder. Wie bei jeder Internetverbindung kann Ihre IP-Adresse von dem Dienst verarbeitet werden, zum Beispiel um das Land näherungsweise zu bestimmen.","Sie können dies jederzeit unter Einstellungen → „Nutzungsstatistiken“ deaktivieren."]},{"h":"5. Werbung","p":["Die kostenlose Version von Qibora zeigt Werbung an, die von Google AdMob bereitgestellt wird. Google kann die Werbe-ID Ihres Geräts und ähnliche Informationen verwenden, um Anzeigen auszuliefern und zu messen sowie – mit Ihrer Erlaubnis – zu personalisieren.","Auf dem iPhone wird personalisierte Werbung nur verwendet, wenn Sie das Tracking erlauben, sobald die App danach fragt. Im Europäischen Wirtschaftsraum, im Vereinigten Königreich und in der Schweiz können Sie in einem Einwilligungsfenster festlegen, wie Ihre Daten für Werbung verwendet werden. Außerdem können Sie Ihre Werbe-ID in den Einstellungen Ihres Telefons zurücksetzen oder einschränken.","Die Anzeigen werden so gefiltert, dass sie für ein allgemeines Publikum geeignet sind. Weitere Informationen: https://policies.google.com/technologies/ads","Qibora Pro entfernt sämtliche Werbung."]},{"h":"6. Käufe","p":["Qibora Pro wird über den App Store oder Google Play verkauft. Zahlungen werden vollständig von Apple bzw. Google abgewickelt; wir sehen Ihre Karten- oder Zahlungsdaten zu keinem Zeitpunkt.","Um festzustellen, welche Käufe Ihnen gehören, und um diese wiederherzustellen, verwendet die App RevenueCat. RevenueCat erhält eine anonyme App-Nutzer-ID und Ihre Kaufbelege aus dem Store, nicht jedoch Ihren Namen oder Ihre Zahlungsdaten."]},{"h":"7. Kinder","p":["Qibora ist eine App für ein allgemeines Publikum und richtet sich nicht an Kinder unter 13 Jahren. Wir erheben nicht wissentlich personenbezogene Daten von Kindern."]},{"h":"8. Ihre Wahlmöglichkeiten und Rechte","p":["Sie können die Standort- und Kameraberechtigung in den Einstellungen Ihres Telefons verweigern oder widerrufen (ohne Standort kann die App die Qibla nicht finden), die Nutzungsstatistiken in der App deaktivieren, Ihre Werbeeinwilligung oder Ihre Tracking-Entscheidung ändern und alle lokal gespeicherten Daten löschen, indem Sie die App löschen.","Je nach Wohnort (zum Beispiel nach der DSGVO, der UK GDPR, dem türkischen KVKK oder dem kalifornischen CCPA) haben Sie möglicherweise das Recht, auf personenbezogene Daten zuzugreifen, sie berichtigen oder löschen zu lassen und ihrer Verarbeitung zu widersprechen. Da uns keine Daten vorliegen, die Sie identifizieren, lassen sich die meisten Anfragen über die oben genannten Optionen erfüllen; Sie können uns aber auch unter der unten angegebenen Adresse kontaktieren."]},{"h":"9. Änderungen dieser Datenschutzerklärung","p":["Wir können diese Datenschutzerklärung aktualisieren, wenn sich die App ändert. Das Datum oben auf der Seite gibt die aktuelle Version an."]},{"h":"10. Kontakt und Support","p":["Bei Fragen zu dieser Datenschutzerklärung, für Hilfe mit der App oder bei Problemen mit einem Kauf schreiben Sie uns an miswakapp@gmail.com."]}],"langLabel":"Sprache","supportTitle":"Support","supportText":"Sie benötigen Hilfe mit Qibora oder einem Kauf? Schreiben Sie uns eine E-Mail an miswakapp@gmail.com – wir antworten in der Regel innerhalb weniger Tage."},"es":{"langName":"Español","title":"Qibora – Política de privacidad","updated":"Última actualización: 24 de octubre de 2026","intro":"Qibora («la aplicación») le ayuda a encontrar la dirección de la qibla y las mezquitas cercanas. Esta política explica qué información utiliza la aplicación, adónde se envía y qué opciones tiene usted. En resumen: la qibla se calcula en su teléfono, no operamos servidores que almacenen su ubicación y no vendemos sus datos personales.","sections":[{"h":"1. Su ubicación","p":["La aplicación solicita su ubicación solo mientras la está usando. Su ubicación se utiliza en su teléfono para calcular la dirección de la qibla y la distancia hasta la Kaaba. No se envía a nuestros servidores y no la almacenamos.","Cuando abre la pantalla Mapa para ver las mezquitas cercanas, la aplicación envía una ubicación aproximada, redondeada a alrededor de 1 km, al servicio gratuito OpenStreetMap Overpass (overpass-api.de, o overpass.kumi.systems como alternativa) para buscar mezquitas a su alrededor. Esta solicitud no incluye ningún nombre, cuenta ni identificador del dispositivo. Datos de mezquitas © colaboradores de OpenStreetMap, disponibles bajo la licencia ODbL.","El propio mapa se muestra mediante el servicio de mapas de su teléfono (Apple Maps en iPhone, Google Maps en Android), que está sujeto a la política de privacidad de Apple o de Google."]},{"h":"2. Cámara","p":["La cámara se utiliza únicamente en la pantalla AR, para mostrar la dirección de la qibla sobre la imagen en directo de la cámara. Las imágenes se procesan en su teléfono en tiempo real; no se graba, guarda ni sube nada."]},{"h":"3. Información almacenada en su teléfono","p":["Sus ajustes (diseño elegido, tema, tamaño del texto, última pantalla utilizada y preferencias similares) se almacenan únicamente en su teléfono. Si elimina la aplicación, también se eliminan."]},{"h":"4. Estadísticas de uso anónimas","p":["Para entender qué funciones se utilizan y solucionar problemas, la aplicación envía eventos de uso anónimos (por ejemplo: qué pantalla se abrió, si se encontró la qibla, la versión de la aplicación y el tipo de dispositivo) a PostHog, alojado en servidores de la Unión Europea. Estos eventos no incluyen su nombre, su ubicación ni imágenes de la cámara. Como ocurre con cualquier conexión a internet, el servicio puede tratar su dirección IP, por ejemplo, para estimar el país.","Puede desactivarlo en cualquier momento en Ajustes → «Estadísticas de uso»."]},{"h":"5. Publicidad","p":["La versión gratuita de Qibora muestra anuncios proporcionados por Google AdMob. Google puede utilizar el identificador de publicidad de su dispositivo e información similar para mostrar y medir anuncios y, con su permiso, para personalizarlos.","En iPhone, los anuncios personalizados solo se utilizan si usted permite el rastreo cuando la aplicación se lo solicita. En el Espacio Económico Europeo, el Reino Unido y Suiza, una ventana de consentimiento le permite elegir cómo se utilizan sus datos con fines publicitarios. También puede restablecer o limitar su identificador de publicidad en los ajustes de su teléfono.","Los anuncios se filtran para que sean adecuados para un público general. Más información: https://policies.google.com/technologies/ads","Qibora Pro elimina todos los anuncios."]},{"h":"6. Compras","p":["Qibora Pro se vende a través del App Store o Google Play. Los pagos los gestionan íntegramente Apple o Google; nunca vemos los datos de su tarjeta ni sus datos de pago.","Para confirmar qué compras le pertenecen y restaurarlas, la aplicación utiliza RevenueCat, que recibe un identificador de usuario anónimo de la aplicación y los recibos de sus compras en la tienda. RevenueCat no recibe su nombre ni sus datos de pago."]},{"h":"7. Niños","p":["Qibora es una aplicación dirigida al público general y no está destinada a niños menores de 13 años. No recopilamos a sabiendas información personal de niños."]},{"h":"8. Sus opciones y derechos","p":["Puede denegar o retirar el permiso de ubicación y de cámara en los ajustes de su teléfono (sin la ubicación, la aplicación no podrá encontrar la qibla), desactivar las estadísticas de uso en la aplicación, cambiar su consentimiento publicitario o su elección sobre el rastreo, y eliminar todos los datos almacenados localmente eliminando la aplicación.","Según el lugar donde resida (por ejemplo, en virtud del RGPD, el UK GDPR, la KVKK de Turquía o la CCPA de California), es posible que tenga derecho a acceder a datos personales, rectificarlos o suprimirlos, así como a oponerse a su tratamiento. Dado que no conservamos datos que le identifiquen, la mayoría de las solicitudes pueden atenderse con las opciones anteriores; también puede ponerse en contacto con nosotros en la dirección que figura a continuación."]},{"h":"9. Cambios en esta política","p":["Podemos actualizar esta política cuando la aplicación cambie. La fecha que aparece al principio indica la versión más reciente."]},{"h":"10. Contacto y soporte","p":["Si tiene preguntas sobre esta política, necesita ayuda con la aplicación o tiene problemas con una compra, escríbanos a miswakapp@gmail.com."]}],"langLabel":"Idioma","supportTitle":"Soporte","supportText":"¿Necesita ayuda con Qibora o con una compra? Escríbanos a miswakapp@gmail.com; normalmente respondemos en unos pocos días."},"pt":{"langName":"Português","title":"Qibora – Política de Privacidade","updated":"Última atualização: 24 de outubro de 2026","intro":"O Qibora (“o aplicativo”) ajuda você a encontrar a direção da qibla e as mesquitas próximas. Esta política explica quais informações o aplicativo utiliza, para onde elas são enviadas e quais são as suas opções. Em resumo: a qibla é calculada no seu celular, não operamos servidores que armazenem a sua localização e não vendemos os seus dados pessoais.","sections":[{"h":"1. Sua localização","p":["O aplicativo solicita a sua localização somente enquanto você o utiliza. A sua localização é usada no seu celular para calcular a direção da qibla e a distância até a Kaaba. Ela não é enviada aos nossos servidores e não a armazenamos.","Quando você abre a tela Mapa para ver as mesquitas próximas, o aplicativo envia uma localização aproximada, arredondada para cerca de 1 km, ao serviço gratuito OpenStreetMap Overpass (overpass-api.de ou, como alternativa, overpass.kumi.systems) para buscar mesquitas ao seu redor. Nenhum nome, conta ou identificador do dispositivo é vinculado a essa solicitação. Dados das mesquitas © colaboradores do OpenStreetMap, disponíveis sob a licença ODbL.","O mapa em si é exibido pelo serviço de mapas do seu celular (Apple Maps no iPhone, Google Maps no Android), que está sujeito à política de privacidade própria da Apple ou do Google."]},{"h":"2. Câmera","p":["A câmera é usada somente na tela AR, para mostrar a direção da qibla sobre a imagem ao vivo da câmera. As imagens são processadas no seu celular em tempo real; nada é gravado, salvo ou enviado."]},{"h":"3. Informações armazenadas no seu celular","p":["As suas configurações (design escolhido, tema, tamanho do texto, última tela usada e preferências semelhantes) são armazenadas somente no seu celular. Ao excluir o aplicativo, elas também são excluídas."]},{"h":"4. Estatísticas de uso anônimas","p":["Para entender quais recursos são usados e corrigir problemas, o aplicativo envia eventos de uso anônimos (por exemplo: qual tela foi aberta, se a qibla foi encontrada, a versão do aplicativo e o tipo de dispositivo) ao PostHog, hospedado em servidores na União Europeia. Esses eventos não incluem o seu nome, a sua localização nem imagens da câmera. Como em qualquer conexão com a internet, o seu endereço IP pode ser tratado pelo serviço, por exemplo, para estimar o país.","Você pode desativar isso a qualquer momento em Configurações → “Estatísticas de uso”."]},{"h":"5. Publicidade","p":["A versão gratuita do Qibora exibe anúncios fornecidos pelo Google AdMob. O Google pode usar o identificador de publicidade do seu dispositivo e informações semelhantes para exibir e medir anúncios e, com a sua permissão, para personalizá-los.","No iPhone, os anúncios personalizados só são usados se você permitir o rastreamento quando o aplicativo solicitar. No Espaço Econômico Europeu, no Reino Unido e na Suíça, uma janela de consentimento permite que você escolha como os seus dados são usados para anúncios. Você também pode redefinir ou limitar o seu identificador de publicidade nas configurações do seu celular.","Os anúncios são filtrados para serem adequados ao público em geral. Mais informações: https://policies.google.com/technologies/ads","O Qibora Pro remove todos os anúncios."]},{"h":"6. Compras","p":["O Qibora Pro é vendido pela App Store ou pelo Google Play. Os pagamentos são processados integralmente pela Apple ou pelo Google; nunca temos acesso aos dados do seu cartão ou de pagamento.","Para confirmar quais compras pertencem a você e restaurá-las, o aplicativo usa o RevenueCat, que recebe um ID de usuário anônimo do aplicativo e os comprovantes das suas compras na loja. O RevenueCat não recebe o seu nome nem os seus dados de pagamento."]},{"h":"7. Crianças","p":["O Qibora é um aplicativo destinado ao público em geral e não é direcionado a crianças menores de 13 anos. Não coletamos intencionalmente informações pessoais de crianças."]},{"h":"8. Suas opções e direitos","p":["Você pode negar ou revogar a permissão de localização e de câmera nas configurações do seu celular (sem a localização, o aplicativo não conseguirá encontrar a qibla), desativar as estatísticas de uso no aplicativo, alterar o seu consentimento para anúncios ou a sua escolha sobre rastreamento e excluir todos os dados armazenados localmente excluindo o aplicativo.","Dependendo de onde você mora (por exemplo, nos termos do RGPD, do UK GDPR, da KVKK da Turquia ou da CCPA da Califórnia), você pode ter o direito de acessar, corrigir ou excluir dados pessoais e de se opor ao seu tratamento. Como não mantemos dados que identifiquem você, a maioria das solicitações pode ser atendida com as opções acima; você também pode entrar em contato conosco pelo endereço abaixo."]},{"h":"9. Alterações nesta política","p":["Podemos atualizar esta política quando o aplicativo mudar. A data no topo indica a versão mais recente."]},{"h":"10. Contato e suporte","p":["Em caso de dúvidas sobre esta política, para obter ajuda com o aplicativo ou em caso de problemas com uma compra, escreva para miswakapp@gmail.com."]}],"langLabel":"Idioma","supportTitle":"Suporte","supportText":"Precisa de ajuda com o Qibora ou com uma compra? Envie um e-mail para miswakapp@gmail.com — normalmente respondemos em poucos dias."},"nl":{"langName":"Nederlands","title":"Qibora – Privacybeleid","updated":"Laatst bijgewerkt: 24 oktober 2026","intro":"Qibora (‘de app’) helpt u de qiblarichting en moskeeën in de buurt te vinden. In dit beleid leggen wij uit welke informatie de app gebruikt, waar die naartoe gaat en welke keuzes u hebt. Kort gezegd: de qibla wordt op uw telefoon berekend, wij beheren geen servers die uw locatie opslaan en wij verkopen uw persoonsgegevens niet.","sections":[{"h":"1. Uw locatie","p":["De app vraagt alleen om uw locatie terwijl u de app gebruikt. Uw locatie wordt op uw telefoon gebruikt om de qiblarichting en de afstand tot de Kaaba te berekenen. Uw locatie wordt niet naar onze servers verzonden en wij slaan deze niet op.","Wanneer u het kaartscherm opent om moskeeën in de buurt te bekijken, stuurt de app een benaderde locatie, afgerond op ongeveer 1 km, naar de gratis dienst OpenStreetMap Overpass (overpass-api.de, of overpass.kumi.systems als reserve) om moskeeën in uw omgeving op te zoeken. Aan dit verzoek wordt geen naam, account of apparaat-ID gekoppeld. Moskeegegevens © OpenStreetMap-bijdragers, beschikbaar onder de ODbL-licentie.","De kaart zelf wordt weergegeven door de kaartdienst van uw telefoon (Apple Maps op de iPhone, Google Maps op Android), waarop het eigen privacybeleid van Apple of Google van toepassing is."]},{"h":"2. Camera","p":["De camera wordt alleen gebruikt op het AR-scherm, om de qiblarichting over het live camerabeeld weer te geven. Beelden worden in realtime op uw telefoon verwerkt; er wordt niets opgenomen, opgeslagen of geüpload."]},{"h":"3. Informatie die op uw telefoon wordt opgeslagen","p":["Uw instellingen (gekozen ontwerp, thema, tekstgrootte, laatst gebruikte scherm en vergelijkbare voorkeuren) worden alleen op uw telefoon opgeslagen. Als u de app verwijdert, worden ze ook verwijderd."]},{"h":"4. Anonieme gebruiksstatistieken","p":["Om te begrijpen welke functies worden gebruikt en om problemen op te lossen, stuurt de app anonieme gebruiksgebeurtenissen (bijvoorbeeld: welk scherm is geopend, of de qibla is gevonden, de appversie en het apparaattype) naar PostHog, dat wordt gehost op servers in de Europese Unie. Deze gebeurtenissen bevatten niet uw naam, uw locatie of camerabeelden. Zoals bij elke internetverbinding kan uw IP-adres door de dienst worden verwerkt, bijvoorbeeld om het land te schatten.","U kunt dit op elk moment uitschakelen via Instellingen → ‘Gebruiksstatistieken’."]},{"h":"5. Advertenties","p":["De gratis versie van Qibora toont advertenties van Google AdMob. Google kan de advertentie-ID van uw apparaat en vergelijkbare informatie gebruiken om advertenties weer te geven en te meten en, met uw toestemming, om ze te personaliseren.","Op de iPhone worden gepersonaliseerde advertenties alleen gebruikt als u tracking toestaat wanneer de app daarom vraagt. In de Europese Economische Ruimte, het Verenigd Koninkrijk en Zwitserland kunt u in een toestemmingsvenster kiezen hoe uw gegevens voor advertenties worden gebruikt. U kunt uw advertentie-ID ook opnieuw instellen of beperken in de instellingen van uw telefoon.","Advertenties worden gefilterd zodat ze geschikt zijn voor een algemeen publiek. Meer informatie: https://policies.google.com/technologies/ads","Qibora Pro verwijdert alle advertenties."]},{"h":"6. Aankopen","p":["Qibora Pro wordt verkocht via de App Store of Google Play. Betalingen worden volledig door Apple of Google afgehandeld; wij zien uw kaart- of betalingsgegevens nooit.","Om te bevestigen welke aankopen u bezit en om deze te herstellen, gebruikt de app RevenueCat, dat een anonieme gebruikers-ID van de app en uw aankoopbewijzen uit de store ontvangt. RevenueCat ontvangt uw naam en betalingsgegevens niet."]},{"h":"7. Kinderen","p":["Qibora is een app voor een algemeen publiek en is niet gericht op kinderen jonger dan 13 jaar. Wij verzamelen niet bewust persoonsgegevens van kinderen."]},{"h":"8. Uw keuzes en rechten","p":["U kunt de toestemming voor locatie en camera weigeren of intrekken in de instellingen van uw telefoon (zonder locatie kan de app de qibla niet vinden), de gebruiksstatistieken in de app uitschakelen, uw toestemming voor advertenties of uw trackingkeuze wijzigen en alle lokaal opgeslagen gegevens wissen door de app te verwijderen.","Afhankelijk van waar u woont (bijvoorbeeld op grond van de AVG, de UK GDPR, de Turkse KVKK of de Californische CCPA) hebt u mogelijk het recht om persoonsgegevens in te zien, te laten corrigeren of te laten verwijderen en om bezwaar te maken tegen de verwerking ervan. Omdat wij geen gegevens bewaren waarmee u kunt worden geïdentificeerd, kunnen de meeste verzoeken worden afgehandeld met de bovenstaande opties; u kunt ook contact met ons opnemen via het onderstaande adres."]},{"h":"9. Wijzigingen in dit beleid","p":["Wij kunnen dit beleid bijwerken wanneer de app verandert. De datum bovenaan geeft de meest recente versie aan."]},{"h":"10. Contact en ondersteuning","p":["Voor vragen over dit beleid, hulp bij de app of problemen met een aankoop kunt u ons schrijven via miswakapp@gmail.com."]}],"langLabel":"Taal","supportTitle":"Ondersteuning","supportText":"Hulp nodig met Qibora of een aankoop? Stuur ons een e-mail via miswakapp@gmail.com – wij reageren meestal binnen enkele dagen."},"it":{"langName":"Italiano","title":"Qibora – Informativa sulla privacy","updated":"Ultimo aggiornamento: 24 ottobre 2026","intro":"Qibora («l’app») la aiuta a trovare la direzione della qibla e le moschee nelle vicinanze. La presente informativa spiega quali informazioni utilizza l’app, dove vengono inviate e quali scelte ha a disposizione. In breve: la qibla viene calcolata sul suo telefono, non gestiamo server che memorizzano la sua posizione e non vendiamo i suoi dati personali.","sections":[{"h":"1. La sua posizione","p":["L’app richiede la sua posizione solo mentre la utilizza. La posizione viene usata sul suo telefono per calcolare la direzione della qibla e la distanza dalla Kaaba. Non viene inviata ai nostri server e non la memorizziamo.","Quando apre la schermata Mappa per vedere le moschee nelle vicinanze, l’app invia una posizione approssimativa, arrotondata a circa 1 km, al servizio gratuito OpenStreetMap Overpass (overpass-api.de oppure, in alternativa, overpass.kumi.systems) per cercare le moschee intorno a lei. A questa richiesta non viene associato alcun nome, account o identificativo del dispositivo. Dati sulle moschee © collaboratori di OpenStreetMap, disponibili con licenza ODbL.","La mappa vera e propria viene visualizzata dal servizio di mappe del suo telefono (Apple Maps su iPhone, Google Maps su Android), soggetto all’informativa sulla privacy di Apple o di Google."]},{"h":"2. Fotocamera","p":["La fotocamera viene utilizzata solo nella schermata AR, per mostrare la direzione della qibla sull’immagine in diretta della fotocamera. Le immagini vengono elaborate sul suo telefono in tempo reale; nulla viene registrato, salvato o caricato."]},{"h":"3. Informazioni memorizzate sul suo telefono","p":["Le sue impostazioni (design scelto, tema, dimensione del testo, ultima schermata utilizzata e preferenze simili) vengono memorizzate solo sul suo telefono. Eliminando l’app, vengono eliminate anche queste."]},{"h":"4. Statistiche di utilizzo anonime","p":["Per capire quali funzioni vengono utilizzate e per risolvere eventuali problemi, l’app invia eventi di utilizzo anonimi (ad esempio: quale schermata è stata aperta, se la qibla è stata trovata, la versione dell’app e il tipo di dispositivo) a PostHog, ospitato su server nell’Unione europea. Questi eventi non includono il suo nome, la sua posizione né immagini della fotocamera. Come per qualsiasi connessione a internet, il suo indirizzo IP può essere trattato dal servizio, ad esempio per stimare il paese.","Può disattivare questa funzione in qualsiasi momento in Impostazioni → «Statistiche di utilizzo»."]},{"h":"5. Pubblicità","p":["La versione gratuita di Qibora mostra annunci forniti da Google AdMob. Google può utilizzare l’identificativo pubblicitario del suo dispositivo e informazioni simili per mostrare e misurare gli annunci e, con la sua autorizzazione, per personalizzarli.","Su iPhone, gli annunci personalizzati vengono utilizzati solo se consente il tracciamento quando l’app lo richiede. Nello Spazio economico europeo, nel Regno Unito e in Svizzera, una finestra di consenso le permette di scegliere come vengono utilizzati i suoi dati per la pubblicità. Può inoltre reimpostare o limitare il suo identificativo pubblicitario nelle impostazioni del telefono.","Gli annunci sono filtrati in modo da essere adatti a un pubblico generico. Maggiori informazioni: https://policies.google.com/technologies/ads","Qibora Pro rimuove tutti gli annunci."]},{"h":"6. Acquisti","p":["Qibora Pro è venduto tramite l’App Store o Google Play. I pagamenti sono gestiti interamente da Apple o Google; non vediamo mai i dati della sua carta o di pagamento.","Per verificare quali acquisti possiede e per ripristinarli, l’app utilizza RevenueCat, che riceve un ID utente anonimo dell’app e le ricevute dei suoi acquisti nello store. RevenueCat non riceve il suo nome né i suoi dati di pagamento."]},{"h":"7. Bambini","p":["Qibora è un’app destinata a un pubblico generico e non è rivolta ai bambini di età inferiore a 13 anni. Non raccogliamo consapevolmente informazioni personali dai bambini."]},{"h":"8. Le sue scelte e i suoi diritti","p":["Può negare o revocare l’autorizzazione alla posizione e alla fotocamera nelle impostazioni del telefono (senza la posizione l’app non potrà trovare la qibla), disattivare le statistiche di utilizzo nell’app, modificare il consenso agli annunci o la scelta relativa al tracciamento ed eliminare tutti i dati memorizzati localmente eliminando l’app.","A seconda del luogo in cui risiede (ad esempio ai sensi del GDPR, dello UK GDPR, della KVKK turca o del CCPA californiano), potrebbe avere il diritto di accedere ai dati personali, rettificarli o cancellarli e di opporsi al loro trattamento. Poiché non conserviamo dati che la identifichino, la maggior parte delle richieste può essere soddisfatta con le opzioni sopra indicate; può anche contattarci all’indirizzo riportato di seguito."]},{"h":"9. Modifiche alla presente informativa","p":["Potremmo aggiornare la presente informativa in caso di modifiche all’app. La data in alto indica la versione più recente."]},{"h":"10. Contatti e assistenza","p":["Per domande sulla presente informativa, per ricevere aiuto con l’app o per problemi relativi a un acquisto, ci scriva all’indirizzo miswakapp@gmail.com."]}],"langLabel":"Lingua","supportTitle":"Assistenza","supportText":"Ha bisogno di aiuto con Qibora o con un acquisto? Ci scriva a miswakapp@gmail.com: di solito rispondiamo entro pochi giorni."},"ru":{"langName":"Русский","title":"Qibora – Политика конфиденциальности","updated":"Последнее обновление: 24 октября 2026 г.","intro":"Qibora («приложение») помогает определить направление киблы и найти ближайшие мечети. В настоящей политике описано, какую информацию использует приложение, куда она передаётся и какой у вас есть выбор. Вкратце: кибла рассчитывается на вашем телефоне, у нас нет серверов, на которых хранилось бы ваше местоположение, и мы не продаём ваши персональные данные.","sections":[{"h":"1. Ваше местоположение","p":["Приложение запрашивает доступ к вашему местоположению только во время его использования. Местоположение используется на вашем телефоне для расчёта направления киблы и расстояния до Каабы. Оно не передаётся на наши серверы, и мы его не храним.","Когда вы открываете экран «Карта», чтобы увидеть ближайшие мечети, приложение отправляет приблизительное местоположение, округлённое примерно до 1 км, в бесплатный сервис OpenStreetMap Overpass (overpass-api.de или, в качестве резервного, overpass.kumi.systems) для поиска мечетей поблизости. К этому запросу не прилагаются ни имя, ни учётная запись, ни идентификатор устройства. Данные о мечетях © участники OpenStreetMap, доступны по лицензии ODbL.","Сама карта отображается картографическим сервисом вашего телефона (Apple Maps на iPhone, Google Maps на Android), на который распространяется собственная политика конфиденциальности Apple или Google."]},{"h":"2. Камера","p":["Камера используется только на экране AR, чтобы показывать направление киблы поверх живого изображения с камеры. Изображения обрабатываются на вашем телефоне в режиме реального времени; ничего не записывается, не сохраняется и не загружается."]},{"h":"3. Информация, хранящаяся на вашем телефоне","p":["Ваши настройки (выбранный дизайн, тема, размер текста, последний открытый экран и аналогичные параметры) хранятся только на вашем телефоне. При удалении приложения они также удаляются."]},{"h":"4. Анонимная статистика использования","p":["Чтобы понимать, какие функции используются, и устранять неполадки, приложение отправляет анонимные события использования (например: какой экран был открыт, была ли найдена кибла, версия приложения и тип устройства) в сервис PostHog, размещённый на серверах в Европейском союзе. Эти события не содержат вашего имени, местоположения или изображений с камеры. Как и при любом подключении к интернету, сервис может обрабатывать ваш IP-адрес, например для определения страны.","Вы можете в любой момент отключить эту функцию в разделе Настройки → «Статистика использования»."]},{"h":"5. Реклама","p":["Бесплатная версия Qibora показывает рекламу, предоставляемую Google AdMob. Google может использовать рекламный идентификатор вашего устройства и аналогичную информацию для показа рекламы и оценки её эффективности, а также, с вашего разрешения, для её персонализации.","На iPhone персонализированная реклама используется только в том случае, если вы разрешите отслеживание, когда приложение запросит об этом. В Европейской экономической зоне, Великобритании и Швейцарии окно согласия позволяет вам выбрать, как ваши данные используются для рекламы. Вы также можете сбросить или ограничить рекламный идентификатор в настройках телефона.","Реклама фильтруется так, чтобы она подходила для широкой аудитории. Подробнее: https://policies.google.com/technologies/ads","Qibora Pro убирает всю рекламу."]},{"h":"6. Покупки","p":["Qibora Pro продаётся через App Store или Google Play. Платежи полностью обрабатываются Apple или Google; мы никогда не видим данные вашей карты или иные платёжные данные.","Чтобы подтвердить, какие покупки вам принадлежат, и восстановить их, приложение использует RevenueCat, который получает анонимный идентификатор пользователя приложения и чеки ваших покупок из магазина приложений. Он не получает ваше имя или платёжные данные."]},{"h":"7. Дети","p":["Qibora — приложение для широкой аудитории, не предназначенное для детей младше 13 лет. Мы сознательно не собираем персональную информацию детей."]},{"h":"8. Ваш выбор и права","p":["Вы можете отклонить или отозвать разрешение на доступ к местоположению и камере в настройках телефона (без местоположения приложение не сможет определить киблу), отключить статистику использования в приложении, изменить согласие на рекламу или выбор в отношении отслеживания, а также удалить все локально сохранённые данные, удалив приложение.","В зависимости от места вашего проживания (например, в соответствии с GDPR, UK GDPR, турецким законом KVKK или калифорнийским законом CCPA) у вас может быть право на доступ к персональным данным, их исправление или удаление, а также право возражать против их обработки. Поскольку мы не храним данные, позволяющие установить вашу личность, большинство запросов можно выполнить с помощью перечисленных выше возможностей; вы также можете связаться с нами по указанному ниже адресу."]},{"h":"9. Изменения настоящей политики","p":["Мы можем обновлять эту политику при изменении приложения. Дата вверху страницы указывает на последнюю версию."]},{"h":"10. Контакты и поддержка","p":["По вопросам, касающимся этой политики, за помощью с приложением или при проблемах с покупкой пишите нам на miswakapp@gmail.com."]}],"langLabel":"Язык","supportTitle":"Поддержка","supportText":"Нужна помощь с Qibora или с покупкой? Напишите нам на miswakapp@gmail.com — обычно мы отвечаем в течение нескольких дней."},"ku":{"langName":"Kurdî (Kurmancî)","title":"Qibora – Polîtîkaya Nepeniyê","updated":"Nûkirina dawî: 24 Cotmeh 2026","intro":"Qibora (“sepan”) ji we re dibe alîkar ku hûn rêya qibleyê û mizgeftên nêzîk bibînin. Ev polîtîka rave dike ka sepan kîjan agahiyan bi kar tîne, ew diçin ku derê û hilbijartinên we çi ne. Bi kurtî: qible li ser telefona we tê hesabkirin, serverên me yên ku cihê we tomar dikin tune ne û em daneyên we yên kesane nafiroşin.","sections":[{"h":"1. Cihê we","p":["Sepan tenê dema ku hûn wê bi kar tînin destûra cihê we dixwaze. Cihê we li ser telefona we tê bikaranîn da ku rêya qibleyê û dûrahiya heta Kabeyê were hesabkirin. Ew ji serverên me re nayê şandin û em wê tomar nakin.","Dema ku hûn ekrana Nexşeyê vedikin da ku mizgeftên nêzîk bibînin, sepan ji bo lêgerîna mizgeftên derdora we cihekî texmînî, ku bi qasî 1 km hatiye girovkirin, dişîne karûbarê belaş ê OpenStreetMap Overpass (overpass-api.de, an jî wekî yedek overpass.kumi.systems). Bi vê daxwazê re tu nav, hesab an nasnameya cîhazê nayê girêdan. Daneyên mizgeftan © beşdarên OpenStreetMap, di bin lîsansa ODbL de berdest in.","Nexşe bixwe ji aliyê karûbarê nexşeyê yê telefona we ve tê nîşandan (li ser iPhone Apple Maps, li ser Android Google Maps), ku girêdayî polîtîkaya nepeniyê ya Apple an Google bixwe ye."]},{"h":"2. Kamera","p":["Kamera tenê li ser ekrana AR tê bikaranîn, da ku rêya qibleyê li ser dîmena zindî ya kamerayê were nîşandan. Wêne di wextê rast de li ser telefona we têne pêvajokirin; tu tişt nayê qeydkirin, tomarkirin an barkirin."]},{"h":"3. Agahiyên ku li ser telefona we têne tomarkirin","p":["Mîhengên we (dîzayna hilbijartî, tema, mezinahiya nivîsê, ekrana dawî ya hatî bikaranîn û vebijarkên bi vî rengî) tenê li ser telefona we têne tomarkirin. Dema ku hûn sepanê jê bibin, ew jî têne jêbirin."]},{"h":"4. Statîstîkên bikaranînê yên bênav","p":["Ji bo fêmkirina ka kîjan taybetmendî têne bikaranîn û ji bo çareserkirina pirsgirêkan, sepan bûyerên bikaranînê
