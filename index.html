yên bênav (wek mînak: kîjan ekran hat vekirin, gelo qible hat dîtin an na, guhertoya sepanê û cureyê cîhazê) dişîne PostHog, ku li ser serverên li Yekîtiya Ewropayê tê mêvandarîkirin. Di van bûyeran de navê we, cihê we an wêneyên kamerayê tune ne. Wekî di her girêdana înternetê de, dibe ku navnîşana we ya IP ji aliyê karûbarê ve were pêvajokirin, wek mînak ji bo texmînkirina welêt.","Hûn dikarin vê yekê her dem di Mîheng → “Statîstîkên bikaranînê” de neçalak bikin."]},{"h":"5. Reklam","p":["Guhertoya belaş a Qibora reklamên ku ji aliyê Google AdMob ve têne peydakirin nîşan dide. Dibe ku Google nasnameya reklamê ya cîhaza we û agahiyên bi vî rengî bi kar bîne da ku reklaman nîşan bide û bipîve, û bi destûra we, da ku wan ji we re kesane bike.","Li ser iPhone, reklamên kesanekirî tenê têne bikaranîn eger hûn dema ku sepan ji we dipirse destûra şopandinê bidin. Li Herêma Aborî ya Ewropayê, Keyaniya Yekbûyî û Swîsreyê, pencereyeke razîbûnê dihêle ku hûn hilbijêrin ka daneyên we çawa ji bo reklaman têne bikaranîn. Herwiha hûn dikarin nasnameya xwe ya reklamê di mîhengên telefona xwe de ji nû ve saz bikin an sînordar bikin.","Reklam têne parzûnkirin da ku ji bo raya giştî guncav bin. Agahiyên zêdetir: https://policies.google.com/technologies/ads","Qibora Pro hemû reklaman radike."]},{"h":"6. Kirîn","p":["Qibora Pro bi rêya App Store an Google Play tê firotin. Dayîn bi tevahî ji aliyê Apple an Google ve tê birêvebirin; em qet agahiyên karta we an yên dayînê nabînin.","Ji bo piştrastkirina ka kîjan kirînên we hene û ji bo vegerandina wan, sepan RevenueCat bi kar tîne, ku nasnameyeke bênav a bikarhênerê sepanê û belgeyên kirînên we yên ji firotgehê distîne. Ew navê we an agahiyên dayînê nastîne."]},{"h":"7. Zarok","p":["Qibora sepaneke ji bo raya giştî ye û ne ji bo zarokên di bin 13 saliyê de ye. Em bi zanebûn agahiyên kesane ji zarokan berhev nakin."]},{"h":"8. Hilbijartin û mafên we","p":["Hûn dikarin di mîhengên telefona xwe de destûra cih û kamerayê red bikin an paşde bistînin (bêyî cih sepan nikare qibleyê bibîne), di sepanê de statîstîkên bikaranînê neçalak bikin, razîbûna xwe ya reklamê an hilbijartina xwe ya şopandinê biguherînin, û bi jêbirina sepanê hemû daneyên ku li ser telefonê hatine tomarkirin jê bibin.","Li gorî cihê ku hûn lê dijîn (wek mînak li gorî GDPR, UK GDPR, KVKK ya Tirkiyeyê an CCPA ya Kalîforniyayê), dibe ku mafê we hebe ku hûn xwe bigihînin daneyên kesane, wan rast bikin an jê bibin û li dijî pêvajokirina wan îtiraz bikin. Ji ber ku daneyên ku we didin naskirin li cem me tune ne, piraniya daxwazan bi vebijarkên li jor dikarin bên bicihanîn; herwiha hûn dikarin bi navnîşana li jêr bi me re têkilî daynin."]},{"h":"9. Guhertinên di vê polîtîkayê de","p":["Dibe ku em vê polîtîkayê nû bikin dema ku sepan biguhere. Dîroka li jor guhertoya herî dawî nîşan dide."]},{"h":"10. Têkilî û piştgirî","p":["Ji bo pirsên li ser vê polîtîkayê, alîkariya bi sepanê re an pirsgirêkên bi kirînê re, li miswakapp@gmail.com ji me re binivîsin."]}],"langLabel":"Ziman","supportTitle":"Piştgirî","supportText":"Ji bo Qibora an kirînekê hewcedarê alîkariyê ne? Ji me re li miswakapp@gmail.com e-nameyekê bişînin — em bi gelemperî di nav çend rojan de bersiv didin."},"ckb":{"langName":"کوردی (سۆرانی)","title":"Qibora – سیاسەتی تایبەتمەندی","updated":"دوایین نوێکردنەوە: ٢٤ی ئۆکتۆبەری ٢٠٢٦","intro":"Qibora («ئەپەکە») یارمەتیت دەدات ئاراستەی قیبلە و مزگەوتە نزیکەکان بدۆزیتەوە. ئەم سیاسەتە ڕوونی دەکاتەوە کە ئەپەکە چ زانیارییەک بەکاردەهێنێت، ئەو زانیارییانە بۆ کوێ دەچن و چ بژاردەیەکت هەیە. بە کورتی: قیبلە لەسەر مۆبایلەکەت هەژمار دەکرێت، ئێمە هیچ ڕاژەکارێک بەڕێوە نابەین کە شوێنەکەت هەڵبگرێت، و داتا کەسییەکانت نافرۆشین.","sections":[{"h":"١. شوێنەکەت","p":["ئەپەکە تەنها لە کاتی بەکارهێنانیدا داوای مۆڵەتی دەستگەیشتن بە شوێنەکەت دەکات. شوێنەکەت لەسەر مۆبایلەکەت بۆ هەژمارکردنی ئاراستەی قیبلە و دووری تا کەعبە بەکاردەهێنرێت. ئەم زانیارییە بۆ ڕاژەکارەکانمان نانێردرێت و ئێمە هەڵی ناگرین.","کاتێک شاشەی نەخشە دەکەیتەوە بۆ بینینی مزگەوتە نزیکەکان، ئەپەکە شوێنێکی نزیکەیی، کە بۆ نزیکەی ١ کیلۆمەتر خڕ کراوەتەوە، دەنێرێت بۆ خزمەتگوزاریی بێبەرامبەری OpenStreetMap Overpass (overpass-api.de، یان overpass.kumi.systems وەک یەدەگ) بۆ گەڕان بەدوای مزگەوتەکانی دەوروبەرت. هیچ ناو، هەژمار یان ناسێنەرێکی ئامێر بەم داواکارییەوە نالکێنرێت. داتای مزگەوتەکان © بەشداربووانی OpenStreetMap، لەژێر مۆڵەتی ODbL بەردەستە.","نەخشەکە خۆی لەلایەن خزمەتگوزاریی نەخشەی مۆبایلەکەتەوە پیشان دەدرێت (Apple Maps لەسەر iPhone، Google Maps لەسەر Android)، کە بەپێی سیاسەتی تایبەتمەندیی خودی Apple یان Google کار دەکات."]},{"h":"٢. کامێرا","p":["کامێرا تەنها لە شاشەی AR بەکاردەهێنرێت، بۆ پیشاندانی ئاراستەی قیبلە لەسەر دیمەنی ڕاستەوخۆی کامێراکە. وێنەکان لەسەر مۆبایلەکەت لە کاتی ڕاستەقینەدا پرۆسێس دەکرێن؛ هیچ شتێک تۆمار ناکرێت، پاشەکەوت ناکرێت و بار ناکرێت."]},{"h":"٣. ئەو زانیارییانەی لەسەر مۆبایلەکەت هەڵدەگیرێن","p":["ڕێکخستنەکانت (دیزاینی هەڵبژێردراو، ڕووکار، قەبارەی دەق، دوایین شاشەی بەکارهاتوو و هەڵبژاردە هاوشێوەکان) تەنها لەسەر مۆبایلەکەت هەڵدەگیرێن. بە سڕینەوەی ئەپەکە ئەوانیش دەسڕێنەوە."]},{"h":"٤. ئاماری بەکارهێنانی بێناو","p":["بۆ تێگەیشتن لەوەی کام تایبەتمەندییەکان بەکاردەهێنرێن و بۆ چارەسەرکردنی کێشەکان، ئەپەکە ڕووداوی بەکارهێنانی بێناو (بۆ نموونە: کام شاشە کرایەوە، ئایا قیبلە دۆزرایەوە یان نا، وەشانی ئەپەکە و جۆری ئامێر) دەنێرێت بۆ PostHog، کە لەسەر ڕاژەکارگەلێک لە یەکێتیی ئەوروپا میوانداری دەکرێت. ئەم ڕووداوانە ناو، شوێن یان وێنەی کامێراکەت لەخۆ ناگرن. وەک هەر پەیوەندییەکی ئینتەرنێت، لەوانەیە ناونیشانی IPی تۆ لەلایەن ئەم خزمەتگوزارییەوە پرۆسێس بکرێت، بۆ نموونە بۆ خەمڵاندنی وڵات.","دەتوانیت هەر کاتێک لە ڕێکخستنەکان ← «ئاماری بەکارهێنان» ئەمە بکوژێنیتەوە."]},{"h":"٥. ڕیکلام","p":["وەشانی بێبەرامبەری Qibora ئەو ڕیکلامانە پیشان دەدات کە Google AdMob دابینیان دەکات. لەوانەیە Google ناسێنەری ڕیکلامی ئامێرەکەت و زانیاریی هاوشێوە بەکاربهێنێت بۆ پیشاندان و پێوانەکردنی ڕیکلامەکان، و بە ڕەزامەندیی تۆ، بۆ کەسیکردنیان.","لەسەر iPhone، ڕیکلامی کەسیکراو تەنها کاتێک بەکاردەهێنرێت کە ڕێگە بە بەدواداچوون بدەیت لەو کاتەی ئەپەکە داوات لێدەکات. لە ناوچەی ئابووریی ئەوروپا، شانشینی یەکگرتوو و سویسرا، پەنجەرەیەکی ڕەزامەندی ڕێگەت پێدەدات هەڵبژێریت داتاکانت چۆن بۆ ڕیکلام بەکاربهێنرێن. هەروەها دەتوانیت لە ڕێکخستنەکانی مۆبایلەکەتدا ناسێنەری ڕیکلامەکەت ڕیسێت بکەیت یان سنووردار بکەیت.","ڕیکلامەکان پاڵاوتن دەکرێن بۆ ئەوەی گونجاو بن بۆ بەکارهێنەرانی گشتی. زانیاریی زیاتر: https://policies.google.com/technologies/ads","Qibora Pro هەموو ڕیکلامەکان لادەبات."]},{"h":"٦. کڕینەکان","p":["Qibora Pro لە ڕێگەی App Store یان Google Play دەفرۆشرێت. پارەدانەکان بە تەواوی لەلایەن Apple یان Google جێبەجێ دەکرێن؛ ئێمە هەرگیز زانیاریی کارت یان وردەکاریی پارەدانەکەت نابینین.","بۆ پشتڕاستکردنەوەی ئەو کڕینانەی کە هی تۆن و گەڕاندنەوەیان، ئەپەکە RevenueCat بەکاردەهێنێت، کە ناسنامەیەکی (ID) بێناوی بەکارهێنەری ئەپ و پسوولەکانی کڕینت لە فرۆشگاوە وەردەگرێت. ناو یان وردەکاریی پارەدانەکەت وەرناگرێت."]},{"h":"٧. منداڵان","p":["Qibora ئەپێکە بۆ بەکارهێنەرانی گشتی و ئاراستەی منداڵانی خوار تەمەنی ١٣ ساڵ نەکراوە. ئێمە بە زانینەوە زانیاریی کەسی لە منداڵان کۆ ناکەینەوە."]},{"h":"٨. بژاردە و مافەکانت","p":["دەتوانیت لە ڕێکخستنەکانی مۆبایلەکەتدا مۆڵەتی شوێن و کامێرا ڕەت بکەیتەوە یان بیکشێنیتەوە (بەبێ شوێن، ئەپەکە ناتوانێت قیبلە بدۆزێتەوە)، ئاماری بەکارهێنان لەناو ئەپەکەدا بکوژێنیتەوە، ڕەزامەندیی ڕیکلام یان هەڵبژاردنی بەدواداچوونەکەت بگۆڕیت، و بە سڕینەوەی ئەپەکە هەموو ئەو داتایانەی بە شێوەی ناوخۆیی هەڵگیراون بسڕیتەوە.","بەپێی ئەو شوێنەی تێیدا دەژیت (بۆ نموونە بەپێی GDPR، UK GDPR، یاسای KVKKی تورکیا یان یاسای CCPAی کالیفۆرنیا)، لەوانەیە مافی دەستگەیشتن بە داتا کەسییەکان، ڕاستکردنەوە یان سڕینەوەیانت هەبێت، هەروەها مافی ناڕەزایی دەربڕین بەرامبەر بە پرۆسێسکردنیان. لەبەر ئەوەی ئێمە هیچ داتایەک هەڵناگرین کە ناسنامەی تۆ دیاری بکات، زۆربەی داواکارییەکان دەکرێت بە بژاردەکانی سەرەوە جێبەجێ بکرێن؛ هەروەها دەتوانیت لە ڕێگەی ئەو ناونیشانەی خوارەوە پەیوەندیمان پێوە بکەیت."]},{"h":"٩. گۆڕانکاری لەم سیاسەتەدا","p":["لەوانەیە ئەم سیاسەتە نوێ بکەینەوە کاتێک ئەپەکە دەگۆڕدرێت. ئەو مێژووەی لە سەرەوەیە دوایین وەشان پیشان دەدات."]},{"h":"١٠. پەیوەندی و پشتگیری","p":["بۆ پرسیار دەربارەی ئەم سیاسەتە، یارمەتی لە بەکارهێنانی ئەپەکە، یان کێشەکانی کڕین، بە ناونیشانی miswakapp@gmail.com بۆمان بنووسە."]}],"langLabel":"زمان","supportTitle":"پشتگیری","supportText":"پێویستت بە یارمەتییە دەربارەی Qibora یان کڕینێک؟ ئیمەیڵمان بۆ بنێرە بۆ miswakapp@gmail.com — بە زۆری لە ماوەی چەند ڕۆژێکدا وەڵام دەدەینەوە."},"ml":{"langName":"മലയാളം","title":"Qibora – സ്വകാര്യതാ നയം","updated":"അവസാനം പുതുക്കിയത്: 2026 ഒക്ടോബർ 24","intro":"ഖിബ്‌ലയുടെ ദിശയും സമീപത്തുള്ള മസ്ജിദുകളും കണ്ടെത്താൻ Qibora (“ആപ്പ്”) നിങ്ങളെ സഹായിക്കുന്നു. ആപ്പ് ഏതെല്ലാം വിവരങ്ങൾ ഉപയോഗിക്കുന്നു, അവ എവിടേക്ക് പോകുന്നു, നിങ്ങൾക്കുള്ള തിരഞ്ഞെടുപ്പുകൾ എന്തൊക്കെ എന്നിവ ഈ നയം വിശദീകരിക്കുന്നു. ചുരുക്കത്തിൽ: ഖിബ്‌ല കണക്കാക്കുന്നത് നിങ്ങളുടെ ഫോണിൽ തന്നെയാണ്, നിങ്ങളുടെ ലൊക്കേഷൻ സൂക്ഷിക്കുന്ന സെർവറുകളൊന്നും ഞങ്ങൾ പ്രവർത്തിപ്പിക്കുന്നില്ല, നിങ്ങളുടെ വ്യക്തിഗത ഡാറ്റ ഞങ്ങൾ വിൽക്കുന്നുമില്ല.","sections":[{"h":"1. നിങ്ങളുടെ ലൊക്കേഷൻ","p":["നിങ്ങൾ ആപ്പ് ഉപയോഗിക്കുമ്പോൾ മാത്രമാണ് ആപ്പ് നിങ്ങളുടെ ലൊക്കേഷൻ ആവശ്യപ്പെടുന്നത്. ഖിബ്‌ലയുടെ ദിശയും കഅ്ബയിലേക്കുള്ള ദൂരവും കണക്കാക്കാൻ നിങ്ങളുടെ ലൊക്കേഷൻ ഫോണിൽ തന്നെയാണ് ഉപയോഗിക്കുന്നത്. അത് ഞങ്ങളുടെ സെർവറുകളിലേക്ക് അയയ്ക്കുന്നില്ല, ഞങ്ങൾ അത് സൂക്ഷിക്കുന്നുമില്ല.","സമീപത്തുള്ള മസ്ജിദുകൾ കാണാൻ നിങ്ങൾ മാപ്പ് സ്ക്രീൻ തുറക്കുമ്പോൾ, ചുറ്റുമുള്ള മസ്ജിദുകൾ കണ്ടെത്തുന്നതിനായി, ഏകദേശം 1 കി.മീ.യിലേക്ക് റൗണ്ട് ചെയ്ത ഒരു ഏകദേശ ലൊക്കേഷൻ ആപ്പ് സൗജന്യ OpenStreetMap Overpass സേവനത്തിലേക്ക് (overpass-api.de, അല്ലെങ്കിൽ ബാക്കപ്പായി overpass.kumi.systems) അയയ്ക്കുന്നു. ഈ അഭ്യർത്ഥനയോടൊപ്പം പേരോ അക്കൗണ്ടോ ഉപകരണ ഐഡന്റിഫയറോ ചേർക്കുന്നില്ല. മസ്ജിദ് ഡാറ്റ © OpenStreetMap സംഭാവകർ, ODbL ലൈസൻസിന് കീഴിൽ ലഭ്യമാണ്.","മാപ്പ് തന്നെ പ്രദർശിപ്പിക്കുന്നത് നിങ്ങളുടെ ഫോണിന്റെ മാപ്പ് സേവനമാണ് (iPhone-ൽ Apple Maps, Android-ൽ Google Maps); അതിന് Apple-ന്റെയോ Google-ന്റെയോ സ്വന്തം സ്വകാര്യതാ നയം ബാധകമാണ്."]},{"h":"2. ക്യാമറ","p":["ലൈവ് ക്യാമറ ദൃശ്യത്തിന് മുകളിൽ ഖിബ്‌ലയുടെ ദിശ കാണിക്കുന്നതിനായി AR സ്ക്രീനിൽ മാത്രമാണ് ക്യാമറ ഉപയോഗിക്കുന്നത്. ചിത്രങ്ങൾ നിങ്ങളുടെ ഫോണിൽ തത്സമയം പ്രോസസ്സ് ചെയ്യപ്പെടുന്നു; ഒന്നും റെക്കോർഡ് ചെയ്യുകയോ സേവ് ചെയ്യുകയോ അപ്‌ലോഡ് ചെയ്യുകയോ ചെയ്യുന്നില്ല."]},{"h":"3. നിങ്ങളുടെ ഫോണിൽ സൂക്ഷിക്കുന്ന വിവരങ്ങൾ","p":["നിങ്ങളുടെ ക്രമീകരണങ്ങൾ (തിരഞ്ഞെടുത്ത ഡിസൈൻ, തീം, ടെക്സ്റ്റ് വലുപ്പം, അവസാനം ഉപയോഗിച്ച സ്ക്രീൻ, സമാനമായ മുൻഗണനകൾ) നിങ്ങളുടെ ഫോണിൽ മാത്രമാണ് സൂക്ഷിക്കുന്നത്. ആപ്പ് ഡിലീറ്റ് ചെയ്യുമ്പോൾ അവയും ഇല്ലാതാകും."]},{"h":"4. അജ്ഞാത ഉപയോഗ സ്ഥിതിവിവരക്കണക്കുകൾ","p":["ഏതെല്ലാം ഫീച്ചറുകൾ ഉപയോഗിക്കപ്പെടുന്നുവെന്ന് മനസ്സിലാക്കാനും പ്രശ്നങ്ങൾ പരിഹരിക്കാനും, ആപ്പ് അജ്ഞാത ഉപയോഗ ഇവന്റുകൾ (ഉദാഹരണത്തിന്: ഏത് സ്ക്രീൻ തുറന്നു, ഖിബ്‌ല കണ്ടെത്തിയോ, ആപ്പ് പതിപ്പ്, ഉപകരണത്തിന്റെ തരം) യൂറോപ്യൻ യൂണിയനിലെ സെർവറുകളിൽ ഹോസ്റ്റ് ചെയ്തിരിക്കുന്ന PostHog-ലേക്ക് അയയ്ക്കുന്നു. ഈ ഇവന്റുകളിൽ നിങ്ങളുടെ പേരോ ലൊക്കേഷനോ ക്യാമറ ചിത്രങ്ങളോ ഉൾപ്പെടുന്നില്ല. ഏതൊരു ഇന്റർനെറ്റ് കണക്ഷനിലുമെന്നപോലെ, ഉദാഹരണത്തിന് രാജ്യം അനുമാനിക്കുന്നതിനായി, ഈ സേവനം നിങ്ങളുടെ IP വിലാസം പ്രോസസ്സ് ചെയ്തേക്കാം.","ക്രമീകരണങ്ങൾ → “ഉപയോഗ സ്ഥിതിവിവരക്കണക്കുകൾ” എന്നതിൽ നിങ്ങൾക്ക് ഏത് സമയത്തും ഇത് ഓഫ് ചെയ്യാം."]},{"h":"5. പരസ്യങ്ങൾ","p":["Qibora-യുടെ സൗജന്യ പതിപ്പ് Google AdMob നൽകുന്ന പരസ്യങ്ങൾ കാണിക്കുന്നു. പരസ്യങ്ങൾ കാണിക്കാനും അളക്കാനും, നിങ്ങളുടെ അനുമതിയോടെ അവ വ്യക്തിഗതമാക്കാനും, Google നിങ്ങളുടെ ഉപകരണത്തിന്റെ പരസ്യ ഐഡന്റിഫയറും സമാനമായ വിവരങ്ങളും ഉപയോഗിച്ചേക്കാം.","iPhone-ൽ, ആപ്പ് ചോദിക്കുമ്പോൾ നിങ്ങൾ ട്രാക്കിംഗ് അനുവദിച്ചാൽ മാത്രമേ വ്യക്തിഗതമാക്കിയ പരസ്യങ്ങൾ ഉപയോഗിക്കുകയുള്ളൂ. യൂറോപ്യൻ സാമ്പത്തിക മേഖല, യുണൈറ്റഡ് കിംഗ്ഡം, സ്വിറ്റ്സർലൻഡ് എന്നിവിടങ്ങളിൽ, പരസ്യങ്ങൾക്കായി നിങ്ങളുടെ ഡാറ്റ എങ്ങനെ ഉപയോഗിക്കണമെന്ന് തിരഞ്ഞെടുക്കാൻ ഒരു സമ്മത വിൻഡോ നിങ്ങളെ അനുവദിക്കുന്നു. ഫോണിന്റെ ക്രമീകരണങ്ങളിൽ നിങ്ങളുടെ പരസ്യ ഐഡന്റിഫയർ റീസെറ്റ് ചെയ്യാനോ പരിമിതപ്പെടുത്താനോ നിങ്ങൾക്ക് കഴിയും.","പൊതു പ്രേക്ഷകർക്ക് അനുയോജ്യമാകുന്ന വിധത്തിൽ പരസ്യങ്ങൾ ഫിൽട്ടർ ചെയ്യുന്നു. കൂടുതൽ വിവരങ്ങൾ: https://policies.google.com/technologies/ads","Qibora Pro എല്ലാ പരസ്യങ്ങളും നീക്കം ചെയ്യുന്നു."]},{"h":"6. വാങ്ങലുകൾ","p":["Qibora Pro വിൽക്കുന്നത് App Store അല്ലെങ്കിൽ Google Play വഴിയാണ്. പണമിടപാടുകൾ പൂർണ്ണമായും കൈകാര്യം ചെയ്യുന്നത് Apple അല്ലെങ്കിൽ Google ആണ്; നിങ്ങളുടെ കാർഡ് വിവരങ്ങളോ പേയ്‌മെന്റ് വിശദാംശങ്ങളോ ഞങ്ങൾ ഒരിക്കലും കാണുന്നില്ല.","നിങ്ങൾ സ്വന്തമാക്കിയ വാങ്ങലുകൾ സ്ഥിരീകരിക്കാനും അവ പുനഃസ്ഥാപിക്കാനും ആപ്പ് RevenueCat ഉപയോഗിക്കുന്നു; അതിന് ഒരു അജ്ഞാത ആപ്പ് ഉപയോക്തൃ ഐഡിയും നിങ്ങളുടെ സ്റ്റോർ വാങ്ങൽ രസീതുകളും ലഭിക്കുന്നു. നിങ്ങളുടെ പേരോ പേയ്‌മെന്റ് വിശദാംശങ്ങളോ അതിന് ലഭിക്കുന്നില്ല."]},{"h":"7. കുട്ടികൾ","p":["Qibora പൊതു പ്രേക്ഷകർക്കുള്ള ഒരു ആപ്പാണ്; ഇത് 13 വയസ്സിന് താഴെയുള്ള കുട്ടികളെ ലക്ഷ്യമിട്ടുള്ളതല്ല. കുട്ടികളിൽ നിന്ന് ഞങ്ങൾ അറിഞ്ഞുകൊണ്ട് വ്യക്തിഗത വിവരങ്ങൾ ശേഖരിക്കുന്നില്ല."]},{"h":"8. നിങ്ങളുടെ തിരഞ്ഞെടുപ്പുകളും അവകാശങ്ങളും","p":["ഫോണിന്റെ ക്രമീകരണങ്ങളിൽ ലൊക്കേഷൻ, ക്യാമറ അനുമതികൾ നിരസിക്കാനോ പിൻവലിക്കാനോ (ലൊക്കേഷൻ ഇല്ലാതെ ആപ്പിന് ഖിബ്‌ല കണ്ടെത്താൻ കഴിയില്ല), ആപ്പിൽ ഉപയോഗ സ്ഥിതിവിവരക്കണക്കുകൾ ഓഫ് ചെയ്യാനോ, പരസ്യ സമ്മതമോ ട്രാക്കിംഗ് തിരഞ്ഞെടുപ്പോ മാറ്റാനോ, ആപ്പ് ഡിലീറ്റ് ചെയ്ത് ഫോണിൽ സൂക്ഷിച്ചിട്ടുള്ള എല്ലാ ഡാറ്റയും ഇല്ലാതാക്കാനോ നിങ്ങൾക്ക് കഴിയും.","നിങ്ങൾ താമസിക്കുന്ന സ്ഥലത്തെ ആശ്രയിച്ച് (ഉദാഹരണത്തിന് GDPR, UK GDPR, തുർക്കിയുടെ KVKK അല്ലെങ്കിൽ കാലിഫോർണിയയുടെ CCPA പ്രകാരം), വ്യക്തിഗത ഡാറ്റ ആക്സസ് ചെയ്യാനും തിരുത്താനും ഇല്ലാതാക്കാനും അതിന്റെ പ്രോസസ്സിംഗിനെ എതിർക്കാനുമുള്ള അവകാശം നിങ്ങൾക്ക് ഉണ്ടായിരിക്കാം. നിങ്ങളെ തിരിച്ചറിയാൻ കഴിയുന്ന ഡാറ്റ ഞങ്ങൾ സൂക്ഷിക്കാത്തതിനാൽ, മിക്ക അഭ്യർത്ഥനകളും മുകളിൽ പറഞ്ഞ മാർഗ്ഗങ്ങളിലൂടെ നിറവേറ്റാനാകും; താഴെയുള്ള വിലാസത്തിൽ നിങ്ങൾക്ക് ഞങ്ങളെ ബന്ധപ്പെടുകയും ചെയ്യാം."]},{"h":"9. ഈ നയത്തിലെ മാറ്റങ്ങൾ","p":["ആപ്പിൽ മാറ്റങ്ങൾ വരുമ്പോൾ ഞങ്ങൾ ഈ നയം പുതുക്കിയേക്കാം. മുകളിൽ നൽകിയിരിക്കുന്ന തീയതി ഏറ്റവും പുതിയ പതിപ്പിനെ സൂചിപ്പിക്കുന്നു."]},{"h":"10. ബന്ധപ്പെടലും പിന്തുണയും","p":["ഈ നയത്തെക്കുറിച്ചുള്ള ചോദ്യങ്ങൾക്കും ആപ്പുമായി ബന്ധപ്പെട്ട സഹായത്തിനും വാങ്ങലിലെ പ്രശ്നങ്ങൾക്കും miswakapp@gmail.com എന്ന വിലാസത്തിൽ ഞങ്ങൾക്ക് എഴുതുക."]}],"langLabel":"ഭാഷ","supportTitle":"പിന്തുണ","supportText":"Qibora-യെക്കുറിച്ചോ ഒരു വാങ്ങലിനെക്കുറിച്ചോ സഹായം വേണോ? miswakapp@gmail.com എന്ന വിലാസത്തിൽ ഞങ്ങൾക്ക് ഇമെയിൽ ചെയ്യുക — സാധാരണയായി ഏതാനും ദിവസങ്ങൾക്കുള്ളിൽ ഞങ്ങൾ മറുപടി നൽകും."},"ta":{"langName":"தமிழ்","title":"Qibora – தனியுரிமைக் கொள்கை","updated":"கடைசியாகப் புதுப்பிக்கப்பட்டது: 24 அக்டோபர் 2026","intro":"Qibora (“செயலி”) கிப்லா திசையையும் அருகிலுள்ள பள்ளிவாசல்களையும் கண்டறிய உங்களுக்கு உதவுகிறது. செயலி எந்தத் தகவல்களைப் பயன்படுத்துகிறது, அவை எங்கு செல்கின்றன, உங்களுக்கு என்னென்ன தேர்வுகள் உள்ளன என்பதை இந்தக் கொள்கை விளக்குகிறது. சுருக்கமாக: கிப்லா உங்கள் தொலைபேசியிலேயே கணக்கிடப்படுகிறது, உங்கள் இருப்பிடத்தைச் சேமிக்கும் சேவையகங்கள் எதையும் நாங்கள் இயக்குவதில்லை, உங்கள் தனிப்பட்ட தரவை நாங்கள் விற்பதும் இல்லை.","sections":[{"h":"1. உங்கள் இருப்பிடம்","p":["நீங்கள் செயலியைப் பயன்படுத்தும்போது மட்டுமே அது உங்கள் இருப்பிடத்தைக் கேட்கிறது. கிப்லா திசையையும் கஅபாவுக்கான தூரத்தையும் கணக்கிட, உங்கள் இருப்பிடம் உங்கள் தொலைபேசியிலேயே பயன்படுத்தப்படுகிறது. அது எங்கள் சேவையகங்களுக்கு அனுப்பப்படுவதில்லை; நாங்கள் அதைச் சேமிப்பதும் இல்லை.","அருகிலுள்ள பள்ளிவாசல்களைக் காண நீங்கள் வரைபடத் திரையைத் திறக்கும்போது, உங்களைச் சுற்றியுள்ள பள்ளிவாசல்களைத் தேடுவதற்காக, சுமார் 1 கி.மீ. அளவுக்கு முழுமையாக்கப்பட்ட (rounded) தோராயமான இருப்பிடத்தைச் செயலி இலவச OpenStreetMap Overpass சேவைக்கு (overpass-api.de, அல்லது மாற்றுச் சேவையாக overpass.kumi.systems) அனுப்புகிறது. இந்தக் கோரிக்கையுடன் பெயர், கணக்கு அல்லது சாதன அடையாளங்காட்டி எதுவும் இணைக்கப்படுவதில்லை. பள்ளிவாசல் தரவு © OpenStreetMap பங்களிப்பாளர்கள், ODbL உரிமத்தின் கீழ் கிடைக்கிறது.","வரைபடம் உங்கள் தொலைபேசியின் வரைபடச் சேவையால் காட்டப்படுகிறது (iPhone-இல் Apple Maps, Android-இல் Google Maps); அதற்கு Apple அல்லது Google நிறுவனத்தின் சொந்தத் தனியுரிமைக் கொள்கை பொருந்தும்."]},{"h":"2. கேமரா","p":["நேரடி கேமரா காட்சியின் மேல் கிப்லா திசையைக் காட்டுவதற்காக, AR திரையில் மட்டுமே கேமரா பயன்படுத்தப்படுகிறது. படங்கள் உங்கள் தொலைபேசியில் நிகழ்நேரத்தில் செயலாக்கப்படுகின்றன; எதுவும் பதிவு செய்யப்படுவதோ, சேமிக்கப்படுவதோ, பதிவேற்றப்படுவதோ இல்லை."]},{"h":"3. உங்கள் தொலைபேசியில் சேமிக்கப்படும் தகவல்கள்","p":["உங்கள் அமைப்புகள் (தேர்ந்தெடுத்த வடிவமைப்பு, தீம், எழுத்து அளவு, கடைசியாகப் பயன்படுத்திய திரை மற்றும் இதுபோன்ற விருப்பங்கள்) உங்கள் தொலைபேசியில் மட்டுமே சேமிக்கப்படுகின்றன. செயலியை நீக்கினால் அவையும் நீக்கப்படும்."]},{"h":"4. அநாமதேயப் பயன்பாட்டுப் புள்ளிவிவரங்கள்","p":["எந்த அம்சங்கள் பயன்படுத்தப்படுகின்றன என்பதைப் புரிந்துகொள்ளவும் சிக்கல்களைச் சரிசெய்யவும், செயலி அநாமதேயப் பயன்பாட்டு நிகழ்வுகளை (எடுத்துக்காட்டாக: எந்தத் திரை திறக்கப்பட்டது, கிப்லா கண்டறியப்பட்டதா, செயலியின் பதிப்பு மற்றும் சாதன வகை) ஐரோப்பிய ஒன்றியத்தில் உள்ள சேவையகங்களில் இயங்கும் PostHog-க்கு அனுப்புகிறது. இந்த நிகழ்வுகளில் உங்கள் பெயர், உங்கள் இருப்பிடம் அல்லது கேமரா படங்கள் இடம்பெறுவதில்லை. எந்தவொரு இணைய இணைப்பிலும் உள்ளதைப் போலவே, எடுத்துக்காட்டாக நாட்டைக் கணிப்பதற்காக, இந்தச் சேவை உங்கள் IP முகவரியைச் செயலாக்கக்கூடும்.","நீங்கள் எப்போது வேண்டுமானாலும் அமைப்புகள் → “பயன்பாட்டுப் புள்ளிவிவரங்கள்” என்பதில் இதை முடக்கலாம்."]},{"h":"5. விளம்பரங்கள்","p":["Qibora-வின் இலவசப் பதிப்பு Google AdMob வழங்கும் விளம்பரங்களைக் காட்டுகிறது. விளம்பரங்களைக் காட்டவும் அளவிடவும், உங்கள் அனுமதியுடன் அவற்றைத் தனிப்பயனாக்கவும், Google உங்கள் சாதனத்தின் விளம்பர அடையாளங்காட்டியையும் இதுபோன்ற தகவல்களையும் பயன்படுத்தக்கூடும்.","iPhone-இல், செயலி கேட்கும்போது நீங்கள் கண்காணிப்பை (tracking) அனுமதித்தால் மட்டுமே தனிப்பயனாக்கப்பட்ட விளம்பரங்கள் பயன்படுத்தப்படும். ஐரோப்பியப் பொருளாதாரப் பகுதி, ஐக்கிய இராச்சியம், சுவிட்சர்லாந்து ஆகியவற்றில், விளம்பரங்களுக்காக உங்கள் தரவு எவ்வாறு பயன்படுத்தப்பட வேண்டும் என்பதைத் தேர்வுசெய்ய ஒப்புதல் சாளரம் ஒன்று உங்களை அனுமதிக்கிறது. உங்கள் தொலைபேசியின் அமைப்புகளில் உங்கள் விளம்பர அடையாளங்காட்டியை மீட்டமைக்கவோ வரம்பிடவோ உங்களால் முடியும்.","பொதுப் பார்வையாளர்களுக்கு ஏற்றவையாக இருக்கும் வகையில் விளம்பரங்கள் வடிகட்டப்படுகின்றன. மேலும் தகவலுக்கு: https://policies.google.com/technologies/ads","Qibora Pro அனைத்து விளம்பரங்களையும் நீக்குகிறது."]},{"h":"6. வாங்குதல்கள்","p":["Qibora Pro, App Store அல்லது Google Play வழியாக விற்கப்படுகிறது. பணம் செலுத்துதல்கள் முழுவதுமாக Apple அல்லது Google நிறுவனத்தால் கையாளப்படுகின்றன; உங்கள் கார்டு அல்லது கட்டண விவரங்களை நாங்கள் ஒருபோதும் பார்ப்பதில்லை.","நீங்கள் வாங்கியவற்றை உறுதிப்படுத்தவும் அவற்றை மீட்டமைக்கவும் செயலி RevenueCat-ஐப் பயன்படுத்துகிறது; அது ஒரு அநாமதேயச் செயலிப் பயனர் ID-யையும் உங்கள் ஸ்டோர் கொள்முதல் ரசீதுகளையும் பெறுகிறது. அது உங்கள் பெயரையோ கட்டண விவரங்களையோ பெறுவதில்லை."]},{"h":"7. குழந்தைகள்","p":["Qibora பொதுப் பார்வையாளர்களுக்கான செயலி; இது 13 வயதுக்குட்பட்ட குழந்தைகளை நோக்கமாகக் கொண்டதல்ல. குழந்தைகளிடமிருந்து நாங்கள் தெரிந்தே தனிப்பட்ட தகவல்களைச் சேகரிப்பதில்லை."]},{"h":"8. உங்கள் தேர்வுகளும் உரிமைகளும்","p":["உங்கள் தொலைபேசியின் அமைப்புகளில் இருப்பிட மற்றும் கேமரா அனுமதிகளை மறுக்கவோ திரும்பப் பெறவோ (இருப்பிடம் இல்லாமல் செயலியால் கிப்லாவைக் கண்டறிய முடியாது), செயலியில் பயன்பாட்டுப் புள்ளிவிவரங்களை முடக்கவோ, உங்கள் விளம்பர ஒப்புதலையோ கண்காணிப்புத் தேர்வையோ மாற்றவோ, செயலியை நீக்குவதன் மூலம் தொலைபேசியில் சேமிக்கப்பட்ட எல்லாத் தரவையும் நீக்கவோ உங்களால் முடியும்.","நீங்கள் வசிக்கும் இடத்தைப் பொறுத்து (எடுத்துக்காட்டாக GDPR, UK GDPR, துருக்கியின் KVKK அல்லது கலிபோர்னியாவின் CCPA-வின் கீழ்), தனிப்பட்ட தரவை அணுகவும், திருத்தவும் அல்லது நீக்கவும், அதன் செயலாக்கத்தை எதிர்க்கவும் உங்களுக்கு உரிமை இருக்கலாம். உங்களை அடையாளம் காட்டும் தரவை நாங்கள் வைத்திருக்காததால், பெரும்பாலான கோரிக்கைகளை மேலே உள்ள வழிகள் மூலம் நிறைவேற்ற முடியும்; கீழே உள்ள முகவரியில் நீங்கள் எங்களைத் தொடர்புகொள்ளவும் செய்யலாம்."]},{"h":"9. இந்தக் கொள்கையில் மாற்றங்கள்","p":["செயலியில் மாற்றங்கள் ஏற்படும்போது இந்தக் கொள்கையை நாங்கள் புதுப்பிக்கக்கூடும். மேலே உள்ள தேதி சமீபத்திய பதிப்பைக் குறிக்கிறது."]},{"h":"10. தொடர்பு மற்றும் ஆதரவு","p":["இந்தக் கொள்கை பற்றிய கேள்விகள், செயலி தொடர்பான உதவி அல்லது வாங்குதலில் உள்ள சிக்கல்களுக்கு, miswakapp@gmail.com என்ற முகவரிக்கு எங்களுக்கு எழுதுங்கள்."]}],"langLabel":"மொழி","supportTitle":"ஆதரவு","supportText":"Qibora அல்லது ஒரு வாங்குதல் தொடர்பாக உதவி தேவையா? miswakapp@gmail.com என்ற முகவரிக்கு எங்களுக்கு மின்னஞ்சல் அனுப்புங்கள் — வழக்கமாக சில நாட்களுக்குள் பதிலளிப்போம்."},"th":{"langName":"ไทย","title":"Qibora – นโยบายความเป็นส่วนตัว","updated":"ปรับปรุงล่าสุด: 24 ตุลาคม 2569","intro":"Qibora (“แอป”) ช่วยให้คุณค้นหาทิศกิบลัตและมัสยิดใกล้เคียง นโยบายนี้อธิบายว่าแอปใช้ข้อมูลใดบ้าง ข้อมูลดังกล่าวถูกส่งไปที่ใด และคุณมีทางเลือกอะไรบ้าง โดยสรุป: ทิศกิบลัตคำนวณบนโทรศัพท์ของคุณ เราไม่ได้ดำเนินการเซิร์ฟเวอร์ใดที่จัดเก็บตำแหน่งของคุณ และเราไม่ขายข้อมูลส่วนบุคคลของคุณ","sections":[{"h":"1. ตำแหน่งของคุณ","p":["แอปจะขอเข้าถึงตำแหน่งของคุณเฉพาะขณะที่คุณใช้งานแอปเท่านั้น ตำแหน่งของคุณจะถูกใช้บนโทรศัพท์ของคุณเพื่อคำนวณทิศกิบลัตและระยะทางไปยังกะอ์บะฮ์ ตำแหน่งนี้จะไม่ถูกส่งไปยังเซิร์ฟเวอร์ของเรา และเราไม่ได้จัดเก็บไว้","เมื่อคุณเปิดหน้าจอแผนที่เพื่อดูมัสยิดใกล้เคียง แอปจะส่งตำแหน่งโดยประมาณซึ่งปัดเศษให้มีความละเอียดประมาณ 1 กม. ไปยังบริการ OpenStreetMap Overpass ที่ให้บริการฟรี (overpass-api.de หรือ overpass.kumi.systems เป็นบริการสำรอง) เพื่อค้นหามัสยิดรอบตัวคุณ คำขอนี้ไม่มีการแนบชื่อ บัญชี หรือตัวระบุอุปกรณ์ใด ๆ ข้อมูลมัสยิด © ผู้ร่วมให้ข้อมูล OpenStreetMap เผยแพร่ภายใต้สัญญาอนุญาต ODbL","ตัวแผนที่แสดงผลโดยบริการแผนที่ของโทรศัพท์คุณ (Apple Maps บน iPhone และ Google Maps บน Android) ซึ่งอยู่ภายใต้นโยบายความเป็นส่วนตัวของ Apple หรือ Google เอง"]},{"h":"2. กล้อง","p":["กล้องจะถูกใช้เฉพาะในหน้าจอ AR เพื่อแสดงทิศกิบลัตซ้อนบนภาพจากกล้องแบบสด ภาพจะได้รับการประมวลผลบนโทรศัพท์ของคุณแบบเรียลไทม์ โดยไม่มีการบันทึก จัดเก็บ หรืออัปโหลดสิ่งใดทั้งสิ้น"]},{"h":"3. ข้อมูลที่จัดเก็บบนโทรศัพท์ของคุณ","p":["การตั้งค่าของคุณ (ดีไซน์ที่เลือก ธีม ขนาดตัวอักษร หน้าจอที่ใช้ล่าสุด และค่ากำหนดอื่นที่คล้ายกัน) จะถูกจัดเก็บไว้บนโทรศัพท์ของคุณเท่านั้น และจะถูกลบไปเมื่อคุณลบแอป"]},{"h":"4. สถิติการใช้งานแบบไม่ระบุตัวตน","p":["เพื่อให้เข้าใจว่ามีการใช้ฟีเจอร์ใดบ้างและเพื่อแก้ไขปัญหา แอปจะส่งเหตุการณ์การใช้งานแบบไม่ระบุตัวตน (เช่น หน้าจอใดถูกเปิด พบทิศกิบลัตหรือไม่ เวอร์ชันของแอป และประเภทอุปกรณ์) ไปยัง PostHog ซึ่งโฮสต์อยู่บนเซิร์ฟเวอร์ในสหภาพยุโรป เหตุการณ์เหล่านี้ไม่รวมชื่อ ตำแหน่ง หรือภาพจากกล้องของคุณ เช่นเดียวกับการเชื่อมต่ออินเทอร์เน็ตทั่วไป ที่อยู่ IP ของคุณอาจถูกประมวลผลโดยบริการดังกล่าว เช่น เพื่อประมาณว่าคุณอยู่ในประเทศใด","คุณสามารถปิดการส่งข้อมูลนี้ได้ทุกเมื่อที่ การตั้งค่า → “สถิติการใช้งาน”"]},{"h":"5. โฆษณา","p":["Qibora เวอร์ชันฟรีแสดงโฆษณาที่ให้บริการโดย Google AdMob ทั้งนี้ Google อาจใช้ตัวระบุโฆษณาของอุปกรณ์คุณและข้อมูลที่คล้ายกันเพื่อแสดงและวัดผลโฆษณา และเพื่อปรับโฆษณาให้เหมาะกับคุณเมื่อได้รับอนุญาตจากคุณ","บน iPhone จะมีการใช้โฆษณาที่ปรับให้เหมาะกับคุณก็ต่อเมื่อคุณอนุญาตการติดตามเมื่อแอปขอเท่านั้น ในเขตเศรษฐกิจยุโรป สหราชอาณาจักร และสวิตเซอร์แลนด์ จะมีหน้าต่างขอความยินยอมให้คุณเลือกว่าจะให้ใช้ข้อมูลของคุณสำหรับโฆษณาอย่างไร นอกจากนี้ คุณยังสามารถรีเซ็ตหรือจำกัดตัวระบุโฆษณาของคุณได้ในการตั้งค่าของโทรศัพท์","โฆษณาได้รับการกรองให้เหมาะสมกับผู้ชมทั่วไป ข้อมูลเพิ่มเติม: https://policies.google.com/technologies/ads","Qibora Pro จะนำโฆษณาออกทั้งหมด"]},{"h":"6. การซื้อ","p":["Qibora Pro จำหน่ายผ่าน App Store หรือ Google Play การชำระเงินดำเนินการโดย Apple หรือ Google ทั้งหมด เราไม่เคยเห็นรายละเอียดบัตรหรือการชำระเงินของคุณ","เพื่อยืนยันว่าคุณเป็นเจ้าของรายการซื้อใดและเพื่อกู้คืนรายการซื้อเหล่านั้น แอปใช้ RevenueCat ซึ่งจะได้รับรหัสผู้ใช้แอปแบบไม่ระบุตัวตนและใบเสร็จการซื้อจากสโตร์ของคุณ โดย RevenueCat จะไม่ได้รับชื่อหรือรายละเอียดการชำระเงินของคุณ"]},{"h":"7. เด็ก","p":["Qibora เป็นแอปสำหรับผู้ใช้ทั่วไปและไม่ได้มุ่งเป้าไปที่เด็กอายุต่ำกว่า 13 ปี เราไม่เก็บรวบรวมข้อมูลส่วนบุคคลจากเด็กโดยเจตนา"]},{"h":"8. ทางเลือกและสิทธิของคุณ","p":["คุณสามารถปฏิเสธหรือเพิกถอนสิทธิ์การเข้าถึงตำแหน่งและกล้องได้ในการตั้งค่าของโทรศัพท์ (หากไม่มีตำแหน่ง แอปจะไม่สามารถหาทิศกิบลัตได้) ปิดสถิติการใช้งานในแอป เปลี่ยนความยินยอมด้านโฆษณาหรือตัวเลือกการติดตาม และลบข้อมูลทั้งหมดที่จัดเก็บไว้ในเครื่องได้โดยการลบแอป","ทั้งนี้ขึ้นอยู่กับถิ่นที่อยู่ของคุณ (เช่น ภายใต้ GDPR, UK GDPR, KVKK ของตุรกี หรือ CCPA ของรัฐแคลิฟอร์เนีย) คุณอาจมีสิทธิในการเข้าถึง แก้ไข หรือลบข้อมูลส่วนบุคคล และคัดค้านการประมวลผลข้อมูลดังกล่าว เนื่องจากเราไม่ได้เก็บข้อมูลที่ระบุตัวตนของคุณ คำขอส่วนใหญ่จึงสามารถดำเนินการได้ด้วยตัวเลือกข้างต้น และคุณยังสามารถติดต่อเราได้ที่ที่อยู่ด้านล่าง"]},{"h":"9. การเปลี่ยนแปลงนโยบายนี้","p":["เราอาจปรับปรุงนโยบายนี้เมื่อแอปมีการเปลี่ยนแปลง วันที่ด้านบนแสดงถึงฉบับล่าสุด"]},{"h":"10. การติดต่อและความช่วยเหลือ","p":["หากมีคำถามเกี่ยวกับนโยบายนี้ ต้องการความช่วยเหลือเกี่ยวกับแอป หรือพบปัญหาเกี่ยวกับการซื้อ โปรดเขียนถึงเราที่ miswakapp@gmail.com"]}],"langLabel":"ภาษา","supportTitle":"ความช่วยเหลือ","supportText":"หากต้องการความช่วยเหลือเกี่ยวกับ Qibora หรือการซื้อ โปรดส่งอีเมลถึงเราที่ miswakapp@gmail.com — โดยปกติเราจะตอบกลับภายในไม่กี่วัน"},"ja":{"langName":"日本語","title":"Qibora – プライバシーポリシー","updated":"最終更新日：2026年10月24日","intro":"Qibora（以下「本アプリ」）は、キブラの方角と近くのモスクを見つけるためのアプリです。本ポリシーでは、本アプリが使用する情報、その送信先、およびお客様が選択できる事項について説明します。要約すると、キブラはお客様の端末上で計算され、当方はお客様の位置情報を保存するサーバーを運用しておらず、お客様の個人データを販売することもありません。","sections":[{"h":"1. 位置情報","p":["本アプリは、ご利用中に限り位置情報へのアクセスを求めます。位置情報は、キブラの方角とカアバまでの距離を計算するために、お客様の端末上で使用されます。位置情報が当方のサーバーに送信されることはなく、当方が保存することもありません。","近くのモスクを表示するために地図画面を開くと、本アプリは周辺のモスクを検索するため、約1 km単位に丸めたおおよその位置情報を、無料のOpenStreetMap Overpassサービス（overpass-api.de、予備としてoverpass.kumi.systems）に送信します。このリクエストには、氏名、アカウント、端末識別子は一切付加されません。モスクのデータ © OpenStreetMapの貢献者（ODbLライセンスの下で提供）。","地図自体はお客様の端末の地図サービス（iPhoneではApple マップ、AndroidではGoogle マップ）によって表示され、AppleまたはGoogleそれぞれのプライバシーポリシーが適用されます。"]},{"h":"2. カメラ","p":["カメラはAR画面でのみ、ライブのカメラ映像にキブラの方角を重ねて表示するために使用されます。映像はお客様の端末上でリアルタイムに処理され、録画、保存、アップロードされることは一切ありません。"]},{"h":"3. 端末に保存される情報","p":["お客様の設定（選択したデザイン、テーマ、文字サイズ、最後に使用した画面などの各種設定）は、お客様の端末にのみ保存されます。本アプリを削除すると、これらの設定も削除されます。"]},{"h":"4. 匿名の利用統計","p":["利用されている機能を把握し、不具合を修正するため、本アプリは匿名の利用イベント（例：開かれた画面、キブラが見つかったかどうか、アプリのバージョン、端末の種類）を、欧州連合（EU）域内のサーバーでホストされているPostHogに送信します。これらのイベントには、お客様の氏名、位置情報、カメラ画像は含まれません。インターネット接続全般と同様に、国の推定などの目的で、お客様のIPアドレスが同サービスによって処理される場合があります。","この機能は、設定 →「利用統計」からいつでもオフにできます。"]},{"h":"5. 広告","p":["Qiboraの無料版では、Google AdMobが提供する広告が表示されます。Googleは、広告の表示および効果測定のため、またお客様の許可がある場合には広告のパーソナライズのために、お客様の端末の広告識別子およびこれに類する情報を使用することがあります。","iPhoneでは、本アプリからの確認に対してお客様がトラッキングを許可した場合にのみ、パーソナライズ広告が使用されます。欧州経済領域、英国、スイスでは、同意画面が表示され、広告のためにお客様のデータをどのように使用するかを選択できます。また、端末の設定で広告識別子をリセットまたは制限することもできます。","広告は、一般の利用者にふさわしい内容となるようフィルタリングされています。詳細：https://policies.google.com/technologies/ads","Qibora Proでは、すべての広告が表示されなくなります。"]},{"h":"6. 購入","p":["Qibora Proは、App StoreまたはGoogle Playを通じて販売されます。お支払いはすべてAppleまたはGoogleによって処理され、当方がお客様のカード情報や支払い情報を目にすることはありません。","お客様が所有する購入アイテムの確認および復元のため、本アプリはRevenueCatを使用します。RevenueCatが受け取るのは、匿名のアプリユーザーIDとストアの購入レシートであり、お客様の氏名や支払い情報は受け取りません。"]},{"h":"7. お子様について","p":["Qiboraは一般向けのアプリであり、13歳未満のお子様を対象としたものではありません。当方は、お子様から個人情報を故意に収集することはありません。"]},{"h":"8. お客様の選択と権利","p":["お客様は、端末の設定で位置情報およびカメラへのアクセス許可を拒否または取り消すこと（位置情報がない場合、本アプリはキブラを特定できません）、アプリ内で利用統計をオフにすること、広告に関する同意やトラッキングの選択を変更すること、および本アプリを削除することで端末内に保存されたすべてのデータを削除することができます。","お住まいの地域によっては（例えばGDPR、UK GDPR、トルコのKVKK、カリフォルニア州のCCPAに基づき）、個人データへのアクセス、訂正または削除を求める権利や、その処理に異議を申し立てる権利を有する場合があります。当方はお客様を特定できるデータを保有していないため、ほとんどのご要望には上記の方法で対応できます。下記の連絡先からお問い合わせいただくことも可能です。"]},{"h":"9. 本ポリシーの変更","p":["本アプリの変更に伴い、本ポリシーを更新することがあります。冒頭の日付が最新版を示しています。"]},{"h":"10. お問い合わせとサポート","p":["本ポリシーに関するご質問、本アプリのサポート、購入に関する問題については、miswakapp@gmail.com までご連絡ください。"]}],"langLabel":"言語","supportTitle":"サポート","supportText":"Qiboraやご購入についてお困りですか？miswakapp@gmail.com までメールでお問い合わせください。通常、数日以内にご返信いたします。"},"ko":{"langName":"한국어","title":"Qibora – 개인정보 처리방침","updated":"최종 업데이트: 2026년 10월 24일","intro":"Qibora(이하 “앱”)는 키블라 방향과 주변 모스크를 찾을 수 있도록 도와줍니다. 본 방침은 앱이 어떤 정보를 사용하는지, 그 정보가 어디로 전송되는지, 그리고 사용자가 선택할 수 있는 사항을 설명합니다. 요약하면, 키블라는 사용자의 휴대폰에서 계산되며, 당사는 사용자의 위치를 저장하는 서버를 운영하지 않고, 사용자의 개인 데이터를 판매하지 않습니다.","sections":[{"h":"1. 위치 정보","p":["앱은 사용 중일 때에만 위치 정보 접근을 요청합니다. 위치 정보는 키블라 방향과 카바까지의 거리를 계산하기 위해 사용자의 휴대폰에서 사용됩니다. 위치 정보는 당사 서버로 전송되지 않으며, 당사는 이를 저장하지 않습니다.","주변 모스크를 보기 위해 지도 화면을 열면, 앱은 주변의 모스크를 검색하기 위해 약 1km 단위로 반올림한 대략적인 위치를 무료 서비스인 OpenStreetMap Overpass(overpass-api.de, 백업으로 overpass.kumi.systems)로 전송합니다. 이 요청에는 이름, 계정 또는 기기 식별자가 일절 포함되지 않습니다. 모스크 데이터 © OpenStreetMap 기여자, ODbL 라이선스에 따라 제공됩니다.","지도 자체는 휴대폰의 지도 서비스(iPhone에서는 Apple 지도, Android에서는 Google 지도)를 통해 표시되며, 이는 Apple 또는 Google의 자체 개인정보 처리방침의 적용을 받습니다."]},{"h":"2. 카메라","p":["카메라는 AR 화면에서 실시간 카메라 화면 위에 키블라 방향을 표시하는 용도로만 사용됩니다. 영상은 사용자의 휴대폰에서 실시간으로 처리되며, 어떠한 내용도 녹화, 저장 또는 업로드되지 않습니다."]},{"h":"3. 휴대폰에 저장되는 정보","p":["사용자의 설정(선택한 디자인, 테마, 글자 크기, 마지막으로 사용한 화면 및 이와 유사한 환경설정)은 사용자의 휴대폰에만 저장됩니다. 앱을 삭제하면 이 설정도 함께 삭제됩니다."]},{"h":"4. 익명 사용 통계","p":["어떤 기능이 사용되는지 파악하고 문제를 해결하기 위해, 앱은 익명의 사용 이벤트(예: 열린 화면, 키블라를 찾았는지 여부, 앱 버전 및 기기 유형)를 유럽연합 내 서버에서 호스팅되는 PostHog로 전송합니다. 이러한 이벤트에는 사용자의 이름, 위치 또는 카메라 이미지가 포함되지 않습니다. 모든 인터넷 연결과 마찬가지로, 국가 추정 등을 위해 해당 서비스에서 사용자의 IP 주소를 처리할 수 있습니다.","이 기능은 언제든지 설정 → “사용 통계”에서 끌 수 있습니다."]},{"h":"5. 광고","p":["Qibora 무료 버전에는 Google AdMob에서 제공하는 광고가 표시됩니다. Google은 광고를 표시하고 측정하기 위해, 그리고 사용자가 허락한 경우 광고를 맞춤화하기 위해 기기의 광고 식별자 및 이와 유사한 정보를 사용할 수 있습니다.","iPhone에서는 앱이 요청할 때 사용자가 추적을 허용한 경우에만 맞춤 광고가 사용됩니다. 유럽경제지역, 영국 및 스위스에서는 동의 창을 통해 광고에 사용자의 데이터가 어떻게 사용될지 선택할 수 있습니다. 또한 휴대폰 설정에서 광고 식별자를 재설정하거나 제한할 수도 있습니다.","광고는 일반 이용자에게 적합하도록 필터링됩니다. 자세한 정보: https://policies.google.com/technologies/ads","Qibora Pro에서는 모든 광고가 제거됩니다."]},{"h":"6. 구매","p":["Qibora Pro는 App Store 또는 Google Play를 통해 판매됩니다. 결제는 전적으로 Apple 또는 Google이 처리하며, 당사는 사용자의 카드 정보나 결제 정보를 절대 볼 수 없습니다.","사용자가 보유한 구매 항목을 확인하고 복원하기 위해 앱은 RevenueCat을 사용하며, RevenueCat은 익명의 앱 사용자 ID와 스토어 구매 영수증을 받습니다. RevenueCat은 사용자의 이름이나 결제 정보를 받지 않습니다."]},{"h":"7. 아동","p":["Qibora는 일반 이용자를 위한 앱이며 13세 미만 아동을 대상으로 하지 않습니다. 당사는 아동의 개인정보를 고의로 수집하지 않습니다."]},{"h":"8. 사용자의 선택 및 권리","p":["사용자는 휴대폰 설정에서 위치 및 카메라 권한을 거부하거나 철회할 수 있으며(위치 정보 없이는 앱이 키블라를 찾을 수 없습니다), 앱에서 사용 통계를 끄고, 광고 동의 또는 추적 관련 선택을 변경하며, 앱을 삭제하여 기기에 저장된 모든 데이터를 삭제할 수 있습니다.","거주 지역에 따라(예: GDPR, UK GDPR, 튀르키예의 KVKK 또는 캘리포니아의 CCPA에 따라) 사용자는 개인 데이터의 열람, 정정 또는 삭제를 요청하고 그 처리에 이의를 제기할 권리를 가질 수 있습니다. 당사는 사용자를 식별할 수 있는 데이터를 보유하지 않으므로 대부분의 요청은 위의 방법으로 처리할 수 있으며, 아래 주소로 당사에 문의하실 수도 있습니다."]},{"h":"9. 본 방침의 변경","p":["앱이 변경되는 경우 본 방침을 업데이트할 수 있습니다. 상단의 날짜는 최신 버전을 나타냅니다."]},{"h":"10. 문의 및 지원","p":["본 방침에 관한 문의, 앱 사용에 관한 도움 또는 구매 관련 문제는 miswakapp@gmail.com으로 연락해 주시기 바랍니다."]}],"langLabel":"언어","supportTitle":"지원","supportText":"Qibora 또는 구매와 관련하여 도움이 필요하신가요? miswakapp@gmail.com으로 이메일을 보내 주세요. 보통 며칠 이내에 답변을 드립니다."}};
const SIRA = ["en", "tr", "ar", "id", "ms", "bn", "ur", "hi", "fa", "ps", "uz", "kk", "az", "ky", "tk", "tg", "ha", "sw", "so", "am", "yo", "sq", "bs", "fr", "de", "es", "pt", "nl", "it", "ru", "ku", "ckb", "ml", "ta", "th", "ja", "ko"];
const RTL = new Set(["ar", "ckb", "fa", "ps", "ur"]);
const kac = (s) => s.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bagla(s) {
  return kac(s)
    .replace(/https?:\/\/[^\s<)]+[^\s<).,;:!?»”"]/g, (u) => `<a href="${u}" rel="noopener">${u}</a>`)
    .replace(/miswakapp@gmail\.com/g, '<a href="mailto:miswakapp@gmail.com">miswakapp@gmail.com</a>');
}
function goster(kod) {
  const d = VERI[kod] || VERI.en;
  document.documentElement.lang = kod;
  document.documentElement.dir = RTL.has(kod) ? 'rtl' : 'ltr';
  document.title = d.title;
  document.getElementById('dilEtiket').textContent = d.langLabel;
  let h = `<h1>${kac(d.title)}</h1><p class="tarih">${kac(d.updated)}</p><div class="kart"><p>${bagla(d.intro)}</p></div>`;
  for (const s of d.sections) h += `<section class="kart"><h2>${kac(s.h)}</h2>${s.p.map((p) => `<p>${bagla(p)}</p>`).join('')}</section>`;
  h += `<section class="kart destek" id="support"><h2>${kac(d.supportTitle)}</h2><p>${bagla(d.supportText)}</p></section>`;
  document.getElementById('icerik').innerHTML = h;
  document.getElementById('dil').value = kod;
  try { localStorage.setItem('qibora.dil', kod); } catch (e) {}
}
const sec = document.getElementById('dil');
for (const kod of SIRA) if (VERI[kod]) sec.add(new Option(VERI[kod].langName, kod));
sec.addEventListener('change', () => {
  goster(sec.value);
  const u = new URL(location.href); u.searchParams.set('lang', sec.value); history.replaceState(null, '', u);
});
function baslangic() {
  const q = new URLSearchParams(location.search).get('lang');
  if (q && VERI[q]) return q;
  try { const k = localStorage.getItem('qibora.dil'); if (k && VERI[k]) return k; } catch (e) {}
  for (const l of navigator.languages || [navigator.language || 'en']) {
    const t = l.toLowerCase();
    if (t.startsWith('ckb') || t === 'ku-iq' || t === 'ku-arab') { if (VERI.ckb) return 'ckb'; }
    const k = t.split('-')[0];
    if (k === 'kmr' && VERI.ku) return 'ku';
    if (k === 'nb' || k === 'no') continue;
    if (VERI[k]) return k;
  }
  return 'en';
}
goster(baslangic());
</script>
